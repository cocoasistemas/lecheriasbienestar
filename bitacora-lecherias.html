<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1b2a">
<title>Bitácora de Lecherías · Pintura de Fachadas</title>
<style>
  :root{
    --navy:#0d1b2a; --navy2:#16263a; --steel:#3a4f66;
    --paper:#f4f6f8; --card:#ffffff; --line:#dfe5ec;
    --milk:#eef3f7; --ink:#11202e; --mut:#6b7b8c;
    --leche:#1f6feb;          /* azul leche bienestar */
    --leche-d:#1657c0;
    --done:#1f8a4c; --done-bg:#e3f3e9;
    --pend:#9aa7b4; --pend-bg:#eef1f4;
    --wait:#e08a1e; --wait-bg:#fbeed8;
    --rej:#c0362c; --rej-bg:#f8e3e1;
    --extra:#7b2ff7; --extra-bg:#efe6fe;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;overflow:hidden}
  .mono{font-family:'SF Mono','Roboto Mono',ui-monospace,Menlo,monospace}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;background:var(--paper);position:relative}

  header.top{background:var(--navy);color:#fff;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;border-bottom:3px solid var(--leche)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mk{width:30px;height:30px;border-radius:7px;background:var(--leche);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .brand b{font-size:14px;letter-spacing:.3px;font-weight:800;display:block;line-height:1.1}
  .brand span{font-size:9.5px;letter-spacing:1.5px;color:#8aa0b6;text-transform:uppercase}

  .contract{background:var(--navy2);color:#aebccb;padding:6px 15px;font-size:10.5px;display:flex;justify-content:space-between;flex:0 0 auto;letter-spacing:.3px}
  .contract b{color:#fff}

  .roleband{font-size:10px;text-align:center;padding:5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;flex:0 0 auto;color:#fff}
  .rb-sub{background:var(--leche)} .rb-gen{background:var(--steel)} .rb-admin{background:var(--wait)} .rb-dep{background:var(--navy)}

  /* min-max gauge */
  .minmax{background:var(--navy);padding:11px 15px 13px;flex:0 0 auto;color:#fff}
  .minmax .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .minmax .head .t{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8aa0b6}
  .minmax .head .big{font-size:13px;font-weight:800}
  .minmax .big b{color:var(--leche);font-size:20px}
  .track{position:relative;height:24px;background:var(--navy2);border-radius:6px;overflow:hidden}
  .track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--leche),#3d8bff);border-radius:6px;transition:width .6s cubic-bezier(.3,.7,.3,1)}
  .track .seg{position:absolute;top:0;bottom:0;width:2px;background:#fff}
  .track .seg .lab{position:absolute;top:26px;font-size:8.5px;color:#8aa0b6;transform:translateX(-50%);white-space:nowrap}
  .track .seg.maxseg .lab{color:#fff}
  .mmlegend{display:flex;gap:14px;margin-top:22px;font-size:9.5px;color:#8aa0b6}
  .mmlegend b{color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy2);flex:0 0 auto}
  .kpi{padding:8px 5px;text-align:center;border-left:1px solid #24364a}
  .kpi:first-child{border-left:none}
  .kpi .n{font-size:17px;font-weight:800;color:#fff;line-height:1}
  .kpi .n.acc{color:#5ea0ff}
  .kpi .l{font-size:8px;letter-spacing:.8px;color:#8aa0b6;text-transform:uppercase;margin-top:3px}

  .crumbs{display:flex;align-items:center;gap:7px;padding:9px 15px 4px;font-size:12px;flex:0 0 auto;color:var(--mut)}
  .crumbs a{color:var(--leche);font-weight:700;cursor:pointer;text-decoration:none}
  .crumbs .sep{color:var(--line)}

  .filters{display:flex;gap:6px;padding:7px 13px;overflow-x:auto;flex:0 0 auto}
  .filters::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--steel);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .search{flex:1;min-width:120px}
  .search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:12px}

  .scroll{flex:1 1 auto;overflow-y:auto;padding:4px 13px 80px}

  /* estado list */
  .estcard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;overflow:hidden;transition:transform .08s}
  .estcard:active{transform:scale(.99)}
  .estcard .top{display:flex;align-items:center;gap:11px;padding:12px 14px}
  .estcard .flag{width:42px;height:42px;border-radius:10px;background:var(--milk);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--leche);flex:0 0 auto;letter-spacing:-.5px}
  .estcard .nm{flex:1;min-width:0}
  .estcard .nm b{font-size:15px;font-weight:700;display:block}
  .estcard .nm span{font-size:11px;color:var(--mut)}
  .estcard .cnt{text-align:right;flex:0 0 auto}
  .estcard .cnt .num{font-size:19px;font-weight:800}
  .estcard .cnt .pct{font-size:10px;color:var(--mut)}
  .estbar{height:5px;background:var(--pend-bg)}
  .estbar .f{height:100%;background:var(--done);transition:width .4s}

  /* punto list */
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;cursor:pointer;transition:transform .08s}
  .card:active{transform:scale(.992)}
  .card .row1{display:flex;align-items:center;gap:10px;padding:11px 12px 8px}
  .pv{font-size:10px;font-weight:800;letter-spacing:.3px;background:var(--milk);color:var(--steel);padding:3px 7px;border-radius:5px;flex:0 0 auto}
  .addr{flex:1;min-width:0}
  .addr .a{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr .s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stbadge{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:4px 8px;border-radius:20px;flex:0 0 auto;text-transform:uppercase}
  .st-no{background:var(--pend-bg);color:var(--mut)} .st-at{background:var(--done-bg);color:var(--done)}
  .card .row2{display:flex;border-top:1px solid var(--line);font-size:10px}
  .meta{flex:1;padding:6px 8px;border-left:1px solid var(--line);text-align:center}
  .meta:first-child{border-left:none}
  .meta .v{font-weight:800;font-size:11.5px}.meta .k{color:var(--mut);letter-spacing:.4px;text-transform:uppercase;font-size:8px;margin-top:1px}
  .v-ok{color:var(--done)}.v-pe{color:var(--mut)}.v-re{color:var(--rej)}.v-wa{color:var(--wait)}.v-ex{color:var(--extra)}

  .rolehint{position:absolute;left:0;right:0;bottom:0;padding:8px 15px;text-align:center;background:linear-gradient(transparent,var(--paper) 35%);font-size:11px;color:var(--mut);pointer-events:none}

  /* sheet */
  .sheet{position:fixed;inset:0;max-width:540px;margin:0 auto;background:var(--paper);z-index:40;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
  .sheet.show{transform:translateY(0)}
  .sheet header{background:var(--navy);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:11px;border-bottom:3px solid var(--leche);flex:0 0 auto}
  .sheet header .x{background:none;border:none;color:#fff;font-size:25px;line-height:1;cursor:pointer;padding:0 3px}
  .sheet header .h{flex:1;min-width:0}
  .sheet header .h b{font-size:14px;display:block}
  .sheet header .h span{font-size:11px;color:#8aa0b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .sbody{flex:1;overflow-y:auto;padding:14px 15px 30px}
  .sect{margin-bottom:17px}
  .sect>h3{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .sect>h3::before{content:'';width:14px;height:2px;background:var(--leche)}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ib{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .ib .k{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
  .ib .v{font-size:13.5px;font-weight:700;margin-top:2px}
  .ib.full{grid-column:1/-1}

  .phlane{margin-bottom:11px}
  .phlane .lbl{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .phlane .lbl .tag{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
  .tag-prev{background:var(--pend-bg);color:var(--steel)} .tag-fin{background:var(--done-bg);color:var(--done)}
  .phscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .phscroll::-webkit-scrollbar{height:0}
  .ph{position:relative;width:112px;height:142px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#cdd6df}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .geo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:7.5px;padding:13px 5px 4px;line-height:1.3}
  .ph .geo .c{font-weight:700}
  .ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border:2px dashed var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:10.5px;font-weight:600}
  .ph.add .plus{font-size:24px;font-weight:300;line-height:1}

  .ph-delete{
  position:absolute;
  top:5px;
  right:5px;
  z-index:5;
  width:25px;
  height:25px;
  border:none;
  border-radius:50%;
  background:rgba(192,54,44,.92);
  color:#fff;
  font-size:15px;
  font-weight:800;
  line-height:25px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}

  .extra-box{background:#fff;border:1px solid var(--line);border-left:4px solid var(--extra);border-radius:8px;padding:11px 12px}
  .extra-box .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .extra-box .top .t{font-size:12px;font-weight:700}
  .extra-box .top .badge{font-size:9px;font-weight:800;background:var(--extra);color:#fff;padding:2px 7px;border-radius:4px}
  .extra-box .calc{font-size:11px;color:var(--steel);line-height:1.6}
  .extra-box .calc b{color:var(--extra)}

  .tl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 0}
  .tlrow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
  .tlrow:last-child{border-bottom:none}
  .tldot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--line)}
  .tldot.on{background:var(--done)} .tldot.wait{background:var(--wait)}
  .tlrow .tx{flex:1}.tlrow .tx b{font-size:12px}.tlrow .tx span{display:block;font-size:10px;color:var(--mut)}
  .tlrow .when{font-size:10px;color:var(--mut);text-align:right}

  .actions{
  position:sticky;
  bottom:0;
  z-index:20;
  background:linear-gradient(
    transparent 0,
    var(--paper) 22%,
    var(--paper) 100%
  );
  padding:13px 0 6px;
  display:flex;
  flex-direction:column;
  gap:8px;
  isolation:isolate;
  }
  .btn{border:none;border-radius:9px;padding:13px;font:inherit;font-size:13.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;text-transform:uppercase;width:100%}
  .btn-leche{background:var(--leche);color:#fff}.btn-leche:active{background:var(--leche-d)}
  .btn-admin{background:var(--wait);color:#fff}
  .btn-rej{background:#fff;color:var(--rej);border:1.5px solid var(--rej)}
  .btn-done{background:var(--done);color:#fff}
  .btn:disabled{background:#dde3ea;color:#9aa7b4;cursor:not-allowed}
  .lock{font-size:11px;text-align:center;color:var(--mut);padding:6px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  /* assign view */
  .assignrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .assignrow .zn{flex:1}.assignrow .zn b{font-size:13px}.assignrow .zn span{font-size:10.5px;color:var(--mut);display:block}
  .assignrow .zc{font-size:18px;font-weight:800;color:var(--leche)}
  .estados-z{font-size:10px;color:var(--mut);margin-top:2px;line-height:1.4}
  .note{background:var(--milk);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--steel);margin-bottom:10px;line-height:1.5}
  .note b{color:var(--ink)}

  /* ===== bottom nav ===== */
  .scroll{padding-bottom:74px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;max-width:540px;margin:0 auto}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--mut);font-size:8.5px;font-weight:600;letter-spacing:.1px;border:none;background:none;padding:0}
  .navbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .navbtn.on{color:var(--leche)}
  .navbtn.on svg{stroke:var(--leche)}
  .rolehint{bottom:60px}
  /* ===== programa / desviaciones ===== */
  .progrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .progrow .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .progrow .t b{font-size:13px}
  .desv-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .d-on{background:var(--done-bg);color:var(--done)} .d-late{background:var(--rej-bg);color:var(--rej)} .d-soon{background:var(--wait-bg);color:var(--wait)} .d-none{background:var(--pend-bg);color:var(--mut)}
  .progrow .dates{display:flex;gap:0;font-size:10px}
  .progrow .dt{flex:1;text-align:center;border-left:1px solid var(--line)}
  .progrow .dt:first-child{border-left:none}
  .progrow .dt .v{font-weight:700;font-size:12px;font-family:'SF Mono',monospace}
  .progrow .dt .k{color:var(--mut);font-size:8px;text-transform:uppercase;letter-spacing:.4px}
  .curvebox{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .curvebox h4{font-size:12px;margin-bottom:10px;color:var(--steel)}
  .curve-svg{width:100%;height:150px}
  .progsum{display:flex;gap:8px;margin-bottom:10px}
  .progsum .s{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
  .progsum .s .v{font-size:19px;font-weight:800;line-height:1}
  .progsum .s .k{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  /* ===== actas ===== */
  .lotecard{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;cursor:pointer}
  .lotecard .top{display:flex;align-items:center;gap:10px;padding:11px 13px}
  .lotecard .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:17px}
  .ic-dep{background:var(--vobo-bg)} .ic-con{background:var(--milk)}
  .lotecard .nm{flex:1}.lotecard .nm b{font-size:13.5px;display:block}.lotecard .nm span{font-size:10.5px;color:var(--mut)}
  .acta-badge{font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;flex:0 0 auto}
  .ab-rev{background:var(--wait-bg);color:var(--wait)} .ab-ap{background:var(--done-bg);color:var(--done)} .ab-rej{background:var(--rej-bg);color:var(--rej)} .ab-arm{background:var(--pend-bg);color:var(--mut)}
  .lotecard .foot{border-top:1px solid var(--line);display:flex;font-size:10px}
  .lotecard .foot .f{flex:1;padding:7px;text-align:center;border-left:1px solid var(--line)}
  .lotecard .foot .f:first-child{border-left:none}
  .lotecard .foot .f .v{font-weight:800;font-size:12px}.lotecard .foot .f .k{color:var(--mut);font-size:8px;text-transform:uppercase}
  .obschips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .obschip{font-size:11px;padding:6px 10px;border:1px solid var(--line);border-radius:18px;cursor:pointer;background:#fff;user-select:none}
  .obschip.on{background:var(--rej);color:#fff;border-color:var(--rej)}
  .acta-upload{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--mut);cursor:pointer;background:#fff;margin-bottom:10px}
  .acta-upload.done{border-color:var(--done);color:var(--done);background:var(--done-bg)}
  .acta-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .cobro-flag{display:flex;align-items:center;gap:8px;background:var(--milk);border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:8px}
  .cobro-flag .k{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  /* ===== map ===== */
  #mapWrap{position:absolute;inset:0;bottom:60px;display:none}
  #map{width:100%;height:100%;background:#dfe5ec}
  .map-legend{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.95);border-radius:9px;padding:8px 11px;font-size:10.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:500;line-height:1.7}
  .map-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .leaflet-popup-content{font-family:'Inter',sans-serif;font-size:12px;margin:9px 11px}
  .leaflet-popup-content b{font-size:13px}
  .popbtn{display:inline-block;margin-top:6px;background:var(--leche);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
  /* ===== dashboard ===== */
  .dashcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px}
  .dashcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .dashcard .av{width:38px;height:38px;border-radius:9px;background:var(--leche);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 auto}
  .dashcard .nm{flex:1}.dashcard .nm b{font-size:14px;display:block}.dashcard .nm span{font-size:10.5px;color:var(--mut)}
  .dashcard .big{text-align:right}.dashcard .big .p{font-size:20px;font-weight:800;line-height:1}.dashcard .big .l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .dbar{height:8px;background:var(--pend-bg);border-radius:5px;overflow:hidden;display:flex}
  .dbar .ok{background:var(--done)}.dbar .wa{background:var(--wait)}
  .dstats{display:flex;gap:0;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
  .dstats .s{flex:1;text-align:center;border-left:1px solid var(--line)}
  .dstats .s:first-child{border-left:none}
  .dstats .s .v{font-weight:800;font-size:13px}.dstats .s .k{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
  /* ===== estimación ===== */
  .estim-hero{background:var(--navy);color:#fff;border-radius:12px;padding:15px 16px;margin-bottom:12px}
  .estim-hero .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8aa0b6}
  .estim-hero .amt{font-size:30px;font-weight:800;margin:3px 0;letter-spacing:-.5px}
  .estim-hero .sub{font-size:11.5px;color:#aebccb}
  .estim-row{display:flex;justify-content:space-between;padding:10px 13px;background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px;align-items:center}

<script>
function mostrarLogin(){ document.getElementById('loginScreen').style.display='flex'; }

async function hacerLogin() {
  const mail =
    document
      .getElementById('loginMail')
      .value
      .trim();

  const pass =
    document
      .getElementById('loginPass')
      .value;

  const boton =
    document.querySelector(
      '#loginScreen button'
    );

  const errorEl =
    document.getElementById('loginError');

  if (!mail || !pass) {
    errorEl.textContent =
      'Ingresa correo y contraseña';

    return;
  }

  boton.disabled = true;
  boton.textContent = 'Ingresando…';
  errorEl.textContent = '';

  try {
    await iniciarSesion(mail, pass);

    document
      .getElementById('loginScreen')
      .style
      .display = 'none';

    await arrancarApp();

  } catch (error) {
    console.error(
      'Error de inicio de sesión:',
      error
    );

    errorEl.textContent =
      'Correo o contraseña incorrectos';

  } finally {
    boton.disabled = false;
    boton.textContent = 'Entrar';
  }
}

async function confirmarCierreSesion() {
  const confirmar = window.confirm(
    '¿Deseas cerrar la sesión actual?'
  );

  if (!confirmar) {
    return;
  }

  try {
    await cerrarSesion();
  } catch (error) {
    console.error(
      'No fue posible cerrar la sesión:',
      error
    );

    toast('No fue posible cerrar la sesión');
  }
}

const SUBS={"SUB-4": "Z4 · Bajío", "SUB-5": "Z5 · Norte", "SUB-1": "Z1 · Valle de México Pte.", "SUB-2": "Z2 · Valle de México Or.", "SUB-6": "Z6 · Sur/Golfo", "SUB-3": "Z3 · Centro"};
const METAS={"SUB-1": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-2": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-3": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-4": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-5": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-6": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}};


/* ---- contrato ---- */
const MIN=1000, MAX=1400, DEFINIDAS=1037;
// ===== PRECIOS =====
// A LA DEPENDENCIA: unidad estándar por lechería = 21 m² a $17,769.75 + IVA (fijo, sin extraordinarios)
const PRECIO_FACHADA=17769.75, M2_STD=21, IVA=0.16;
// EXTRAORDINARIOS: control INTERNO hacia subcontratistas (la dependencia NO paga extra).
// Precio por m² adicional configurable por subcontratista (default; se ajusta al cerrar cada subcontrato).
const PRECIO_M2_EXTRA_DEFAULT=450.00;
const PRECIO_M2_EXTRA_SUB={}; // {'SUB-1':450, ...} — se llena desde config; si no, usa el default
function precioExtraSub(sub){ return PRECIO_M2_EXTRA_SUB[sub] || PRECIO_M2_EXTRA_DEFAULT; }
// requisitos de evidencia (anexo técnico)
const MIN_FOTOS_PREV=3, MIN_FOTOS_FIN=3;
const CAT_FIN_OBLIGATORIAS=['fachada','letrero']; // de las "después"
const CAT_LABEL={fachada:'Fachada global',letrero:'Letrero lechería',general:'General',detalle:'Detalle'};
const MIN_FACTURA=50; // mínimo de lecherías por factura (ajustable con la dependencia)
// ===== IDENTIDAD DEL CONTRATO =====
const EMPRESA='LUMEN-OAX PROYECTOS Y CONSTRUCCIÓN S.A. DE C.V.';
const EMPRESA_RFC='LPC230130LRA';
const DEPENDENCIA='LECHE PARA EL BIENESTAR, S.A. DE C.V.';
const PROCEDIMIENTO='LA-08-VST-008VST977-N-54-2026';
// helpers de requisitos de fotos
function tiposFin(p){ return new Set((p.fotosFin||[]).map(f=>f.tipo)); }
function faltanCatFin(p){ const t=tiposFin(p); return CAT_FIN_OBLIGATORIAS.filter(c=>!t.has(c)); }
function fotosOk(p){
  return (p.fotosPrev||[]).length>=MIN_FOTOS_PREV
      && (p.fotosFin||[]).length>=MIN_FOTOS_FIN
      && faltanCatFin(p).length===0;
}
const HOY=new Date();
function addDays(iso, d) {
    const dt = new Date(iso);
    dt.setDate(dt.getDate() + d);
    return dt.toISOString().slice(0, 10);
}

function daysBetween(a, b) {
    return Math.round((new Date(b)-new Date(a))/86400000);
}

let LOTES=[];
/* ---- state ---- */
let ROLE='sub',
    CURSUB=Object.keys(SUBS)[0]||'',
    VIEW='estados',
    CUR_EST=null,
    CUR=null,
    FILTER='all',
    SEARCH='';
let TAB='lista', MAP=null, MAPLAYER=null, MAP_READY=false;
const ROLEINFO={
  sub:{band:'rb-sub',txt:()=>'Subcontratista · '+CURSUB,hint:'Toca un estado para ver tus lecherías asignadas'},
  gen:{band:'rb-gen',txt:()=>'Contratista general · panel completo',hint:'Vista nacional de los 32 estados y 6 zonas'},
  admin:{band:'rb-admin',txt:()=>'Administrador del contrato · validación',hint:'Otorga Vo.Bo. a lecherías atendidas'},
  dep:{
  band:'rb-dep',
  txt:()=>'Dependencia · consulta y revisión de cartas',
  hint:'Consulta nacional y revisión de cartas DEP'
  }
};

function visiblePts(){
  if(ROLE==='sub') return LECH.filter(p=>p.sub===CURSUB);
  return LECH;
}
function setRole(r){
  ROLE=r; VIEW='estados'; CUR_EST=null;
  const info=ROLEINFO[r], b=document.getElementById('roleBand');
  b.className='roleband '+info.band; b.textContent=info.txt();
  document.getElementById('roleHint').textContent=info.hint;
  document.getElementById('zoneTag').textContent = r==='sub'?CURSUB:'Nacional';
  setTab('lista');
}
function setFilter(f,el){
  FILTER=f;
  document.querySelectorAll('#filters .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on'); render();
}

/* ---- min/max gauge ---- */
function renderMinMax(){
  const pts=visiblePts();
  // a nivel nacional mostramos progreso del contrato; a nivel sub, su universo
  const universo = ROLE==='sub'? pts.length : DEFINIDAS;
  const atend = pts.filter(p=>p.status==='at').length;
  const vobo = pts.filter(p=>p.vobo==='ok').length;
  const el=document.getElementById('minmax');
  if(ROLE==='sub'){
    const pct=Math.round(atend/universo*100);
    el.innerHTML=`<div class="head"><div class="t">Avance de mi cartera</div>
      <div class="big"><b>${atend}</b> / ${universo} atendidas</div></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="mmlegend"><span><b>${vobo}</b> con Vo.Bo.</span><span><b>${universo-atend}</b> pendientes</span><span><b>${pct}%</b> avance</span></div>`;
    return;
  }
  // nacional: barra de min-max
  const wDef=DEFINIDAS/MAX*100, wMin=MIN/MAX*100;
  el.innerHTML=`<div class="head"><div class="t">Contrato abierto · mín–máx</div>
    <div class="big"><b>${DEFINIDAS}</b> definidas</div></div>
    <div class="track">
      <div class="fill" style="width:${wDef}%"></div>
      <div class="seg" style="left:${wMin}%"><span class="lab">mín ${MIN}</span></div>
      <div class="seg maxseg" style="left:99.5%"><span class="lab">máx ${MAX}</span></div>
    </div>
    <div class="mmlegend"><span>Rango <b>${MIN}–${MAX}</b> P.V.</span><span>Faltan <b>${MAX-DEFINIDAS}</b> por definir</span><span><b>${atend}</b> atendidas</span></div>`;
}
function renderKPI(){
  const pts=visiblePts();
  const tot=pts.length, at=pts.filter(p=>p.status==='at').length;
  const ok=pts.filter(p=>p.vobo==='ok').length, ext=pts.filter(p=>p.m2>M2_STD).length;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="n">${tot}</div><div class="l">${ROLE==='sub'?'Mi zona':'Cargadas'}</div></div>
    <div class="kpi"><div class="n">${at}</div><div class="l">Atendidas</div></div>
    <div class="kpi"><div class="n acc">${ok}</div><div class="l">Con Vo.Bo.</div></div>
    <div class="kpi"><div class="n">${ext}</div><div class="l">Con Extra</div></div>`;
}

/* ---- tabs ---- */
function setTab(t){
  TAB=t;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.getElementById('scroll').style.display = (t==='mapa')?'none':'block';
  document.getElementById('mapWrap').style.display = (t==='mapa')?'block':'none';
  const showList = (t==='lista');
  document.getElementById('crumbs').style.display = showList?'flex':'none';
  document.getElementById('filters').style.display = showList?'flex':'none';
  render();
  if(t==='mapa') setTimeout(initMap,60);
}

/* ---- render router ---- */
function render(){
  renderMinMax(); renderKPI();
  if(TAB==='mapa'){ if(MAP_READY) drawMarkers(); return; }
  if(TAB==='programa'){ renderPrograma(); return; }
  if(TAB==='tablero'){ renderTablero(); return; }
  if(TAB==='actas'){ renderActas(); return; }
  if(TAB==='estim'){ renderEstim(); return; }
  if(VIEW==='estados') renderEstados();
  else renderPuntos();
}
function renderCrumbs(){
  const c=document.getElementById('crumbs');
  if(VIEW==='estados'){ c.innerHTML=`<b style="color:var(--ink)">${ROLE==='sub'?'Estados de mi zona':'Estados'}</b>`; }
  else c.innerHTML=`<a onclick="goEstados()">Estados</a><span class="sep">›</span><b style="color:var(--ink)">${CUR_EST}</b>`;
}

function renderFilters(){
  const f = document.getElementById('filters');

  if(VIEW === 'estados'){
    f.innerHTML = `
      <div class="search">
        <input
          placeholder="Buscar estado…"
          oninput="setSearch(this.value)"
          id="searchBox"
        >
      </div>`;

    document.getElementById('searchBox').value = SEARCH;
    return;
  }

  const cur = FILTER;

  f.innerHTML = `
    <div class="chip ${cur==='all'?'on':''}" onclick="setFilter('all',this)">Todas</div>
    <div class="chip ${cur==='no'?'on':''}" onclick="setFilter('no',this)">No atendido</div>
    <div class="chip ${cur==='at'?'on':''}" onclick="setFilter('at',this)">Atendido</div>
    <div class="chip ${cur==='wait'?'on':''}" onclick="setFilter('wait',this)">Por Vo.Bo.</div>
    <div class="chip ${cur==='ext'?'on':''}" onclick="setFilter('ext',this)">Extra m²</div>

    <div class="search">
      <input
        placeholder="P.V., calle, colonia…"
        oninput="setSearch(this.value)"
        id="searchBox"
      >
    </div>`;

  document.getElementById('searchBox').value = SEARCH;
}

function getQ(){
  return SEARCH.trim().toLowerCase();
}

function setSearch(valor){
  SEARCH = valor;

  render();

  requestAnimationFrame(() => {
    const input = document.getElementById('searchBox');

    if(input){
      input.focus();

      const final = input.value.length;
      input.setSelectionRange(final, final);
    }
  });
}

function renderEstados(){
  renderCrumbs(); renderFilters();
  const q=getQ();
  const pts=visiblePts();
  const map={};
  pts.forEach(p=>{ (map[p.estado]=map[p.estado]||[]).push(p); });
  let ests=Object.keys(map).sort();
  if(q) ests=ests.filter(e=>e.toLowerCase().includes(q));
  const sc=document.getElementById('scroll'); sc.innerHTML='';
  if(!ests.length){ sc.innerHTML='<div style="text-align:center;color:var(--mut);padding:40px 0">Sin estados.</div>'; return; }
  ests.forEach(e=>{
    const arr=map[e], tot=arr.length, at=arr.filter(p=>p.status==='at').length;
    const pct=Math.round(at/tot*100);
    const abbr=e.replace('Edo. ','').slice(0,4).toUpperCase();
    const d=document.createElement('div'); d.className='estcard'; d.onclick=()=>openEstado(e);
    d.innerHTML=`<div class="top">
        <div class="flag">${abbr}</div>
        <div class="nm"><b>${e}</b><span>${arr[0].zona}</span></div>
        <div class="cnt"><div class="num">${tot}</div><div class="pct">${at} atend · ${pct}%</div></div>
      </div><div class="estbar"><div class="f" style="width:${pct}%"></div></div>`;
    sc.appendChild(d);
  });
}

function openEstado(e){
  CUR_EST = e;
  VIEW = 'puntos';
  FILTER = 'all';
  SEARCH = '';
  render();
}

function goEstados(){
  VIEW = 'estados';
  CUR_EST = null;
  FILTER = 'all';
  SEARCH = '';
  render();
}

function matchF(p){
  if(FILTER==='no')return p.status==='no';
  if(FILTER==='at')return p.status==='at';
  if(FILTER==='wait')return p.status==='at'&&p.vobo==='wait';
  if(FILTER==='ext')return p.m2>M2_STD;
  return true;
}
function renderPuntos(){
  renderCrumbs(); renderFilters();
  const q=getQ();
  let arr=visiblePts().filter(p=>p.estado===CUR_EST&&matchF(p));
  if(q) arr=arr.filter(p=>p.pv.includes(q)||(p.calle||'').toLowerCase().includes(q)||(p.colonia||'').toLowerCase().includes(q)||(p.municipio||'').toLowerCase().includes(q));
  const sc=document.getElementById('scroll'); sc.innerHTML='';
  if(!arr.length){ sc.innerHTML='<div style="text-align:center;color:var(--mut);padding:40px 0">Sin lecherías en este filtro.</div>'; return; }
  arr.forEach(p=>{
    const stCls=p.status==='at'?'st-at':'st-no', stTx=p.status==='at'?'Atendido':'No atendido';
    let voV='—',voC='v-pe';
    if(p.status==='at'){ if(p.vobo==='ok'){voV='Aprobado';voC='v-ok'} else if(p.vobo==='rej'){voV='Rechazado';voC='v-re'} else {voV='Por revisar';voC='v-wa'} }
    const exc=p.m2-M2_STD;
    const c=document.createElement('div'); c.className='card'; c.onclick=()=>openSheet(p.id);
    c.innerHTML=`<div class="row1">
        <span class="pv">${p.pv}</span>
        <div class="addr"><div class="a">${p.calle||'(sin calle)'}</div><div class="s">${p.colonia?p.colonia+' · ':''}${p.municipio}</div></div>
        <span class="stbadge ${stCls}">${stTx}</span>
      </div>
      <div class="row2">
        <div class="meta"><div class="v ${voC}">${voV}</div><div class="k">Vo.Bo.</div></div>
        <div class="meta"><div class="v">${p.m2} m²</div><div class="k">Superficie</div></div>
        <div class="meta"><div class="v ${exc>0?'v-ex':''}">${exc>0?'+'+exc:'—'}</div><div class="k">Extra m²</div></div>
        <div class="meta"><div class="v">${p.beneficiarios||'—'}</div><div class="k">Benef.</div></div>
      </div>`;
    sc.appendChild(c);
  });
}

/* ---- detail ---- */
function fakeGeo(f) {
  return {
    lat: f.lat ?? '',

function photoCard(f) {
  const g = fakeGeo(f);

  const catBadge = (f.tipo && f.tipo !== 'general')
    ? `<div style="position:absolute;top:5px;left:5px;
        background:${f.tipo === 'fachada'

          : 'var(--steel)'};

        font-size:8px;
        font-weight:800;
        padding:2px 6px;
        border-radius:4px;
        letter-spacing:.3px">
        ${CAT_LABEL[f.tipo] || f.tipo}
      </div>`
    : '';

  /*
   * El subcontratista puede borrar mientras el punto
   * todavía no tenga Vo.Bo. aprobado.
   */
  const puedeEliminar =
    ROLE === 'sub' &&
    CUR &&
    CUR.vobo !== 'ok' &&
    f.id;

  const botonEliminar = puedeEliminar
    ? `<button
         type="button"
         class="ph-delete"
         title="Eliminar fotografía"
         onclick="confirmarEliminarFoto(
           ${Number(f.id)},
           '${encodeURIComponent(f.url)}'
         )">×</button>`

  return `

      ${catBadge}
      ${botonEliminar}

      <div class="geo">
        <div class="c">

            : 'Sin coordenadas'}

    </div>`;
}

async function confirmarEliminarFoto(idFoto, urlCodificada) {

    '¿Eliminar esta fotografía? Esta acción no se puede deshacer.'
  );

  if (!confirmado) return;

  const archivoUrl = decodeURIComponent(urlCodificada);

  try {

async function seleccionarArchivo(){
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = () => {
      if (input.files.length > 0) {
        resolve(input.files[0]);
      }else{
        resolve(null);
      }
    };
    input.click();
  });
}
async function obtenerUbicacion(){
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve({ lat: null, lng: null});
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        });
      },
      () => {
        resolve({
          lat: null,
          lng: null
        });
      },
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
      );
  });
}

async function addAdjunto() {
  if (ROLE !== 'sub' || !CUR) return;

  if (CUR.vobo === 'ok') {
    toast('No se pueden agregar documentos con Vo.Bo. aprobado');
    return;
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';

  input.onchange = async () => {
    const archivo = input.files?.[0];
    if (!archivo) return;

    const tiposPermitidos = [
      'application/pdf',
      'image/jpeg',
      'image/png'
    ];

    if (
      archivo.type &&
      !tiposPermitidos.includes(archivo.type)
    ) {
      toast('Solo se permiten archivos PDF, JPG o PNG');
      return;
    }

    const limiteBytes = 15 * 1024 * 1024;

    if (archivo.size > limiteBytes) {
      toast('El archivo no debe superar 15 MB');
      return;
    }

    const esImagen = archivo.type.startsWith('image/');
    const tipo = esImagen ? 'mapa' : 'documento';

    try {
      const adjunto = await subirAdjunto(
        CUR.pv,
        tipo,
        archivo
      );

      CUR.adjuntos = CUR.adjuntos || [];
      CUR.adjuntos.push(adjunto);

      toast('Documento adjuntado');
      await openSheet(CUR.id);
      render();
    } catch (error) {
      console.error(error);
      toast('No fue posible adjuntar el documento');
    }
  };

  input.click();
}

async function confirmarEliminarAdjunto(idAdjunto, urlCodificada) {
  if (ROLE !== 'sub' || !CUR) return;

  if (CUR.vobo === 'ok') {

  }

    '¿Eliminar este documento? Esta acción no se puede deshacer.'
  );

async function addExtraEvidencia() {
  if (ROLE !== 'sub') return;

  const excedente = Math.max(0, CUR.m2 - M2_STD);

  if (excedente <= 0) {
    toast('Primero captura una superficie mayor a 21 m²');
    return;
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.jpg,.jpeg,.png,.pdf';

  input.onchange = async () => {
    const archivo = input.files?.[0];
    if (!archivo) return;

    try {
      /*
       * Ruta fija: si se vuelve a cargar una evidencia,
       * sustituye la anterior en lugar de crear archivos huérfanos.
       */
      const ruta = `${CUR.pv}/excedente/evidencia`;

      const { error: errorSubida } = await sb.storage
        .from('evidencias')
        .upload(ruta, archivo, {
          upsert: true,
          contentType: archivo.type || undefined
        });

      if (errorSubida) {
        throw errorSubida;
      }

      const { data: publica } = sb.storage
        .from('evidencias')
        .getPublicUrl(ruta);

      const url = publica.publicUrl;
      const precio = precioExtraSub(CUR.sub);

      await guardarExcedente(
        CUR.pv,
        excedente,
        precio,
        url
      );

      CUR.m2_excedente = excedente;
      CUR.precio_m2 = precio;
      CUR.evidencia_url = url;
      CUR.extraEvidencia = [url];

      toast('Evidencia del excedente guardada');
      openSheet(CUR.id);
      render();
    } catch (error) {
      console.error(error);
      toast('No fue posible guardar la evidencia');
    }
  };

  input.click();
}

async function markAt() {
  if (!CUR || ROLE !== 'sub') return;

  const nP = (CUR.fotosPrev || []).length;
  const nF = (CUR.fotosFin || []).length;

  if (nP < MIN_FOTOS_PREV) {
    toast(`Faltan fotos previas (${nP}/${MIN_FOTOS_PREV})`);
    return;
  }

  if (nF < MIN_FOTOS_FIN) {
    toast(`Faltan fotos finales (${nF}/${MIN_FOTOS_FIN})`);
    return;
  }

  const categoriasFaltantes = faltanCatFin(CUR);

  if (categoriasFaltantes.length) {
    toast(
      'Falta foto obligatoria: ' +
      categoriasFaltantes.map(c => CAT_LABEL[c]).join(', ')
    );
    return;
  }

  try {
    await guardarAtendido(CUR.pv, CUR.m2);

    CUR.status = 'at';
    CUR.vobo = 'wait';
    CUR.motivo = '';
    CUR.freal = new Date().toISOString().slice(0, 10);

    toast('✓ Atendido — pasa a Vo.Bo.');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible marcar la lechería como atendida');
  }
}

async function setM2(v) {
  const m2Anterior = CUR.m2;

  CUR.m2 = Math.max(M2_STD, Number(v) || M2_STD);
  CUR.m2_excedente = Math.max(0, CUR.m2 - M2_STD);

  try {
    await guardarM2(
      CUR.pv,
      CUR.m2,
      CUR.status,
      CUR.vobo,
      CUR.motivo,
      CUR.freal
    );

    openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);

    CUR.m2 = m2Anterior;
    CUR.m2_excedente = Math.max(0, m2Anterior - M2_STD);

    toast('No se pudo guardar la superficie');
    openSheet(CUR.id);
  }
}

async function vobo(aprobado) {
  if (!CUR || ROLE !== 'admin') return;

  if (aprobado) {
    try {
      await guardarVobo(CUR.pv, 'ok');

      CUR.vobo = 'ok';
      CUR.motivo = '';

      toast('✅ Vo.Bo. otorgado — entra a estimación');
      await openSheet(CUR.id);
      render();
    } catch (error) {
      console.error(error);
      toast('No fue posible otorgar el Vo.Bo.');
    }

    return;
  }

  const textarea = document.getElementById('rejMotivo');
  const motivo = textarea ? textarea.value.trim() : '';

  if (!motivo) {
    toast('Escribe el motivo del rechazo');

    if (textarea) {
      textarea.focus();
    }

    return;
  }

  try {
    await guardarVobo(CUR.pv, 'rej', motivo);

    CUR.vobo = 'rej';
    CUR.motivo = motivo;

    toast('Rechazado — regresa al subcontratista');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible rechazar la lechería');
  }
}

function money(valor) {

    'es-MX',

}

function etiquetaEstadoCarta(estado) {
  const etiquetas = {
    aprobada: 'Aprobada',
    en_revision: 'En revisión',
    rechazada: 'Rechazada',
    por_armar: 'Por armar'
  };

  return etiquetas[estado] || estado || 'Sin estado';
}

function claseEstadoCarta(estado) {
  const clases = {
    aprobada: 'ab-ap',
    en_revision: 'ab-rev',
    rechazada: 'ab-rej',
    por_armar: 'ab-arm'
  };

  return clases[estado] || 'ab-arm';
}

function detalleExcedentes(datos) {
  const grupos = {};

  (datos.extras || []).forEach(extra => {
    const sub = extra.sub || 'Sin subcontratista';

    if (!grupos[sub]) {
      grupos[sub] = {
        m2: 0,
        importe: 0,
        cantidad: 0,
        sinEvidencia: 0
      };
    }

    const precio =
      Number(extra.precio_m2) ||
      precioExtraSub(sub);

    const m2 =
      Number(extra.m2_excedente) || 0;

    grupos[sub].m2 += m2;

    grupos[sub].importe +=
      m2 * precio;

    grupos[sub].cantidad += 1;

    if (!extra.evidencia_url) {
      grupos[sub].sinEvidencia += 1;
    }
  });

  return grupos;
}

/* ============ PROGRAMA DE OBRA (fechas, desviaciones, curva) ============ */
function desvio(p){
  // devuelve {clase, txt, dias}
  if(p.status!=='at' || !p.fcomp){
    // no atendida: ¿ya venció el compromiso?
    if(p.fcomp && daysBetween(p.fcomp, HOY.toISOString().slice(0,10))>0)
      return {cls:'d-late',txt:'Vencida', dias:daysBetween(p.fcomp,HOY.toISOString().slice(0,10))};
    return {cls:'d-none',txt:'Programada', dias:0};
  }
  const d=daysBetween(p.fcomp,p.freal); // + = atrasado
  if(d>2) return {cls:'d-late',txt:'+'+d+'d tarde',dias:d};
  if(d< -1) return {cls:'d-soon',txt:Math.abs(d)+'d antes',dias:d};
  return {cls:'d-on',txt:'A tiempo',dias:d};
}
function renderPrograma(){
  document.getElementById('crumbs').style.display='none';
  document.getElementById('filters').style.display='none';
  const pts=visiblePts().filter(p=>p.fcomp);
  const hoy=HOY.toISOString().slice(0,10);
  // programado a la fecha = compromisos <= hoy ; real = atendidas <= hoy
  const programado=pts.filter(p=>daysBetween(p.fcomp,hoy)>=0).length;
  const real=pts.filter(p=>p.status==='at'&&p.freal&&daysBetween(p.freal,hoy)>=0).length;
  const atrasadas=pts.filter(p=>{const d=desvio(p);return d.cls==='d-late';}).length;
  const aTiempo=pts.filter(p=>{const d=desvio(p);return d.cls==='d-on'||d.cls==='d-soon';}).length;
  const desvGlobal=real-programado; // negativo = atraso

  const sc=document.getElementById('scroll'); sc.innerHTML='';
  const wrap=document.createElement('div');

  // curva programado vs real (por semana)
  const curva=buildCurva(pts);
  wrap.innerHTML=`
    <div class="progsum">
      <div class="s"><div class="v">${programado}</div><div class="k">Programado a hoy</div></div>
      <div class="s"><div class="v" style="color:var(--leche)">${real}</div><div class="k">Real a hoy</div></div>
      <div class="s"><div class="v" style="color:${desvGlobal<0?'var(--rej)':'var(--done)'}">${desvGlobal>=0?'+':''}${desvGlobal}</div><div class="k">Desviación</div></div>
    </div>
    <div class="curvebox">
      <h4>Avance programado vs real (acumulado)</h4>
      ${curva}
      <div style="display:flex;gap:16px;font-size:10.5px;margin-top:8px;color:var(--mut)">
        <span><span style="display:inline-block;width:14px;height:3px;background:#9aa7b4;vertical-align:middle;margin-right:5px"></span>Programado</span>
        <span><span style="display:inline-block;width:14px;height:3px;background:var(--leche);vertical-align:middle;margin-right:5px"></span>Real</span>
      </div>
    </div>
    <div class="progsum" style="margin-top:2px">
      <div class="s"><div class="v" style="color:var(--rej)">${atrasadas}</div><div class="k">Atrasadas</div></div>
      <div class="s"><div class="v" style="color:var(--done)">${aTiempo}</div><div class="k">A tiempo</div></div>
      <div class="s"><div class="v">${pts.length}</div><div class="k">Con fecha</div></div>
    </div>
    <div class="sectlabel">Detalle por lechería (desviaciones)</div>`;
  sc.appendChild(wrap);

  // ordenar: más atrasadas primero
  const sorted=[...pts].sort((a,b)=>desvio(b).dias-desvio(a).dias).slice(0,120);
  sorted.forEach(p=>{
    const d=desvio(p);
    const row=document.createElement('div'); row.className='progrow'; row.style.cursor='pointer';
    row.onclick=()=>openSheet(p.id);
    row.innerHTML=`
      <div class="t"><b>${p.pv} · ${p.municipio}</b><span class="desv-badge ${d.cls}">${d.txt}</span></div>
      <div class="dates">
        <div class="dt"><div class="v">${p.fcomp||'—'}</div><div class="k">Compromiso</div></div>
        <div class="dt"><div class="v">${p.freal||'—'}</div><div class="k">Real</div></div>
        <div class="dt"><div class="v">${p.sub||'—'}</div><div class="k">Subcontr.</div></div>
      </div>`;
    sc.appendChild(row);
  });
}
function buildCurva(pts){
  // acumulado semanal de programado (por fcomp) y real (por freal)
  const hoy=HOY.toISOString().slice(0,10);
  const dates=pts.map(p=>p.fcomp).concat(pts.filter(p=>p.freal).map(p=>p.freal)).sort();
  if(!dates.length) return '<div style="color:var(--mut);font-size:12px">Sin datos de fechas</div>';
  const t0=new Date(dates[0]), t1=new Date(dates[dates.length-1]);
  const weeks=Math.max(1,Math.ceil(daysBetween(dates[0],dates[dates.length-1])/7));
  const prog=[], real=[];
  for(let w=0;w<=weeks;w++){
    const cut=new Date(t0); cut.setDate(cut.getDate()+w*7); const ci=cut.toISOString().slice(0,10);
    prog.push(pts.filter(p=>p.fcomp&&daysBetween(p.fcomp,ci)>=0).length);
    real.push(pts.filter(p=>p.status==='at'&&p.freal&&daysBetween(p.freal,ci)>=0&&daysBetween(ci,hoy)>=0).length);
  }
  const maxV=Math.max(...prog,...real,1);
  const W=300,H=130,pad=6;
  const x=i=>pad+i*(W-2*pad)/Math.max(1,weeks);
  const y=v=>H-pad-v*(H-2*pad)/maxV;
  const line=(arr,col)=>{
    let d='M'+arr.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' L');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  };
  return `<svg class="curve-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e0e5ec"/>
    ${line(prog,'#9aa7b4')}${line(real,'#1f6feb')}</svg>`;
}

async function generarActaSubDesdeUI() {
  if (ROLE !== 'admin' && ROLE !== 'gen') {
    toast('Tu perfil no puede generar actas');
    return;
  }

  const subSugerido = CURSUB || Object.keys(SUBS)[0] || 'SUB-1';

  const sub = window.prompt(
    'Subcontratista para el corte (ejemplo: SUB-6):',
    subSugerido
  );

  if (sub === null) return;

  const subNormalizado = sub.trim().toUpperCase();

  if (!SUBS[subNormalizado]) {
    toast('El subcontratista indicado no existe');
    return;
  }

  const fechaInicio = window.prompt(
    'Fecha inicial del corte (AAAA-MM-DD):',
    '2026-07-01'
  );

  if (fechaInicio === null) return;

  const fechaFin = window.prompt(
    'Fecha final del corte (AAAA-MM-DD):',
    '2026-07-31'
  );

  if (fechaFin === null) return;

  const formatoFecha = /^\d{4}-\d{2}-\d{2}$/;

  if (
    !formatoFecha.test(fechaInicio.trim()) ||
    !formatoFecha.test(fechaFin.trim())
  ) {
    toast('Las fechas deben tener formato AAAA-MM-DD');
    return;
  }

  if (fechaInicio > fechaFin) {
    toast('La fecha inicial no puede ser posterior a la final');
    return;
  }

  const confirmado = window.confirm(
    `¿Generar el acta de ${subNormalizado} para el periodo ` +
    `${fechaInicio} a ${fechaFin}?`
  );

  if (!confirmado) return;

//FUNCION TEMPORAL PARA EL MODULO CARTAS
async function generarCartaDepDesdeUI() {
  if (ROLE !== 'admin' && ROLE !== 'gen') {
    toast('Tu perfil no puede generar cartas');
    return;
  }

  const fechaInicio = window.prompt(
    'Fecha inicial del periodo (AAAA-MM-DD):',
    '2026-07-01'
  );

  if (fechaInicio === null) return;

  const fechaFin = window.prompt(
    'Fecha final del periodo (AAAA-MM-DD):',
    '2026-07-31'
  );

  if (fechaFin === null) return;

  const cantidadTexto = window.prompt(
    'Cantidad de lecherías para la carta:',
    '50'
  );

  if (cantidadTexto === null) return;

  const cantidad = Number(cantidadTexto);
  const formatoFecha = /^\d{4}-\d{2}-\d{2}$/;

  if (
    !formatoFecha.test(fechaInicio.trim()) ||
    !formatoFecha.test(fechaFin.trim())
  ) {
    toast('Las fechas deben tener formato AAAA-MM-DD');
    return;
  }

  if (
    !Number.isInteger(cantidad) ||
    cantidad < 50
  ) {
    toast('La cantidad mínima es 50');
    return;
  }

  const confirmado = window.confirm(
    `¿Generar una carta con ${cantidad} lecherías ` +
    `del periodo ${fechaInicio} a ${fechaFin}?`
  );

  if (!confirmado) return;

  try {
    toast('Generando carta…');

    const carta = await generarCartaDep(
      fechaInicio.trim(),
      fechaFin.trim(),
      cantidad,
      PRECIO_FACHADA
    );

    toast(
      `${carta.numero} generada con ` +
      `${carta.cantidad_lecherias} lecherías`
    );

    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible generar la carta'
    );
  }
}

async function visibleLotes() {
  const lotes = await cargarActas();

  if (ROLE === 'sub') {
    return lotes.filter(
      lote =>
        lote.tipo === 'contratista' &&
        lote.sub === CURSUB
    );
  }

  if (ROLE === 'dep') {
    return lotes.filter(
      lote => lote.tipo === 'dependencia'
    );
  }

  return lotes;
}

  if(i>=0){ACTA_OBS_SEL.splice(i,1);el.classList.remove('on');}
  else{ACTA_OBS_SEL.push(o);el.classList.add('on');}

async function uploadActa() {
  if (!ACTA_CUR) return;

  if (ACTA_CUR.estado === 'aprobada') {
    toast('No se puede modificar un acta aprobada');
    return;
  }

  const input = document.createElement('input');

  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';

  input.onchange = async () => {
    const archivo = input.files?.[0];

    if (!archivo) return;

    const limite = 20 * 1024 * 1024;

    if (archivo.size > limite) {
      toast('El archivo no debe superar 20 MB');
      return;
    }

    try {
      toast('Cargando documento…');

      const actaActualizada =
        await subirDocumentoActa(
          ACTA_CUR,
          archivo
        );

      const indice = LOTES.findIndex(
        acta => acta.id === ACTA_CUR.id
      );

      if (indice !== -1) {
        LOTES[indice] = actaActualizada;
      }

      ACTA_CUR = actaActualizada;

      toast('Acta cargada — pasa a revisión');
      openActa(ACTA_CUR.id);
      await renderActas();
    } catch (error) {
      console.error(error);

      toast(
        error.message ||
        'No fue posible cargar el acta'
      );
    }
  };

  input.click();
}

async function aprobarActa() {
  if (!ACTA_CUR) return;

  const esDependencia =
    ACTA_CUR.tipo === 'dependencia';

  const rolEsperado =
    esDependencia ? 'dep' : 'admin';

  if (ROLE !== rolEsperado) {
    toast('Tu perfil no puede aprobar este documento');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'aprobada',
        []
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast(
      esDependencia
        ? '✅ Carta aprobada por la dependencia'
        : '✅ Acta aprobada — lista para cobro'
    );

    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible aprobar el documento'
    );
  }
}

async function rechazarActa() {
    if (!ACTA_CUR) return;

  const puedeRechazar =
    (
      ACTA_CUR.tipo === 'contratista' &&
      ROLE === 'admin'
    ) ||
    (
      ACTA_CUR.tipo === 'dependencia' &&
      ROLE === 'dep'
    );

  if (!puedeRechazar) {
    toast('Tu perfil no puede rechazar este documento');
    return;
  }
  const libre =
    document.getElementById('obsLibre');

  const textoLibre =
    libre ? libre.value.trim() : '';

  const observaciones = [...ACTA_OBS_SEL];

  if (textoLibre) {
    observaciones.push(textoLibre);
  }

  if (!observaciones.length) {
    toast('Marca al menos una observación');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'rechazada',
        observaciones
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast('Acta rechazada con observaciones');
    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible rechazar el acta'
    );
  }
}


function actaPDF() {
  if (
    !ACTA_CUR ||
    !ACTA_DETALLE ||
    !Array.isArray(ACTA_DETALLE.lecherias)
  ) {
    toast('Primero abre el detalle completo del documento');
    return;
  }

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const acta = ACTA_CUR;
  const lecherias = ACTA_DETALLE.lecherias;

  const esDependencia =
    acta.tipo === 'dependencia';

  const administradorDocumento =
  esDependencia
    ? (
        acta.admin ||
        `Administrador · ${DEPENDENCIA}`
      )
    : EMPRESA;

  const nombreDocumento =
    esDependencia
      ? 'Carta de entrega-recepción'
      : 'Acta de conformidad';

  const contextoDocumento =
    esDependencia
      ? 'Con la dependencia'
      : 'Corte con subcontratista';

  const numero =
    acta.numero ||
    (
      (esDependencia ? 'DEP-' : 'SUB-') +
      String(acta.id).padStart(3, '0')
    );

  const cantidad =
    lecherias.length;

  const monto =
    Number(acta.monto || 0);

  const estadoTexto =
    loteStatusBadge(acta.estado)[1];

  /*
   * Encabezado.
   */
  doc.setFillColor(13, 27, 42);
  doc.rect(0, 0, 210, 28, 'F');

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(15);
  doc.setFont(undefined, 'bold');
  doc.text(nombreDocumento, 12, 13);

  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text(
    `${contextoDocumento} · ${cantidad} lecherías`,
    12,
    20
  );

  /*
   * Datos generales.
   */
  doc.setTextColor(20, 20, 20);
  doc.setFontSize(10);

  let y = 40;

  const filas = [
    ['Documento', numero],
    ['Inicio de obra', acta.fini || '—'],
    ['Término de obra', acta.ffin || '—'],
    ['Administrador', administradorDocumento],
    ['Contratista', acta.contratista || '—'],
    ['Lecherías amparadas', String(cantidad)],
    ['Monto', money(monto)],
    ['Estatus', estadoTexto]
  ];

  filas.forEach(([etiqueta, valor]) => {
    doc.setFont(undefined, 'bold');
    doc.text(`${etiqueta}:`, 14, y);

    doc.setFont(undefined, 'normal');

    const lineas =
      doc.splitTextToSize(
        String(valor),
        120
      );

    doc.text(lineas, 70, y);

    y += Math.max(
      7,
      lineas.length * 5
    );
  });

  /*
   * Observaciones del documento.
   */
  if (
    Array.isArray(acta.obs) &&
    acta.obs.length
  ) {
    y += 3;

    doc.setTextColor(192, 54, 44);
    doc.setFont(undefined, 'bold');
    doc.text('Observaciones:', 14, y);

    y += 6;

    doc.setFont(undefined, 'normal');

    acta.obs.forEach(observacion => {
      const lineas =
        doc.splitTextToSize(
          `• ${observacion}`,
          175
        );

      if (
        y + lineas.length * 5 >
        285
      ) {
        doc.addPage();
        y = 18;
      }

      doc.text(lineas, 16, y);
      y += lineas.length * 5;
    });

    doc.setTextColor(20, 20, 20);
  }

  /*
   * Relación de P.V.
   */
  y += 5;

  if (y > 275) {
    doc.addPage();
    y = 18;
  }

  doc.setFont(undefined, 'bold');
  doc.setFontSize(10);
  doc.text(
    'Lecherías incluidas (Clave P.V.):',
    14,
    y
  );

  y += 7;

  doc.setFont(undefined, 'normal');
  doc.setFontSize(8);

  let linea = '';

  lecherias.forEach((lecheria, indice) => {
    linea += `${lecheria.pv}   `;

    const terminaFila =
      (indice + 1) % 6 === 0;

    const esUltima =
      indice === lecherias.length - 1;

    if (terminaFila || esUltima) {
      if (y > 285) {
        doc.addPage();
        y = 18;
      }

      doc.text(linea.trim(), 16, y);

      y += 5;
      linea = '';
    }
  });

  /*
   * Numeración de páginas.
   */
  const paginas =
    doc.getNumberOfPages();

  for (
    let pagina = 1;
    pagina <= paginas;
    pagina++
  ) {
    doc.setPage(pagina);

    doc.setFontSize(8);
    doc.setTextColor(107, 123, 140);

    doc.text(
      `${numero} · Página ${pagina} de ${paginas}`,
      105,
      292,
      {
        align: 'center'
      }
    );
  }

  /*
   * Descarga.
   */
  const nombreArchivo =
    esDependencia
      ? `Carta_${numero}.pdf`
      : `Acta_${numero}.pdf`;

  doc.save(nombreArchivo);

  toast(
    esDependencia
      ? 'Carátula de la carta generada'
      : 'Carátula del acta generada'
  );
}
