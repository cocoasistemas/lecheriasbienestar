      String(alcance)
        .replace(
          /[^0-9A-Za-z_-]/g,
          '_'
        );

    doc.save(
      `Reporte_semanal_${fechaArchivo(inicioSemana)}_${alcanceSeguro}.pdf`
    );

    toast(
      'Reporte semanal generado'
    );

  } catch (error) {
    console.error(
      'No fue posible generar el reporte semanal:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte semanal'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =
        contenidoOriginal;
    }
  }
}

async function reporteMensual() {
  const boton =
    document.querySelector(
      '[onclick="reporteMensual()"]'
    );

  const contenidoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent =
      'Generando reporte…';
  }

  try {
    const puntos =
      Array.isArray(visiblePts())
        ? visiblePts()
        : [];

    if (!puntos.length) {
      toast(
        'No existen lecherías en el alcance actual'
      );

      return;
    }

    const fechaActual =
      new Date();

    const anio =
      fechaActual.getFullYear();

    const mes =
      fechaActual.getMonth();

    const inicioMes =
      new Date(
        anio,
        mes,
        1
      );

    const finMes =
      new Date(
        anio,
        mes + 1,
        0
      );

    /*
     * Incluye todo el mes calendario.
     * Al comparar se usan fechas locales para evitar
     * desplazamientos por zona horaria.
     */
    function fechaLocalDesdeISO(
      valor
    ) {
      if (!valor) {
        return null;
      }

      const texto =
        String(valor);

      const soloFecha =
        texto.slice(0, 10);

      const partes =
        soloFecha.split('-');

      if (partes.length !== 3) {
        const fecha =
          new Date(valor);

        return Number.isNaN(
          fecha.getTime()
        )
          ? null
          : fecha;
      }

      const fecha =
        new Date(
          Number(partes[0]),
          Number(partes[1]) - 1,
          Number(partes[2])
        );

      return Number.isNaN(
        fecha.getTime()
      )
        ? null
        : fecha;
    }

    function estaEnMesActual(
      valor
    ) {
      const fecha =
        fechaLocalDesdeISO(valor);

      if (!fecha) {
        return false;
      }

      return (
        fecha.getFullYear() === anio &&
        fecha.getMonth() === mes
      );
    }

    function fechaCorta(
      valor
    ) {
      const fecha =
        fechaLocalDesdeISO(valor);

      if (!fecha) {
        return '—';
      }

      return fecha.toLocaleDateString(
        'es-MX',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }

    function textoVoboMensual(
      valor
    ) {
      const textos = {
        ok: 'Aprobado',
        wait: 'En revisión',
        rej: 'Rechazado',
        '-': 'No solicitado'
      };

      return textos[valor] ||
        'No solicitado';
    }

    function textoEstadoDocumento(
      valor
    ) {
      const textos = {
        aprobada: 'Aprobada',
        en_revision: 'En revisión',
        rechazada: 'Rechazada',
        por_armar: 'Por armar'
      };

      return textos[valor] ||
        valor ||
        'Sin estado';
    }

    const alcance =
      ROLE === 'sub'
        ? CURSUB
        : 'Nacional';

    const nombreMes =
      inicioMes.toLocaleDateString(
        'es-MX',
        {
          month: 'long',
          year: 'numeric'
        }
      );

    const periodoTexto =
      `${fechaCorta(
        inicioMes.toISOString()
      )} al ${fechaCorta(
        finMes.toISOString()
      )}`;

    /*
     * Movimiento operativo del mes:
     * una lechería cuenta cuando su fecha real está
     * dentro del mes calendario seleccionado.
     */
    const atendidasMes =
      puntos
        .filter(punto =>
          punto.status === 'at' &&
          estaEnMesActual(
            punto.freal
          )
        )
        .sort((a, b) =>
          String(a.freal).localeCompare(
            String(b.freal)
          )
        );

    const atendidasAcumuladas =
      puntos.filter(punto =>
        punto.status === 'at'
      );

    const voboAcumulado =
      puntos.filter(punto =>
        punto.vobo === 'ok'
      );

    const revisionAcumulada =
      puntos.filter(punto =>
        punto.status === 'at' &&
        punto.vobo === 'wait'
      );

    const rechazadasAcumuladas =
      puntos.filter(punto =>
        punto.vobo === 'rej'
      );

    const pendientesAcumuladas =
      puntos.filter(punto =>
        punto.status !== 'at'
      );

    const conExcedenteMes =
      atendidasMes.filter(punto =>
        m2Real(punto) > M2_STD
      );

    const m2EjecutadosMes =
      atendidasMes.reduce(
        (total, punto) =>
          total + m2Real(punto),
        0
      );

    const m2ExcedentesMes =
      atendidasMes.reduce(
        (total, punto) =>
          total +
          Math.max(
            m2Real(punto) - M2_STD,
            0
          ),
        0
      );

    /*
     * Documentos creados durante el mes.
     * Se usa el campo real actas.creado.
     */
    let documentosMes = [];

    try {
      const actas =
        await cargarActas();

      documentosMes =
        (actas || [])
          .filter(documento =>
            estaEnMesActual(
              documento.creado
            )
          )
          .filter(documento => {
            if (ROLE !== 'sub') {
              return true;
            }

            return (
              documento.sub === CURSUB ||
              documento.tipo ===
              'dependencia'
            );
          });

    } catch (error) {
      console.warn(
        'No fue posible cargar los documentos del mes:',
        error
      );
    }

    const actasSubMes =
      documentosMes.filter(documento =>
        documento.tipo ===
        'contratista'
      );

    const cartasDepMes =
      documentosMes.filter(documento =>
        documento.tipo ===
        'dependencia'
      );

    /*
     * Agrupación:
     * SUB se desglosa por estado.
     * Los demás roles, por subcontratista.
     */
    const grupos = {};

    puntos.forEach(punto => {
      const clave =
        ROLE === 'sub'
          ? (
              punto.estado ||
              'Sin entidad'
            )
          : (
              punto.sub ||
              'Sin cuadrilla'
            );

      if (!grupos[clave]) {
        grupos[clave] = [];
      }

      grupos[clave].push(
        punto
      );
    });

    const filasGrupo =
      Object.entries(grupos)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([nombre, registros]) => {
          const movimiento =
            registros.filter(punto =>
              punto.status === 'at' &&
              estaEnMesActual(
                punto.freal
              )
            );

          return {
            nombre,
            total:
              registros.length,
            mes:
              movimiento.length,
            acumuladas:
              registros.filter(punto =>
                punto.status === 'at'
              ).length,
            vobo:
              registros.filter(punto =>
                punto.vobo === 'ok'
              ).length,
            pendientes:
              registros.filter(punto =>
                punto.status !== 'at'
              ).length
          };
        });

    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const anchoPagina = 210;
    const margenX = 12;
    const limiteInferior = 282;

    let y = 0;

    function encabezado() {
      doc.setFillColor(
        13,
        27,
        42
      );

      doc.rect(
        0,
        0,
        anchoPagina,
        30,
        'F'
      );

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(14);

      doc.text(
        'Reporte mensual de avance',
        margenX,
        12
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(8.5);

      doc.text(
        `Pintura de fachadas · ${alcance}`,
        margenX,
        19
      );

      doc.text(
        `Procedimiento ${PROCEDIMIENTO}`,
        margenX,
        25
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      y = 40;
    }

    function nuevaPagina() {
      doc.addPage();

      encabezado();
    }

    function asegurarEspacio(
      alto
    ) {
      if (
        y + alto >
        limiteInferior
      ) {
        nuevaPagina();
      }
    }

    function tituloSeccion(
      texto
    ) {
      asegurarEspacio(14);

      doc.setDrawColor(
        31,
        111,
        235
      );

      doc.setLineWidth(.7);

      doc.line(
        margenX,
        y,
        margenX + 14,
        y
      );

      doc.setTextColor(
        58,
        79,
        102
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(10);

      doc.text(
        texto.toUpperCase(),
        margenX + 18,
        y + 1
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      y += 10;
    }

    function escribirDato(
      etiqueta,
      valor
    ) {
      asegurarEspacio(7);

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(8.5);

      doc.text(
        `${etiqueta}:`,
        14,
        y
      );

      doc.setFont(
        undefined,
        'normal'
      );

      const lineas =
        doc.splitTextToSize(
          String(valor),
          125
        );

      doc.text(
        lineas,
        69,
        y
      );

      y += Math.max(
        6,
        lineas.length * 4.4
      );
    }

    function tarjetaResumen(
      x,
      yTarjeta,
      ancho,
      titulo,
      valor,
      subtitulo = ''
    ) {
      doc.setFillColor(
        238,
        243,
        247
      );

      doc.roundedRect(
        x,
        yTarjeta,
        ancho,
        22,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        107,
        123,
        140
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(7.2);

      doc.text(
        titulo,
        x + 4,
        yTarjeta + 6
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(13);

      doc.text(
        String(valor),
        x + 4,
        yTarjeta + 14
      );

      if (subtitulo) {
        doc.setTextColor(
          107,
          123,
          140
        );

        doc.setFont(
          undefined,
          'normal'
        );

        doc.setFontSize(6.5);

        doc.text(
          subtitulo,
          x + 4,
          yTarjeta + 19
        );
      }
    }

    encabezado();

    /*
     * Identificación del reporte.
     */
    tituloSeccion(
      'Periodo del informe'
    );

    escribirDato(
      'Mes reportado',
      nombreMes
    );

    escribirDato(
      'Periodo',
      periodoTexto
    );

    escribirDato(
      'Alcance',
      alcance
    );

    escribirDato(
      'Fecha de generación',
      new Date().toLocaleString(
        'es-MX'
      )
    );

    y += 4;

    /*
     * Movimiento mensual.
     */
    tituloSeccion(
      'Movimiento del mes'
    );

    tarjetaResumen(
      12,
      y,
      57,
      'LECHERÍAS TERMINADAS',
      atendidasMes.length,
      'Fecha real dentro del mes'
    );

    tarjetaResumen(
      76,
      y,
      57,
      'M² EJECUTADOS',
      m2EjecutadosMes.toFixed(2),
      'Superficie registrada'
    );

    tarjetaResumen(
      140,
      y,
      58,
      'M² EXCEDENTES',
      m2ExcedentesMes.toFixed(2),
      `${conExcedenteMes.length} lecherías`
    );

    y += 30;

    /*
     * Estado acumulado.
     */
    tituloSeccion(
      'Estado acumulado al cierre'
    );

    const avance =
      puntos.length
        ? (
            atendidasAcumuladas.length /
            puntos.length *
            100
          ).toFixed(1)
        : '0.0';

    const acumulado = [
      [
        'Total en alcance',
        puntos.length
      ],
      [
        'Atendidas',
        atendidasAcumuladas.length
      ],
      [
        'Con Vo.Bo.',
        voboAcumulado.length
      ],
      [
        'En revisión',
        revisionAcumulada.length
      ],
      [
        'Rechazadas',
        rechazadasAcumuladas.length
      ],
      [
        'Pendientes',
        pendientesAcumuladas.length
      ],
      [
        'Avance acumulado',
        `${avance}%`
      ]
    ];

    doc.setFillColor(
      244,
      246,
      248
    );

    doc.roundedRect(
      12,
      y,
      186,
      41,
      2,
      2,
      'F'
    );

    acumulado.forEach(
      (
        [etiqueta, valor],
        indice
      ) => {
        const columna =
          indice % 2;

        const fila =
          Math.floor(
            indice / 2
          );

        const xEtiqueta =
          columna === 0
            ? 17
            : 109;

        const xValor =
          columna === 0
            ? 98
            : 193;

        const yFila =
          y +
          8 +
          fila * 9;

        doc.setFont(
          undefined,
          'normal'
        );

        doc.setFontSize(8);

        doc.setTextColor(
          58,
          79,
          102
        );

        doc.text(
          etiqueta,
          xEtiqueta,
          yFila
        );

        doc.setFont(
          undefined,
          'bold'
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        doc.text(
          String(valor),
          xValor,
          yFila,
          {
            align: 'right'
          }
        );
      }
    );

    y += 49;

    /*
     * Tabla por subcontratista o entidad.
     */
    tituloSeccion(
      ROLE === 'sub'
        ? 'Desglose por entidad'
        : 'Desglose por cuadrilla'
    );

    asegurarEspacio(15);

    doc.setFillColor(
      22,
      38,
      58
    );

    doc.rect(
      12,
      y,
      186,
      9,
      'F'
    );

    doc.setTextColor(
      255,
      255,
      255
    );

    doc.setFont(
      undefined,
      'bold'
    );

    doc.setFontSize(7.2);

    doc.text(
      ROLE === 'sub'
        ? 'Entidad'
        : 'Cuadrilla',
      15,
      y + 6
    );

    doc.text(
      'Total',
      111,
      y + 6,
      {
        align: 'right'
      }
    );

    doc.text(
      'Mes',
      135,
      y + 6,
      {
        align: 'right'
      }
    );

    doc.text(
      'Acum.',
      159,
      y + 6,
      {
        align: 'right'
      }
    );

    doc.text(
      'Vo.Bo.',
      181,
      y + 6,
      {
        align: 'right'
      }
    );

    doc.text(
      'Pend.',
      195,
      y + 6,
      {
        align: 'right'
      }
    );

    y += 9;

    filasGrupo.forEach(
      (
        fila,
        indice
      ) => {
        asegurarEspacio(8);

        if (
          indice % 2 === 0
        ) {
          doc.setFillColor(
            244,
            246,
            248
          );

          doc.rect(
            12,
            y,
            186,
            8,
            'F'
          );
        }

        doc.setTextColor(
          20,
          20,
          20
        );

        doc.setFont(
          undefined,
          'normal'
        );

        doc.setFontSize(7.3);

        doc.text(
          String(
            fila.nombre
          ).slice(0, 43),
          15,
          y + 5.4
        );

        doc.text(
          String(fila.total),
          111,
          y + 5.4,
          {
            align: 'right'
          }
        );

        doc.text(
          String(fila.mes),
          135,
          y + 5.4,
          {
            align: 'right'
          }
        );

        doc.text(
          String(fila.acumuladas),
          159,
          y + 5.4,
          {
            align: 'right'
          }
        );

        doc.text(
          String(fila.vobo),
          181,
          y + 5.4,
          {
            align: 'right'
          }
        );

        doc.text(
          String(fila.pendientes),
          195,
          y + 5.4,
          {
            align: 'right'
          }
        );

        y += 8;
      }
    );

    y += 7;

    /*
     * Documentos creados durante el mes.
     */
    tituloSeccion(
      'Documentos creados en el mes'
    );

    escribirDato(
      'Actas SUB',
      actasSubMes.length
    );

    escribirDato(
      'Cartas DEP',
      cartasDepMes.length
    );

    const documentosOrdenados =
      [...documentosMes]
        .sort((a, b) =>
          String(a.creado).localeCompare(
            String(b.creado)
          )
        );

    if (!documentosOrdenados.length) {
      asegurarEspacio(14);

      doc.setFillColor(
        238,
        241,
        244
      );

      doc.roundedRect(
        12,
        y,
        186,
        12,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        107,
        123,
        140
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(8);

      doc.text(
        'No se crearon actas o cartas durante este mes.',
        16,
        y + 7.5
      );

      y += 18;

    } else {
      documentosOrdenados.forEach(
        documento => {
          asegurarEspacio(9);

          doc.setFontSize(7.7);

          doc.setFont(
            undefined,
            'bold'
          );

          doc.setTextColor(
            20,
            20,
            20
          );

          doc.text(
            documento.numero ||
            `Documento ${documento.id}`,
            15,
            y
          );

          doc.setFont(
            undefined,
            'normal'
          );

          doc.text(
            documento.tipo ===
            'dependencia'
              ? 'Carta DEP'
              : 'Acta SUB',
            58,
            y
          );

          doc.text(
            fechaCorta(
              documento.creado
            ),
            105,
            y
          );

          doc.text(
            textoEstadoDocumento(
              documento.estado
            ),
            138,
            y
          );

          doc.text(
            String(
              documento
                .cantidad_lecherias ||
              0
            ) + ' P.V.',
            195,
            y,
            {
              align: 'right'
            }
          );

          y += 6;
        }
      );

      y += 3;
    }

    /*
     * Detalle de terminaciones del mes.
     */
    tituloSeccion(
      'Lecherías terminadas durante el mes'
    );

    if (!atendidasMes.length) {
      asegurarEspacio(14);

      doc.setFillColor(
        248,
        238,
        216
      );

      doc.roundedRect(
        12,
        y,
        186,
        13,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        154,
        103,
        25
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(8);

      doc.text(
        'No existen lecherías con fecha real dentro del periodo.',
        16,
        y + 8
      );

      y += 19;

    } else {
      asegurarEspacio(10);

      doc.setFillColor(
        22,
        38,
        58
      );

      doc.rect(
        12,
        y,
        186,
        9,
        'F'
      );

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(7);

      doc.text(
        'Clave P.V.',
        15,
        y + 6
      );

      doc.text(
        'Entidad / municipio',
        47,
        y + 6
      );

      doc.text(
        'SUB',
        122,
        y + 6
      );

      doc.text(
        'Fecha real',
        151,
        y + 6
      );

      doc.text(
        'Vo.Bo.',
        195,
        y + 6,
        {
          align: 'right'
        }
      );

      y += 9;

      atendidasMes.forEach(
        (
          punto,
          indice
        ) => {
          asegurarEspacio(9);

          if (
            indice % 2 === 0
          ) {
            doc.setFillColor(
              244,
              246,
              248
            );

            doc.rect(
              12,
              y,
              186,
              9,
              'F'
            );
          }

          doc.setTextColor(
            20,
            20,
            20
          );

          doc.setFont(
            undefined,
            'normal'
          );

          doc.setFontSize(6.8);

          doc.text(
            String(
              punto.pv || ''
            ),
            15,
            y + 5.8
          );

          const ubicacion =
            [
              punto.estado,
              punto.municipio
            ]
              .filter(Boolean)
              .join(' / ');

          doc.text(
            String(
              ubicacion ||
              'Sin ubicación'
            ).slice(0, 42),
            47,
            y + 5.8
          );

          doc.text(
            String(
              punto.sub || '—'
            ),
            122,
            y + 5.8
          );

          doc.text(
            fechaCorta(
              punto.freal
            ),
            151,
            y + 5.8
          );

          doc.text(

        );

      `Reporte_mensual_${anio}-${mesArchivo}_${alcanceSeguro}.pdf`

    );

function calcularResumenAvanceInterno(puntos) {

  const cargadas =
    puntos.length;

  const iniciadas =
    puntos.filter(
      p => p.status === 'ini'
    );

  const atendidas =
    puntos.filter(
      p => p.status === 'at'
    );

  const noAtendidas =
    puntos.filter(
      p =>
        p.status !== 'ini' &&
        p.status !== 'at'
    );

  const conVobo =
    atendidas.filter(
      p => p.vobo === 'ok'
    );

  const rechazadas =
    atendidas.filter(
      p => p.vobo === 'rej'
    );

  const enRevision =
    atendidas.filter(
      p =>
        p.vobo !== 'ok' &&
        p.vobo !== 'rej'
    );


  /*
   * Solamente una lechería ATENDIDA
   * forma parte de la superficie
   * ejecutada consolidada.
   */

  const m2Base =
    atendidas.length *
    M2_STD;


  const m2Extra =
    atendidas.reduce(
      (total, p) => {

        const extra =
          Math.max(
            m2Real(p) - M2_STD,
            0
          );

        return total + extra;
      },
      0
    );


  const m2Total =
    m2Base + m2Extra;


  return {
    cargadas,
    noAtendidas:
      noAtendidas.length,
    iniciadas:
      iniciadas.length,
    atendidas:
      atendidas.length,
    conVobo:
      conVobo.length,
    enRevision:
      enRevision.length,
    rechazadas:
      rechazadas.length,
    m2Base,
    m2Extra,
    m2Total
  };
}

   * Pie en la última página.
   */

  piePagina();


  /*
   * ==========================
   * GUARDAR
   * ==========================
   */

  const fechaArchivo =
    new Date()
      .toISOString()
      .slice(0, 10);


  doc.save(
    `Reporte_ejecutivo_avance_${fechaArchivo}.pdf`
  );


  toast(
    'Reporte ejecutivo PDF generado'
  );
}

async function exportReporteInterno() {
  if (
    ROLE !== 'gen' &&
    ROLE !== 'admin'
  ) {
    toast(
      'Este reporte está reservado para control interno'
    );

    return;
  }

  const boton =
    document.querySelector(
      '[onclick="exportReporteInterno()"]'
    );

  const textoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent =
      'Generando reporte…';
  }

  try {
    /*
     * Actualizamos las fuentes para que el reporte
     * no dependa de información anterior en memoria.
     */
    const [
      actas,
      estimacion
    ] = await Promise.all([
      cargarActas(),
      obtenerEstimacion()
    ]);

    const puntos =
      Array.isArray(LECH)
        ? LECH
        : [];

    /*
     * Obtenemos las relaciones reales de cada acta
     * y carta mediante la RPC central.
     */
    const detalles =
      await Promise.all(
        (actas || []).map(async acta => {
          try {
            return await obtenerDetalleActa(
              acta.id
            );
          } catch (error) {
            console.warn(
              `No se pudo cargar ${acta.numero}:`,
              error
            );

            return {
              acta,
              lecherias: []
            };
          }
        })
      );

    /*
     * Índices por P.V.
     */
    const actasSubPorPv = {};
    const cartasDepPorPv = {};

    detalles.forEach(detalle => {
      const acta =
        detalle.acta || {};

      const lecherias =
        Array.isArray(detalle.lecherias)
          ? detalle.lecherias
          : [];

      const destino =
        acta.tipo === 'dependencia'
          ? cartasDepPorPv
          : actasSubPorPv;

      lecherias.forEach(punto => {
        if (!destino[punto.pv]) {
          destino[punto.pv] = [];
        }

        destino[punto.pv].push({
          id: acta.id,
          numero:
            acta.numero || '',
          estado:
            acta.estado || '',
          monto:
            Number(acta.monto || 0),
          fini:
            acta.fini || '',
          ffin:
            acta.ffin || ''
        });
      });
    });

    function documentosPv(
      indice,
      pv
    ) {
      return Array.isArray(indice[pv])
        ? indice[pv]
        : [];
    }

    function foliosDocumentos(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .map(documento =>
          documento.numero
        )
        .filter(Boolean)
        .join(', ');
    }

    function estadosDocumentos(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .map(documento =>
          etiquetaEstadoCarta(
            documento.estado
          )
        )
        .filter(Boolean)
        .join(', ');
    }

    function tieneDocumentoAprobado(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .some(documento =>
          documento.estado ===
          'aprobada'
        );
    }

    /*
     * Datos de excedentes.
     */
    const extras =
      Array.isArray(
        estimacion.extras
      )
        ? estimacion.extras
        : [];

    const extraPorPv = {};

    extras.forEach(extra => {
      extraPorPv[extra.pv] = extra;
    });

    /*
     * HOJA 1: RESUMEN GENERAL
     */
    const resumenEstimacion =
      estimacion.resumen || {};

    const resumenGeneral = [
      {
        Concepto:
          'Procedimiento',
        Valor:
          PROCEDIMIENTO
      },
      {
        Concepto:
          'Empresa',
        Valor:
          EMPRESA
      },
      {
        Concepto:
          'RFC',
        Valor:
          EMPRESA_RFC
      },
      {
        Concepto:
          'Dependencia',
        Valor:
          DEPENDENCIA
      },
      {
        Concepto:
          'Rango mínimo del contrato',
        Valor:
          MIN
      },
      {
        Concepto:
          'Rango máximo del contrato',
        Valor:
          MAX
      },
      {
        Concepto:
          'Lecherías definidas',
        Valor:
          LECH.length
      },
      {
        Concepto:
          'Lecherías cargadas',
        Valor:
          puntos.length
      },
      {
        Concepto:
          'Lecherías atendidas',
        Valor:
          puntos.filter(p =>
            p.status === 'at'
          ).length
      },
      {
        Concepto:
          'Lecherías con Vo.Bo.',
        Valor:
          puntos.filter(p =>
            p.vobo === 'ok'
          ).length
      },
      {
        Concepto:
          'Lecherías rechazadas',
        Valor:
          puntos.filter(p =>
            p.vobo === 'rej'
          ).length
      },
      {
        Concepto:
          'Lecherías en cartas DEP aprobadas',
        Valor:
          Number(
            resumenEstimacion.cobrables || 0
          )
      },
      {
        Concepto:
          'Cartas DEP aprobadas',
        Valor:
          Number(
            resumenEstimacion
              .cartas_aprobadas || 0
          )
      },
      {
        Concepto:
          'Subtotal aprobado',
        Valor:
          Number(
            resumenEstimacion.subtotal || 0
          )
      },
      {
        Concepto:
          'IVA',
        Valor:
          Number(
            resumenEstimacion.iva || 0
          )
      },
      {
        Concepto:
          'Total aprobado',
        Valor:
          Number(
            resumenEstimacion.total || 0
          )
      }
    ];

    /*
     * HOJA 2: POR SUBCONTRATISTA
     */
    const gruposSub = {};

    puntos.forEach(punto => {
      const sub =
        punto.sub ||
        'Sin cuadrilla';

      if (!gruposSub[sub]) {
        gruposSub[sub] = [];
      }

      gruposSub[sub].push(punto);
    });

    const porCuadrilla =
      Object.entries(gruposSub)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([sub, registros]) => {
          const extrasSub =
            registros
              .map(punto =>
                extraPorPv[punto.pv]
              )
              .filter(Boolean);

          return {
            Cuadrilla:
              sub,

            Zona:
              registros[0]?.zona || '',

            Total:
              registros.length,

            Atendidas:
              registros.filter(p =>
                p.status === 'at'
              ).length,

            'Con Vo.Bo.':
              registros.filter(p =>
                p.vobo === 'ok'
              ).length,

            'En revisión Vo.Bo.':
              registros.filter(p =>
                p.status === 'at' &&
                p.vobo === 'wait'
              ).length,

            Rechazadas:
              registros.filter(p =>
                p.vobo === 'rej'
              ).length,

            'Sin atender':
              registros.filter(p =>
                p.status === 'no'
              ).length,

            'En acta SUB aprobada':
              registros.filter(p =>
                tieneDocumentoAprobado(
                  actasSubPorPv,
                  p.pv
                )
              ).length,

            'En carta DEP aprobada':
              registros.filter(p =>
                tieneDocumentoAprobado(
                  cartasDepPorPv,
                  p.pv
                )
              ).length,

            'Lecherías con excedente':
              extrasSub.length,

            'm² excedentes':
              extrasSub.reduce(
                (total, extra) =>
                  total +
                  Number(
                    extra.m2_excedente || 0
                  ),
                0
              ),

            'Costo excedentes':
              extrasSub.reduce(
                (total, extra) => {
                  const m2 =
                    Number(
                      extra.m2_excedente || 0
                    );

                  const precio =
                    Number(extra.precio_m2) ||
                    precioExtraSub(sub);

                  return total +
                    m2 * precio;
                },
                0
              ),

            'Sin evidencia excedente':
              extrasSub.filter(extra =>
                !extra.evidencia_url
              ).length
          };
        });

    /*
     * HOJA 3: POR ZONA
     */
    const gruposZona = {};

    puntos.forEach(punto => {
      const zona =
        punto.zona ||
        'Sin zona';

      if (!gruposZona[zona]) {
        gruposZona[zona] = [];
      }

      gruposZona[zona].push(punto);
    });

    const porZona =
      Object.entries(gruposZona)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([zona, registros]) => ({
          Zona:
            zona,

          Total:
            registros.length,

          Atendidas:
            registros.filter(p =>
              p.status === 'at'
            ).length,

          'Con Vo.Bo.':
            registros.filter(p =>
              p.vobo === 'ok'
            ).length,

          'En revisión Vo.Bo.':
            registros.filter(p =>
              p.status === 'at' &&
              p.vobo === 'wait'
            ).length,

          Rechazadas:
            registros.filter(p =>
              p.vobo === 'rej'
            ).length,

          'Sin atender':
            registros.filter(p =>
              p.status === 'no'
            ).length,

          'En acta SUB aprobada':
            registros.filter(p =>
              tieneDocumentoAprobado(
                actasSubPorPv,
                p.pv
              )
            ).length,

          'En carta DEP aprobada':
            registros.filter(p =>
              tieneDocumentoAprobado(
                cartasDepPorPv,
                p.pv
              )
            ).length
        }));

    /*
     * HOJA 4: DETALLE GENERAL
     */
    const detalleGeneral =
      [...puntos]
        .sort((a, b) =>
          String(a.pv).localeCompare(
            String(b.pv)
          )
        )
        .map(punto => {
          const extra =
            extraPorPv[punto.pv];

          const m2Extra =
            Number(
              extra?.m2_excedente ||
              punto.m2_excedente ||
              Math.max(
                m2Real(punto) -
                M2_STD,
                0
              )
            );

          const precioExtra =
            Number(extra?.precio_m2) ||
            Number(punto.precio_m2) ||
            precioExtraSub(punto.sub);

          return {
            'Clave P.V.':
              String(punto.pv || ''),

            Entidad:
              punto.estado || '',

            Municipio:
              punto.municipio || '',

            Localidad:
              punto.localidad || '',

            Calle:
              punto.calle || '',

            Colonia:
              punto.colonia || '',

            Zona:
              punto.zona || '',

            Cuadrilla:
              punto.sub || '',

            Beneficiarios:
              Number(
                punto.beneficiarios || 0
              ),

            'Fecha compromiso':
              punto.fcomp || '',

            'Fecha real':
              punto.freal || '',

            'Desviación días':
              punto.fcomp
                ? desvio(punto).dias
                : '',

            'Estado del avance':
              textoEstadoAvance(punto),

            'Vo.Bo.':
              textoVobo(punto.vobo),

            'Motivo rechazo':
              punto.motivo || '',

            'm² estándar':
              M2_STD,

            'm² real':
              m2Real(punto),

            'm² excedente':
              m2Extra,

            'Precio m² excedente':
              precioExtra,

            'Importe excedente':
              m2Extra * precioExtra,

            'Evidencia excedente':
              extra?.evidencia_url ||
              punto.evidencia_url
                ? 'Sí'
                : 'No',

            'Acta SUB':
              foliosDocumentos(
                actasSubPorPv,
                punto.pv
              ),

            'Estado acta SUB':
              estadosDocumentos(
                actasSubPorPv,
                punto.pv
              ),

            'Carta DEP':
              foliosDocumentos(
                cartasDepPorPv,
                punto.pv
              ),

            'Estado carta DEP':
              estadosDocumentos(
                cartasDepPorPv,
                punto.pv
              )
          };
        });

    /*
     * HOJA 5: DESVIACIONES
     */
    const desviaciones =
      puntos
        .filter(punto =>
          punto.fcomp
        )
        .map(punto => {
          const desviacion =
            desvio(punto);

          return {
            'Clave P.V.':
              String(punto.pv || ''),

            Entidad:
              punto.estado || '',

            Municipio:
              punto.municipio || '',

            Zona:
              punto.zona || '',

            Cuadrilla:
              punto.sub || '',

            Compromiso:
              punto.fcomp || '',

            Real:
              punto.freal || '',

            'Desviación días':
              desviacion.dias,

            Estatus:
              desviacion.txt,

            Avance:
              textoEstadoAvance(punto),

            'Vo.Bo.':
              textoVobo(punto.vobo)
          };
        });

    /*
     * HOJA 6: EXCEDENTES
     */
    const filasExcedentes =
      extras.map(extra => {
        const m2 =
          Number(
            extra.m2_excedente || 0
          );

        const precio =
          Number(extra.precio_m2) ||
          precioExtraSub(extra.sub);

        return {
          'Clave P.V.':
            String(extra.pv || ''),

          Entidad:
            extra.estado || '',

          Municipio:
            extra.municipio || '',

          Zona:
            extra.zona || '',

          Cuadrilla:
            extra.sub || '',

          'm² real':
            Number(
              extra.m2_real || M2_STD
            ),

          'm² excedente':
            m2,

          'Precio por m²':
            precio,

          Importe:
            m2 * precio,

          Evidencia:
            extra.evidencia_url
              ? 'Sí'
              : 'FALTA',

          'URL evidencia':
            extra.evidencia_url || ''
        };
      });

    /*
     * HOJA 7: ACTAS SUB
     */
    const filasActasSub =
      detalles
        .filter(detalle =>
          detalle.acta?.tipo ===
          'contratista'
        )
        .map(detalle => {
          const acta =
            detalle.acta || {};

          return {
            Folio:
              acta.numero || '',

            Cuadrilla:
              acta.sub || '',

            Zona:
              acta.zona || '',

            Inicio:
              acta.fini || '',

            Término:
              acta.ffin || '',

            Estado:
              etiquetaEstadoCarta(
                acta.estado
              ),

            Lecherías:
              Array.isArray(
                detalle.lecherias
              )
                ? detalle.lecherias.length
                : 0,

            Monto:
              Number(acta.monto || 0),

            Documento:
              acta.documento_url || '',

            Observaciones:
              Array.isArray(acta.obs)
                ? acta.obs.join(' | ')
                : ''
          };
        });

    /*
     * HOJA 8: CARTAS DEP
     */
    const filasCartasDep =
      detalles
        .filter(detalle =>
          detalle.acta?.tipo ===
          'dependencia'
        )
        .map(detalle => {
          const carta =
            detalle.acta || {};

          return {
            Folio:
              carta.numero || '',

            Zona:
              carta.zona || '',

            Inicio:
              carta.fini || '',

            Término:
              carta.ffin || '',

            Estado:
              etiquetaEstadoCarta(
                carta.estado
              ),

            Lecherías:
              Array.isArray(
                detalle.lecherias
              )
                ? detalle.lecherias.length
                : 0,

            Monto:
              Number(carta.monto || 0),

            Documento:
              carta.documento_url || '',

            Observaciones:
              Array.isArray(carta.obs)
                ? carta.obs.join(' | ')
                : ''
          };
        });

    /*
     * Construcción del libro.
     */
    const libro =
      XLSX.utils.book_new();

    agregarHojaExcel(
      libro,
      'Resumen general',
      resumenGeneral,
      [34, 45]
    );

    agregarHojaExcel(
      libro,
      'Por cuadrilla',
      porCuadrilla,
      [
        18, 26, 10, 12, 12,
        18, 12, 12, 21, 21,
        22, 16, 18, 23
      ]
    );

    agregarHojaExcel(
      libro,
      'Por zona',
      porZona,
      [
        28, 10, 12, 12, 18,
        12, 12, 21, 21
      ]
    );

    agregarHojaExcel(
      libro,
      'Detalle general',
      detalleGeneral,
      [
        16, 18, 22, 26, 32,
        24, 28, 18, 14, 17,
        14, 16, 22, 18, 30,
        13, 12, 14, 22, 20,
        20, 18, 20, 18, 20
      ]
    );

    agregarHojaExcel(
      libro,
      'Desviaciones',
      desviaciones,
      [
        16, 18, 22, 28, 18,
        14, 14, 17, 18, 22, 18
      ]
    );

    agregarHojaExcel(
      libro,
      'Excedentes',
      filasExcedentes,
      [
        16, 18, 22, 28, 18,
        12, 15, 17, 16, 12, 45
      ]
    );

    agregarHojaExcel(
      libro,
      'Actas SUB',
      filasActasSub,
      [
        16, 18, 28, 14, 14,
        16, 12, 18, 45, 45
      ]
    );

    agregarHojaExcel(
      libro,
      'Cartas DEP',
      filasCartasDep,
      [
        16, 28, 14, 14, 16,
        12, 18, 45, 45
      ]
    );

    const fecha =
      new Date()
        .toISOString()
        .slice(0, 10);

    XLSX.writeFile(
      libro,
      `Reporte_interno_completo_${fecha}.xlsx`
    );

    toast(
      'Reporte interno completo generado'
    );

  } catch (error) {
    console.error(
      'No fue posible generar el reporte interno:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte interno'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =
        textoOriginal;
    }
  }
}

function ajustarHojaExcel(
  hoja,
  anchos = [],
  aplicarFiltro = true
) {
  hoja['!cols'] = anchos.map(ancho => ({
    wch: ancho
  }));

  if (
    aplicarFiltro &&
    hoja['!ref']
  ) {
    const rango =
      XLSX.utils.decode_range(
        hoja['!ref']
      );

    hoja['!autofilter'] = {
      ref: XLSX.utils.encode_range({
        s: {
          r: rango.s.r,
          c: rango.s.c
        },
        e: {
          r: rango.s.r,
          c: rango.e.c
        }
      })
    };
  }
}

function agregarHojaExcel(
  libro,
  nombre,
  filas,
  anchos = []
) {
  const datos =
    filas.length
      ? filas
      : [
          {
            Información:
              'Sin registros para mostrar'
          }
        ];

  const hoja =
    XLSX.utils.json_to_sheet(datos);

  ajustarHojaExcel(
    hoja,
    anchos.length
      ? anchos
      : Object.keys(datos[0]).map(
          () => 18
        )
  );

  XLSX.utils.book_append_sheet(
    libro,
    hoja,
    nombre.slice(0, 31)
  );
}

function textoEstadoAvance(punto) {

  if (punto.status === 'ini') {
    return 'Iniciada';
  }

  if (punto.status !== 'at') {
    return 'No atendida';
  }

  if (punto.vobo === 'ok') {
    return 'Atendida con Vo.Bo.';
  }

  if (punto.vobo === 'rej') {
    return 'Atendida rechazada';
  }

  return 'Atendida en revisión';
}

function textoVobo(valor) {
  const textos = {
    ok: 'Aprobado',
    wait: 'En revisión',
    rej: 'Rechazado',
    '-': 'No solicitado'
  };

  return textos[valor] ||
    valor ||
    'No solicitado';
}

async function reportePDF(
  punto = null,
  descargar = true
) {

  if (ROLE === 'sub') {
    toast(
      'Este reporte no está disponible para cuadrillas'
    );
    return null;
  }

  const p =
  punto || CUR;

  if (!p) {

  if (descargar) {
    toast(

    );
  }

  return null;
  }

  const fotosPrev =
    Array.isArray(p.fotosPrev)
      ? p.fotosPrev
      : [];

  const fotosFin =
    Array.isArray(p.fotosFin)
      ? p.fotosFin
      : [];

  if (!fotosPrev.length && !fotosFin.length) {
    toast('La lechería no tiene evidencia fotográfica');
    return;
  }

  const boton =
  descargar
    ? document.querySelector(
        '[onclick="reportePDF()"]'
      )
    : null;

  const textoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent = 'Generando reporte…';
  }

  try {
    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const margenX = 12;
    const anchoPagina = 210;
    const altoPagina = 297;
    const limiteInferior = 283;

    let y = 0;

    function encabezadoPagina(
      mostrarDatos = false
    ) {
      doc.setFillColor(13, 27, 42);
      doc.rect(
        0,
        0,
        anchoPagina,
        28,
        'F'
      );

      doc.setTextColor(255, 255, 255);
      doc.setFont(undefined, 'bold');
      doc.setFontSize(14);

      doc.text(
        `Reporte fotográfico · P.V. ${p.pv}`,
        margenX,
        12
      );

      doc.setFont(undefined, 'normal');
      doc.setFontSize(8.5);

      doc.text(
        'Pintura de fachadas',
        margenX,
        18
      );

      doc.text(
        `Proc. ${PROCEDIMIENTO}`,
        margenX,
        23
      );

      doc.setTextColor(20, 20, 20);

      y = mostrarDatos
        ? 36
        : 35;
    }

    function agregarPiePagina() {
      const paginas =
        doc.getNumberOfPages();

      for (
        let pagina = 1;
        pagina <= paginas;
        pagina++
      ) {
        doc.setPage(pagina);

        doc.setFontSize(7.5);
        doc.setTextColor(107, 123, 140);

        doc.text(
          `P.V. ${p.pv} · Página ${pagina} de ${paginas}`,
          105,
          292,
          {
            align: 'center'
          }
        );
      }
    }

    function nuevaPagina() {
      doc.addPage();
      encabezadoPagina(false);
    }

    function asegurarEspacio(
      altoNecesario
    ) {
      if (
        y + altoNecesario >
        limiteInferior
      ) {
        nuevaPagina();
      }
    }

    function textoVoboReporte(valor) {
      const textos = {
        ok: 'Aprobado',
        wait: 'Pendiente de revisión',
        rej: 'Rechazado',
        '-': 'No solicitado'
      };

      return textos[valor] ||
        'No solicitado';
    }

    function textoEstadoReporte() {
      if (p.status !== 'at') {
        return 'No atendido';
      }

      if (p.vobo === 'ok') {
        return 'Atendido con Vo.Bo.';
      }

      if (p.vobo === 'rej') {
        return 'Atendido rechazado';
      }

      return 'Atendido en revisión';
    }

    function formatoFecha(
      valor
    ) {
      if (!valor) {
        return 'Sin fecha';
      }

      const fecha =
        new Date(valor);

      if (
        Number.isNaN(
          fecha.getTime()
        )
      ) {
        return String(valor);
      }

      return fecha.toLocaleString(
        'es-MX',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }
      );
    }

    function coordenadasFoto(
      foto
    ) {
      const lat =
        foto.lat !== null &&
        foto.lat !== undefined &&
        foto.lat !== ''
          ? Number(foto.lat).toFixed(6)
          : '';

      const lng =
        foto.lng !== null &&
        foto.lng !== undefined &&
        foto.lng !== ''
          ? Number(foto.lng).toFixed(6)
          : '';

      return lat && lng
        ? `${lat}, ${lng}`
        : 'Sin coordenadas';
    }

    async function cargarImagenComoDataUrl(
      url
    ) {
      try {
        const respuesta =
          await fetch(url, {
            cache: 'no-store'
          });

        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }

        const blob =
          await respuesta.blob();

        return await new Promise(
          (resolve, reject) => {
            const lector =
              new FileReader();

            lector.onload =
              () => resolve(
                lector.result
              );

            lector.onerror =
              () => reject(
                new Error(
                  'No fue posible leer la imagen'
                )
              );

            lector.readAsDataURL(blob);
          }
        );

      } catch (error) {
        console.warn(
          'No se pudo cargar una fotografía para el PDF:',
          url,
          error
        );

        return null;
      }
    }

    function tipoImagen(
      dataUrl
    ) {
      if (
        String(dataUrl).startsWith(
          'data:image/png'
        )
      ) {
        return 'PNG';
      }

      if (
        String(dataUrl).startsWith(
          'data:image/webp'
        )
      ) {
        return 'WEBP';
      }

      return 'JPEG';
    }

    function dibujarImagenAjustada(
      dataUrl,
      formato,
      x,
      yImagen,
      anchoCaja,
      altoCaja
    ) {
      try {
        const propiedades =
          doc.getImageProperties(
            dataUrl
          );

        const proporcionImagen =
          propiedades.width /
          propiedades.height;

        const proporcionCaja =
          anchoCaja /
          altoCaja;

        let anchoImagen =
          anchoCaja;

        let altoImagen =
          altoCaja;

        let xImagen =
          x;

        let yReal =
          yImagen;

        if (
          proporcionImagen >
          proporcionCaja
        ) {
          altoImagen =
            anchoCaja /
            proporcionImagen;

          yReal +=
            (
              altoCaja -
              altoImagen
            ) / 2;

        } else {
          anchoImagen =
            altoCaja *
            proporcionImagen;

          xImagen +=
            (
              anchoCaja -
              anchoImagen
            ) / 2;
        }

        doc.setFillColor(
          238,
          241,
          244
        );

        doc.rect(
          x,
          yImagen,
          anchoCaja,
          altoCaja,
          'F'
        );

        doc.addImage(
          dataUrl,
          formato,
          xImagen,
          yReal,
          anchoImagen,
          altoImagen
        );

      } catch (error) {
        console.warn(
          'No se pudo insertar la fotografía en el PDF:',
          error
        );

        doc.setFillColor(
          238,
          241,
          244
        );

        doc.rect(
          x,
          yImagen,
          anchoCaja,
          altoCaja,
          'F'
        );

        doc.setTextColor(
          107,
          123,
          140
        );

        doc.setFontSize(8);

        doc.text(
          'Imagen no disponible',
          x + anchoCaja / 2,
          yImagen + altoCaja / 2,
          {
            align: 'center'
          }
        );
      }
    }

    async function agregarSeccionFotos(
      titulo,
      fotos
    ) {
      asegurarEspacio(18);

      doc.setTextColor(
        20,
        20,
        20
      );

      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);

      doc.text(
        `${titulo} (${fotos.length})`,
        margenX,
        y
      );

      y += 7;

      if (!fotos.length) {
        doc.setFillColor(
          248,
          227,
          225
        );

        doc.roundedRect(
          margenX,
          y,
          186,
          13,
          2,
          2,
          'F'
        );

        doc.setTextColor(
          192,
          54,
          44
        );

        doc.setFont(undefined, 'normal');
        doc.setFontSize(9);

        doc.text(
          'No existe evidencia registrada en esta etapa.',
          margenX + 4,
          y + 8
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        y += 19;
        return;
      }

      const anchoTarjeta = 88;
      const altoImagen = 61;
      const altoPie = 18;
      const altoTarjeta =
        altoImagen +
        altoPie;

      const separacionX = 10;
      const separacionY = 8;

      for (
        let indice = 0;
        indice < fotos.length;
        indice += 2
      ) {
        asegurarEspacio(
          altoTarjeta +
          separacionY
        );

        const fila =
          fotos.slice(
            indice,
            indice + 2
          );

        const resultados =
          await Promise.all(
            fila.map(foto =>
              cargarImagenComoDataUrl(
                foto.url
              )
            )
          );

        fila.forEach(
          (foto, posicion) => {
            const x =
              margenX +
              posicion *
              (
                anchoTarjeta +
                separacionX
              );

            const dataUrl =
              resultados[posicion];

            doc.setDrawColor(
              223,
              229,
              236
            );

            doc.roundedRect(
              x,
              y,
              anchoTarjeta,
              altoTarjeta,
              2,
              2,
              'S'
            );

            if (dataUrl) {
              dibujarImagenAjustada(
                dataUrl,
                tipoImagen(dataUrl),
                x + 1,
                y + 1,
                anchoTarjeta - 2,
                altoImagen - 2
              );

            } else {
              doc.setFillColor(
                238,
                241,
                244
              );

              doc.rect(
                x + 1,
                y + 1,
                anchoTarjeta - 2,
                altoImagen - 2,
                'F'
              );

              doc.setTextColor(
                107,
                123,
                140
              );

              doc.setFontSize(8);

              doc.text(
                'Imagen no disponible',
                x +
                anchoTarjeta / 2,
                y +
                altoImagen / 2,
                {
                  align: 'center'
                }
              );
            }

            const categoria =
              CAT_LABEL[foto.tipo] ||
              foto.tipo ||
              'General';

            doc.setTextColor(
              20,
              20,
              20
            );

            doc.setFont(undefined, 'bold');
            doc.setFontSize(8);

            doc.text(
              categoria,
              x + 3,
              y + altoImagen + 5
            );

            doc.setFont(undefined, 'normal');
            doc.setFontSize(6.8);
            doc.setTextColor(
              107,
              123,
              140
            );

            const coordenadas =
              coordenadasFoto(foto);

            doc.text(
              coordenadas,
              x + 3,
              y + altoImagen + 10
            );

            const fecha =
              formatoFecha(
                foto.fecha
              );

            doc.text(
              fecha,
              x + 3,
              y + altoImagen + 15
            );
          }
        );

        y +=
          altoTarjeta +
          separacionY;
      }

      y += 3;
    }

    encabezadoPagina(true);

    /*
     * Datos generales.
     */
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10);

    doc.text(
      'Datos generales',
      margenX,
      y
    );

    y += 7;

    const domicilio =
      [
        p.calle,
        p.colonia
      ]
        .filter(Boolean)
        .join(', ') ||
      'Sin domicilio registrado';

    const ubicacion =
      [
        p.municipio,
        p.estado
      ]
        .filter(Boolean)
        .join(', ') ||
      'Sin ubicación registrada';

    const coordenadasPv =
      p.lat !== null &&
      p.lat !== undefined &&
      p.lng !== null &&
      p.lng !== undefined
        ? `${p.lat}, ${p.lng}`
        : 'Sin coordenadas';

    const superficie =
      m2Real(p);

    const excedente =
      Math.max(
        superficie -
        M2_STD,
        0
      );

    const filasInfo = [
      [
        'Domicilio',
        domicilio
      ],
      [
        'Municipio / entidad',
        ubicacion
      ],
      [
        'Zona / cuadrilla',
        `${p.zona || 'Sin zona'} / ${p.sub || 'Sin Cuadrilla'}`
      ],
      [
        'Coordenadas del P.V.',
        coordenadasPv
      ],
      [
        'Fecha compromiso',
        p.fcomp || 'Sin fecha'
      ],
      [
        'Fecha real',
        p.freal || 'Sin fecha'
      ],
      [
        'Superficie',
        `${superficie} m²${
          excedente > 0
            ? ` (+${excedente} m² excedentes)`
            : ''
        }`
      ],
      [
        'Estado',
        textoEstadoReporte()
      ],
      [
        'Vo.Bo.',
        textoVoboReporte(
          p.vobo
        )
      ],
      [
        'Generado',
        new Date().toLocaleString(
          'es-MX'
        )
      ]
    ];

    doc.setFontSize(8.5);

    filasInfo.forEach(
      ([etiqueta, valor]) => {
        asegurarEspacio(7);

        doc.setFont(
          undefined,
          'bold'
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        doc.text(
          `${etiqueta}:`,
          14,
          y
        );

        doc.setFont(
          undefined,
          'normal'
        );

        const lineas =
          doc.splitTextToSize(
            String(valor),
            132
          );

        doc.text(
          lineas,
          62,
          y
        );

        y += Math.max(
          5.5,
          lineas.length *
          4.5
        );
      }
    );

    y += 4;

    /*
     * Resumen de evidencia.
     */
    asegurarEspacio(22);

    doc.setFillColor(
      238,
      243,
      247
    );

    doc.roundedRect(
      margenX,
      y,
      186,
      16,
      2,
      2,
      'F'
    );

    doc.setTextColor(
      20,
      20,
      20
    );

    doc.setFont(undefined, 'bold');
    doc.setFontSize(9);

    doc.text(
      `Fotos previas: ${fotosPrev.length}`,
      18,
      y + 7
    );

    doc.text(
      `Fotos finales: ${fotosFin.length}`,
      78,
      y + 7
    );

    doc.text(
      `Total: ${fotosPrev.length + fotosFin.length}`,
      144,
      y + 7
    );

    doc.setFont(undefined, 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(
      107,
      123,
      140
    );

    doc.text(
      fotosOk(p)
        ? 'Evidencia mínima completa'
        : 'Evidencia incompleta según requisitos',
      18,
      y + 12
    );

    y += 23;

    await agregarSeccionFotos(
      'ANTES',
      fotosPrev
    );

    await agregarSeccionFotos(
      'DESPUÉS',
      fotosFin
    );

    /*
     * Observaciones.
     */
    if (p.motivo) {
      asegurarEspacio(22);

      doc.setFillColor(
        248,
        227,
        225
      );

      doc.roundedRect(
        margenX,
        y,
        186,
        18,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        192,
        54,
        44
      );

      doc.setFont(undefined, 'bold');
      doc.setFontSize(8.5);

      doc.text(
        'Observación o motivo de rechazo:',
        16,
        y + 6
      );

      doc.setFont(undefined, 'normal');

      const lineas =
        doc.splitTextToSize(
          p.motivo,
          176
        );

      doc.text(
        lineas.slice(0, 2),
        16,
        y + 11
      );

      y += 23;
    }

    agregarPiePagina();

    const pvSeguro =
      String(p.pv)
        .replace(
          /[^0-9A-Za-z_-]/g,
          '_'
        );

    /*
     * Si viene desde la ficha:
     * descarga normal.
     *
     * Si viene desde un concentrado:
     * devuelve el PDF como Blob.
     */

    if (descargar) {

      doc.save(
        `Reporte_fotografico_${pvSeguro}.pdf`
      );

      toast(
        'Reporte fotográfico generado'
      );

      return null;
    }


    return doc.output('blob');

  } catch (error) {
    console.error(
      'No fue posible generar el reporte fotográfico:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte fotográfico'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =
        textoOriginal;
    }
  }
}

    return;

  const {

    doc.text(

      margen,

    );


    y =

  function nuevaPaginaDetalle() {

    doc.addPage();

    encabezadoPagina(true);

    dibujarCabeceraTabla();

  /*

  encabezadoPagina(false);


  doc.setFontSize(10);

  doc.setFont(

  );

  doc.text(

    y
  );

  y +=
    8;


  doc.setFont(
    undefined,
    'normal'
  );

  doc.text(
    `m² contractuales: ${reporte.m2_contractuales}`,
    margen,
    y
  );

  doc.text(
    `m² reales: ${reporte.m2_reales}`,
    85,
    y
  );

  y +=
    8;


  doc.setFont(
    undefined,
    'bold'
  );

  doc.text(
    `Crédito generado: +${reporte.credito_generado} m²`,
    margen,
    y
  );

  doc.text(
    `Crédito consumido: ${reporte.credito_consumido} m²`,
    85,
    y
  );

  doc.text(
    `Saldo: ${
      reporte.saldo_m2 > 0
        ? '+'
        : ''
    }${reporte.saldo_m2} m²`,

    y
  );

  y +=
    12;

    'RESUMEN POR CUADRILLA',

    y

    6;

    doc.text(
      afecta
        ? (
            p.balance_m2 > 0
              ? `+${p.balance_m2}`
              : String(
                  p.balance_m2
                )
          )
        : '—',
      cols.balance,
      y
    );


    doc.text(
      afecta
        ? 'Sí'
        : 'No',
      cols.afecta,
      y
    );


    y +=
      5;


    doc.setDrawColor(
      225
    );

    doc.line(
      margen,
      y - 2,
      anchoPagina -
      margen,
      y - 2
    );
  });


  /*
   * Pie de página.
   */
  const paginas =
    doc.getNumberOfPages();


  for (
    let i = 1;
    i <= paginas;
    i++
  ) {

    doc.setPage(i);

    doc.setFontSize(6.5);

    doc.setTextColor(
      100
    );

    doc.text(
      `Página ${i} de ${paginas}`,
      anchoPagina -
      margen,
      altoPagina - 5,
      {
        align: 'right'
      }
    );

    doc.text(
      'Documento de control interno',
      margen,
      altoPagina - 5
    );
  }


  const fecha =
    new Date()
      .toISOString()
      .slice(0, 10);


  doc.save(
    `Reporte_BLOQUE_212_${fecha}.pdf`
  );


  toast(
    'Reporte especial PDF generado'
  );
}

/* ============ PROGRAMA DE OBRA (fechas, desviaciones, curva) ============ */
function desvio(p){
  // devuelve {clase, txt, dias}
  if(p.status!=='at' || !p.fcomp){
    // no atendida: ¿ya venció el compromiso?
    if(p.fcomp && daysBetween(p.fcomp, HOY.toISOString().slice(0,10))>0)
      return {cls:'d-late',txt:'Vencida', dias:daysBetween(p.fcomp,HOY.toISOString().slice(0,10))};
    return {cls:'d-none',txt:'Programada', dias:0};
  }
  const d=daysBetween(p.fcomp,p.freal); // + = atrasado
  if(d>2) return {cls:'d-late',txt:'+'+d+'d tarde',dias:d};
  if(d< -1) return {cls:'d-soon',txt:Math.abs(d)+'d antes',dias:d};
  return {cls:'d-on',txt:'A tiempo',dias:d};
}
let CONTROL_PROGRAMA = {
  data: null,
  fecha: null,
  cargando: false
};

function fechaHoyPrograma() {
  return new Date().toLocaleDateString(
    'en-CA',
    { timeZone: 'America/Mexico_City' }
  );
}

function fechaProgramaCorta(valor) {
  if (!valor) return '—';
  const [y,m,d] = String(valor).split('-').map(Number);
  return new Date(y, m - 1, d, 12)
    .toLocaleDateString('es-MX', {
      day: '2-digit',
      month: 'short'
    })
    .replace('.', '');
}

function numeroPrograma(valor, decimales = 1) {
  const n = Number(valor || 0);
  return Number.isInteger(n)
    ? String(n)
    : n.toFixed(decimales);
}

function colorDesviacionPrograma(valor) {
  const n = Number(valor || 0);
  if (n <= -30) return 'var(--rej)';
  if (n < -10) return 'var(--wait)';
  if (n >= 10) return 'var(--done)';
  return 'var(--steel)';
}

function etiquetaEstadoPrograma(estado) {
  const mapa = {
    critica: ['CRÍTICA', 'var(--rej)'],
    riesgo: ['EN RIESGO', 'var(--wait)'],
    adelantada: ['ADELANTADA', 'var(--done)'],
    en_meta: ['EN META', 'var(--steel)'],
    sin_meta: ['NO PROGRAMADA ESTA SEMANA', 'var(--mut)'],
    pendiente: ['PENDIENTE', 'var(--mut)']
  };
  return mapa[estado] || ['—', 'var(--mut)'];
}

async function consultarControlPrograma(fecha = null) {
  const fechaCorte = fecha || fechaHoyPrograma();
  const { data, error } = await sb.rpc(
    'obtener_control_programacion',
    { p_fecha: fechaCorte }
  );
  if (error) throw error;
  return data;
}

async function cargarProgramaOperativo(fecha = null) {
  if (CONTROL_PROGRAMA.cargando) return;
  CONTROL_PROGRAMA.cargando = true;
  CONTROL_PROGRAMA.fecha = fecha || fechaHoyPrograma();

  const sc = document.getElementById('scroll');
  if (sc && TAB === 'programa') {
    sc.innerHTML = `
      <div class="note" style="margin:14px;">
        Cargando programación semanal por cuadrilla…
      </div>`;
  }

  try {
    CONTROL_PROGRAMA.data =
      await consultarControlPrograma(CONTROL_PROGRAMA.fecha);
    pintarProgramaOperativo();
  } catch (error) {
    console.error(error);
    if (sc && TAB === 'programa') {
      sc.innerHTML = `
        <div class="note" style="margin:14px;border-left:4px solid var(--rej);">
          <b>No fue posible cargar la programación.</b><br><br>
          ${textoSeguroLumen(error?.message || String(error))}
        </div>`;
    }
  } finally {
    CONTROL_PROGRAMA.cargando = false;
  }
}

function cambiarSemanaPrograma(fecha) {
  cargarProgramaOperativo(fecha);
}

function renderPrograma(){
  document.getElementById('crumbs').style.display='none';
  document.getElementById('filters').style.display='none';

  const sc=document.getElementById('scroll');
  sc.innerHTML = `
    <div class="note" style="margin:14px;">
      Cargando programación semanal por cuadrilla…
    </div>`;

  cargarProgramaOperativo(
    CONTROL_PROGRAMA.fecha || fechaHoyPrograma()
  );
}

function pintarProgramaOperativo() {
  if (TAB !== 'programa') return;

  const sc = document.getElementById('scroll');
  const datos = CONTROL_PROGRAMA.data || {};

  const resumen = datos.resumen || {};
  const proyecto = datos.proyecto || {};
  const cuadrillas = Array.isArray(datos.cuadrillas) ? datos.cuadrillas : [];
  const semanas = Array.isArray(datos.semanas) ? datos.semanas : [];
  const hoy = fechaHoyPrograma();

  const opciones = semanas.map(s => {
    const esActual = hoy >= s.fecha_inicio && hoy <= s.fecha_fin;
    const esFutura = hoy < s.fecha_inicio;
    const valor = esActual
      ? hoy
      : (esFutura ? s.fecha_inicio : s.fecha_fin);
    return `
      <option value="${valor}" ${Number(s.semana_numero)===Number(semana.numero)?'selected':''}>

  const desviacion = Number(resumen.desviacion || 0);

    ? ((Number(resumen.ejecutadas_dia || 0) - Number(resumen.meta_dia || 0)) * 100 / Number(resumen.meta_dia || 0))

        <b>Control contra meta semanal.</b><br><br>

function buildCurva(pts){
  // acumulado semanal de programado (por fcomp) y real (por freal)
  const hoy=HOY.toISOString().slice(0,10);
  const dates=pts.map(p=>p.fcomp).concat(pts.filter(p=>p.freal).map(p=>p.freal)).sort();
  if(!dates.length) return '<div style="color:var(--mut);font-size:12px">Sin datos de fechas</div>';
  const t0=new Date(dates[0]), t1=new Date(dates[dates.length-1]);
  const weeks=Math.max(1,Math.ceil(daysBetween(dates[0],dates[dates.length-1])/7));
  const prog=[], real=[];
  for(let w=0;w<=weeks;w++){
    const cut=new Date(t0); cut.setDate(cut.getDate()+w*7); const ci=cut.toISOString().slice(0,10);
    prog.push(pts.filter(p=>p.fcomp&&daysBetween(p.fcomp,ci)>=0).length);
    real.push(pts.filter(p=>p.status==='at'&&p.freal&&daysBetween(p.freal,ci)>=0&&daysBetween(ci,hoy)>=0).length);
  }
  const maxV=Math.max(...prog,...real,1);
  const W=300,H=130,pad=6;
  const x=i=>pad+i*(W-2*pad)/Math.max(1,weeks);
  const y=v=>H-pad-v*(H-2*pad)/maxV;
  const line=(arr,col)=>{
    let d='M'+arr.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' L');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  };
  return `<svg class="curve-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e0e5ec"/>
    ${line(prog,'#9aa7b4')}${line(real,'#1f6feb')}</svg>`;
}

  if(e==='rechazada')return['ab-rej','Rechazada'];

}

async function generarActaSubDesdeUI() {
  if (ROLE !== 'admin' && ROLE !== 'gen') {
    toast('Tu perfil no puede generar actas');
    return;
  }

  const subSugerido = CURSUB || Object.keys(SUBS)[0] || 'SUB-1';

  const sub = window.prompt(
    'Cuadrilla para el corte (ejemplo: SUB-6):',
    subSugerido
  );

  if (sub === null) return;

  const subNormalizado = sub.trim().toUpperCase();

  if (!SUBS[subNormalizado]) {
    toast('La cuadrilla indicada no existe');
    return;
  }

  const fechaInicio = window.prompt(
    'Fecha inicial del corte (AAAA-MM-DD):',
    '2026-07-01'
  );

  if (fechaInicio === null) return;

  const fechaFin = window.prompt(
    'Fecha final del corte (AAAA-MM-DD):',
    '2026-07-31'
  );

  if (fechaFin === null) return;

  const formatoFecha = /^\d{4}-\d{2}-\d{2}$/;

  if (
    !formatoFecha.test(fechaInicio.trim()) ||
    !formatoFecha.test(fechaFin.trim())
  ) {
    toast('Las fechas deben tener formato AAAA-MM-DD');
    return;
  }

  if (fechaInicio > fechaFin) {
    toast('La fecha inicial no puede ser posterior a la final');
    return;
  }

  const confirmado = window.confirm(
    `¿Generar el acta de ${subNormalizado} para el periodo ` +
    `${fechaInicio} a ${fechaFin}?`
  );

  if (!confirmado) return;

  try {
    toast('Generando acta…');

    const acta = await generarActaSub(
      subNormalizado,
      fechaInicio.trim(),
      fechaFin.trim(),
      PRECIO_FACHADA
    );

    toast(
      `${acta.numero} generada con ` +
      `${acta.cantidad_lecherias} lecherías`
    );

    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible generar el acta'
    );
  }
}

/* ============================================================
 * DESCARGA MASIVA POR LISTADO DE P.V.
 * ============================================================ */

function normalizarPVListado(valor) {
  if (valor === null || valor === undefined) return '';
  return String(valor)
    .trim()
    .replace(/^[\'\"]+/, '')
    .replace(/\.0+$/, '')
    .replace(/\s+/g, '');
}

function normalizarEncabezadoListado(valor) {
  return String(valor || '')
    .trim()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function esEncabezadoPVListado(valor) {
  const h = normalizarEncabezadoListado(valor);
  return [
    'PV','P V','PUNTO DE VENTA','PUNTO VENTA',
    'CLAVE PV','CLAVE P V','CLAVE PUNTO DE VENTA','CLAVE PUNTO VENTA'
  ].includes(h);
}

function descargarBlobListadoPV(blob, nombre) {
  const enlace = document.createElement('a');
  const url = URL.createObjectURL(blob);
  enlace.href = url;
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function analizarArchivoListadoPV(archivo) {
  if (!archivo) return;

  if (ROLE !== 'gen' && ROLE !== 'admin') {
    toast('Tu perfil no puede usar esta herramienta');
    return;
  }

  const contenedor = document.getElementById('resultadoListadoPv');
  if (contenedor) {
    contenedor.innerHTML = `
      <div class="note">
        Analizando <b>${textoSeguroLumen(archivo.name)}</b>…
      </div>`;
  }

  try {
    const buffer = await archivo.arrayBuffer();
    const libro = XLSX.read(buffer, { type:'array', cellDates:false });
    const catalogo = new Map((LECH || []).map(p => [String(p.pv), p]));
    let mejor = null;

    for (const nombreHoja of libro.SheetNames) {
      const hoja = libro.Sheets[nombreHoja];
      const filas = XLSX.utils.sheet_to_json(hoja, {
        header:1,
        raw:false,
        defval:''
      });
      if (!filas.length) continue;

      let encabezado = null;
      for (let f=0; f<Math.min(filas.length,25) && !encabezado; f++) {
        for (let c=0; c<(filas[f] || []).length; c++) {
          if (esEncabezadoPVListado(filas[f][c])) {
            encabezado = { fila:f, columna:c, explicito:true };
            break;
          }
        }
      }

      if (!encabezado) {
        const columnas = Math.max(...filas.map(f => (f || []).length), 0);
        let mejorColumna = null;
        for (let c=0; c<columnas; c++) {
          let coincidencias = 0;
          let candidatos = 0;
          for (let f=0; f<filas.length; f++) {
            const pv = normalizarPVListado(filas[f]?.[c]);
            if (!pv) continue;
            if (/^[0-9]{5,20}$/.test(pv)) candidatos++;
            if (catalogo.has(pv)) coincidencias++;
          }
          if (
            !mejorColumna ||
            coincidencias > mejorColumna.coincidencias ||
            (coincidencias === mejorColumna.coincidencias && candidatos > mejorColumna.candidatos)
          ) {
            mejorColumna = { columna:c, coincidencias, candidatos };
          }
        }
        if (mejorColumna && (mejorColumna.coincidencias > 0 || mejorColumna.candidatos > 0)) {
          encabezado = { fila:-1, columna:mejorColumna.columna, explicito:false };
        }
      }

      if (!encabezado) continue;

      const valores = [];
      const desde = encabezado.fila >= 0 ? encabezado.fila + 1 : 0;
      for (let f=desde; f<filas.length; f++) {
        const pv = normalizarPVListado(filas[f]?.[encabezado.columna]);
        if (!pv) continue;
        if (!encabezado.explicito && !/^[0-9]{5,20}$/.test(pv)) continue;
        valores.push(pv);
      }

      const unicos = [...new Set(valores)];
      const coincidencias = unicos.filter(pv => catalogo.has(pv)).length;
      const candidato = {
        hoja:nombreHoja,
        columna:encabezado.columna,
        explicito:encabezado.explicito,
        valores:unicos,
        coincidencias
      };

      if (
        !mejor ||
        candidato.coincidencias > mejor.coincidencias ||
        (candidato.coincidencias === mejor.coincidencias && candidato.valores.length > mejor.valores.length)
      ) {
        mejor = candidato;
      }
    }

    if (!mejor || !mejor.valores.length) {
      throw new Error('No fue posible localizar una columna con P.V. en el archivo');
    }

    const todasActas = await cargarActas();
    const actasPorPv = new Map();
    const puntaje = a => a?.documento_firmado_v2_url ? 3 : a?.documento_generado_v2_url ? 2 : a?.documento_url ? 1 : 0;

    for (const acta of todasActas || []) {
      if (acta.clase !== 'apertura' || !acta.pv) continue;
      const pv = String(acta.pv);
      const previa = actasPorPv.get(pv);
      if (!previa || puntaje(acta) > puntaje(previa)) actasPorPv.set(pv, acta);
    }

    const encontrados = [];
    const noEncontrados = [];
    mejor.valores.forEach(pv => {
      const punto = catalogo.get(pv);
      if (punto) {
        encontrados.push({ pv, punto, acta:actasPorPv.get(pv) || null });
      } else {
        noEncontrados.push(pv);
      }
    });

    DESCARGA_LISTADO_PV = {
      archivo:archivo.name,
      hoja:mejor.hoja,
      pvs:mejor.valores,
      encontrados,
      noEncontrados,
      actasPorPv
    };

    pintarResultadoListadoPV();
  } catch (error) {
    console.error('No fue posible analizar el listado de P.V.:', error);
    DESCARGA_LISTADO_PV = {
      archivo:'', pvs:[], encontrados:[], noEncontrados:[], actasPorPv:new Map()
    };
    if (contenedor) {
      contenedor.innerHTML = `
        <div class="note" style="border-left:4px solid var(--rej)">
          ${textoSeguroLumen(error.message || 'No fue posible analizar el archivo')}
        </div>`;
    }
  }
}

function crearResumenDescargaListadoPV(filas) {
