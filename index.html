<html lang="es">
<head>

<meta name="theme-color" content="#0d1b2a">
<title>Bitácora de Lecherías · Pintura de Fachadas</title>

  type="image/svg+xml"

>
<style>
  :root{
    --navy:#0d1b2a; --navy2:#16263a; --steel:#3a4f66;
    --paper:#f4f6f8; --card:#ffffff; --line:#dfe5ec;
    --milk:#eef3f7; --ink:#11202e; --mut:#6b7b8c;
    --leche:#1f6feb;          /* azul leche bienestar */
    --leche-d:#1657c0;
    --done:#1f8a4c; --done-bg:#e3f3e9;
    --pend:#9aa7b4; --pend-bg:#eef1f4;
    --wait:#e08a1e; --wait-bg:#fbeed8;
    --rej:#c0362c; --rej-bg:#f8e3e1;
    --extra:#7b2ff7; --extra-bg:#efe6fe;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;overflow:hidden}
  .mono{font-family:'SF Mono','Roboto Mono',ui-monospace,Menlo,monospace}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;background:var(--paper);position:relative}

  header.top{background:var(--navy);color:#fff;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;border-bottom:3px solid var(--leche)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .mk{width:30px;height:30px;border-radius:7px;background:var(--leche);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .brand b{font-size:14px;letter-spacing:.3px;font-weight:800;display:block;line-height:1.1}
  .brand span{font-size:9.5px;letter-spacing:1.5px;color:#8aa0b6;text-transform:uppercase}

  .contract{background:var(--navy2);color:#aebccb;padding:6px 15px;font-size:10.5px;display:flex;justify-content:space-between;flex:0 0 auto;letter-spacing:.3px}
  .contract b{color:#fff}

  .roleband{font-size:10px;text-align:center;padding:5px;letter-spacing:1px;text-transform:uppercase;font-weight:800;flex:0 0 auto;color:#fff}
  .rb-sub{background:var(--leche)} .rb-gen{background:var(--steel)} .rb-admin{background:var(--wait)} .rb-dep{background:var(--navy)}

  /* min-max gauge */
  .minmax{background:var(--navy);padding:11px 15px 13px;flex:0 0 auto;color:#fff}
  .minmax .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .minmax .head .t{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8aa0b6}
  .minmax .head .big{font-size:13px;font-weight:800}
  .minmax .big b{color:var(--leche);font-size:20px}
  .track{position:relative;height:24px;background:var(--navy2);border-radius:6px;overflow:hidden}
  .track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--leche),#3d8bff);border-radius:6px;transition:width .6s cubic-bezier(.3,.7,.3,1)}
  .track .seg{position:absolute;top:0;bottom:0;width:2px;background:#fff}
  .track .seg .lab{position:absolute;top:26px;font-size:8.5px;color:#8aa0b6;transform:translateX(-50%);white-space:nowrap}
  .track .seg.maxseg .lab{color:#fff}
  .mmlegend{display:flex;gap:14px;margin-top:22px;font-size:9.5px;color:#8aa0b6}
  .mmlegend b{color:#fff}

  .kpis{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--navy2);
  flex:0 0 auto
}
  .kpi{padding:8px 5px;text-align:center;border-left:1px solid #24364a}
  .kpi:first-child{border-left:none}
  .kpi .n{font-size:17px;font-weight:800;color:#fff;line-height:1}
  .kpi .n.acc{color:#5ea0ff}
  .kpi .l{font-size:8px;letter-spacing:.8px;color:#8aa0b6;text-transform:uppercase;margin-top:3px}

  /* ===== KPI interactivos ===== */

.kpi.kpi-click{
  cursor:pointer;
  position:relative;
  transition:
    background .12s,
    transform .08s;
}

.kpi.kpi-click:active{
  background:#20344b;
  transform:scale(.97);
}

.kpi.kpi-click::after{
  content:'›';
  position:absolute;
  right:4px;
  top:50%;
  transform:translateY(-50%);
  font-size:14px;
  color:#526981;
}


/* ===== Panel detalle KPI ===== */

.kpi-sheet{
  position:fixed;
  inset:0;
  max-width:540px;
  margin:0 auto;
  background:var(--paper);
  z-index:35;

  display:flex;
  flex-direction:column;

  transform:translateY(100%);
  transition:
    transform .25s
    cubic-bezier(.3,.7,.3,1);
}

.kpi-sheet.show{
  transform:translateY(0);
}

.kpi-sheet header{
  background:var(--navy);
  color:#fff;

  padding:12px 15px;

  display:flex;
  align-items:center;
  gap:11px;

  border-bottom:3px solid var(--leche);

  flex:0 0 auto;
}

.kpi-sheet header .x{
  background:none;
  border:none;
  color:#fff;

  font-size:25px;
  line-height:1;

  cursor:pointer;
  padding:0 3px;
}

.kpi-sheet header .h{
  flex:1;
  min-width:0;
}

.kpi-sheet header .h b{
  display:block;
  font-size:14px;
}

.kpi-sheet header .h span{
  display:block;
  font-size:10.5px;
  color:#8aa0b6;
}

.kpi-body{
  flex:1;
  overflow-y:auto;
  padding:13px 13px 30px;
}

.kpi-resumen{
  background:var(--milk);
  border-radius:9px;
  padding:10px 12px;
  margin-bottom:11px;

  font-size:11.5px;
  color:var(--steel);
}

.kpi-resumen b{
  color:var(--ink);
}

  .crumbs{display:flex;align-items:center;gap:7px;padding:9px 15px 4px;font-size:12px;flex:0 0 auto;color:var(--mut)}
  .crumbs a{color:var(--leche);font-weight:700;cursor:pointer;text-decoration:none}
  .crumbs .sep{color:var(--line)}

  .filters{display:flex;gap:6px;padding:7px 13px;overflow-x:auto;flex:0 0 auto}
  .filters::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--steel);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .search{flex:1;min-width:120px}
  .search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:12px}

  .scroll{flex:1 1 auto;overflow-y:auto;padding:4px 13px 80px}

  /* estado list */
  .estcard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;overflow:hidden;transition:transform .08s}
  .estcard:active{transform:scale(.99)}
  .estcard .top{display:flex;align-items:center;gap:11px;padding:12px 14px}
  .estcard .flag{width:42px;height:42px;border-radius:10px;background:var(--milk);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--leche);flex:0 0 auto;letter-spacing:-.5px}
  .estcard .nm{flex:1;min-width:0}
  .estcard .nm b{font-size:15px;font-weight:700;display:block}
  .estcard .nm span{font-size:11px;color:var(--mut)}
  .estcard .cnt{text-align:right;flex:0 0 auto}
  .estcard .cnt .num{font-size:19px;font-weight:800}
  .estcard .cnt .pct{font-size:10px;color:var(--mut)}
  .estbar{height:5px;background:var(--pend-bg)}
  .estbar .f{height:100%;background:var(--done);transition:width .4s}

  /* punto list */
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;cursor:pointer;transition:transform .08s}
  .card:active{transform:scale(.992)}
  .card .row1{display:flex;align-items:center;gap:10px;padding:11px 12px 8px}
  .pv{font-size:10px;font-weight:800;letter-spacing:.3px;background:var(--milk);color:var(--steel);padding:3px 7px;border-radius:5px;flex:0 0 auto}
  .addr{flex:1;min-width:0}
  .addr .a{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr .s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stbadge{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:4px 8px;border-radius:20px;flex:0 0 auto;text-transform:uppercase}
  ..st-no{
  background:var(--pend-bg);
  color:var(--mut)
    }

    .st-ini{
      background:#fff2cc;
      color:#9a6700
    }

    .st-at{
      background:var(--done-bg);
      color:var(--done)
    }
  .card .row2{display:flex;border-top:1px solid var(--line);font-size:10px}
  .meta{flex:1;padding:6px 8px;border-left:1px solid var(--line);text-align:center}
  .meta:first-child{border-left:none}
  .meta .v{font-weight:800;font-size:11.5px}.meta .k{color:var(--mut);letter-spacing:.4px;text-transform:uppercase;font-size:8px;margin-top:1px}
  .v-ok{color:var(--done)}.v-pe{color:var(--mut)}.v-re{color:var(--rej)}.v-wa{color:var(--wait)}.v-ex{color:var(--extra)}

  .rolehint{position:absolute;left:0;right:0;bottom:0;padding:8px 15px;text-align:center;background:linear-gradient(transparent,var(--paper) 35%);font-size:11px;color:var(--mut);pointer-events:none}

  /* sheet */
  .sheet{position:fixed;inset:0;max-width:540px;margin:0 auto;background:var(--paper);z-index:40;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
  .sheet.show{transform:translateY(0)}
  .sheet header{background:var(--navy);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:11px;border-bottom:3px solid var(--leche);flex:0 0 auto}
  .sheet header .x{background:none;border:none;color:#fff;font-size:25px;line-height:1;cursor:pointer;padding:0 3px}
  .sheet header .h{flex:1;min-width:0}
  .sheet header .h b{font-size:14px;display:block}
  .sheet header .h span{font-size:11px;color:#8aa0b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .sbody{flex:1;overflow-y:auto;padding:14px 15px 30px}
  .sect{margin-bottom:17px}
  .sect>h3{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .sect>h3::before{content:'';width:14px;height:2px;background:var(--leche)}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ib{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .ib .k{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
  .ib .v{font-size:13.5px;font-weight:700;margin-top:2px}
  .ib.full{grid-column:1/-1}

  .phlane{margin-bottom:11px}
  .phlane .lbl{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .phlane .lbl .tag{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
  .tag-prev{background:var(--pend-bg);color:var(--steel)} .tag-fin{background:var(--done-bg);color:var(--done)}
  .phscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .phscroll::-webkit-scrollbar{height:0}
  .ph{position:relative;width:112px;height:142px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#cdd6df}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .geo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:7.5px;padding:13px 5px 4px;line-height:1.3}
  .ph .geo .c{font-weight:700}
  .ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;border:2px dashed var(--line);background:#fff;color:var(--mut);cursor:pointer;font-size:10.5px;font-weight:600}
  .ph.add .plus{font-size:24px;font-weight:300;line-height:1}

  .ph-delete{
  position:absolute;
  top:5px;
  right:5px;
  z-index:5;
  width:25px;
  height:25px;
  border:none;
  border-radius:50%;
  background:rgba(192,54,44,.92);
  color:#fff;
  font-size:15px;
  font-weight:800;
  line-height:25px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}

  .extra-box{background:#fff;border:1px solid var(--line);border-left:4px solid var(--extra);border-radius:8px;padding:11px 12px}
  .extra-box .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .extra-box .top .t{font-size:12px;font-weight:700}
  .extra-box .top .badge{font-size:9px;font-weight:800;background:var(--extra);color:#fff;padding:2px 7px;border-radius:4px}
  .extra-box .calc{font-size:11px;color:var(--steel);line-height:1.6}
  .extra-box .calc b{color:var(--extra)}

  .tl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 0}
  .tlrow{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
  .tlrow:last-child{border-bottom:none}
  .tldot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--line)}
  .tldot.on{background:var(--done)} .tldot.wait{background:var(--wait)}
  .tlrow .tx{flex:1}.tlrow .tx b{font-size:12px}.tlrow .tx span{display:block;font-size:10px;color:var(--mut)}
  .tlrow .when{font-size:10px;color:var(--mut);text-align:right}

  .actions{
  position:sticky;
  bottom:0;
  z-index:20;
  background:linear-gradient(
    transparent 0,
    var(--paper) 22%,
    var(--paper) 100%
  );
  padding:13px 0 6px;
  display:flex;
  flex-direction:column;
  gap:8px;
  isolation:isolate;
  }
  .btn{border:none;border-radius:9px;padding:13px;font:inherit;font-size:13.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;text-transform:uppercase;width:100%}
  .btn-leche{background:var(--leche);color:#fff}.btn-leche:active{background:var(--leche-d)}
  .btn-admin{background:var(--wait);color:#fff}
  .btn-rej{background:#fff;color:var(--rej);border:1.5px solid var(--rej)}
  .btn-done{background:var(--done);color:#fff}
  .btn:disabled{background:#dde3ea;color:#9aa7b4;cursor:not-allowed}
  .lock{font-size:11px;text-align:center;color:var(--mut);padding:6px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  /* assign view */
  .assignrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .assignrow .zn{flex:1}.assignrow .zn b{font-size:13px}.assignrow .zn span{font-size:10.5px;color:var(--mut);display:block}
  .assignrow .zc{font-size:18px;font-weight:800;color:var(--leche)}
  .estados-z{font-size:10px;color:var(--mut);margin-top:2px;line-height:1.4}
  .note{background:var(--milk);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--steel);margin-bottom:10px;line-height:1.5}
  .note b{color:var(--ink)}

  /* ===== bottom nav ===== */
  .scroll{padding-bottom:74px}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;max-width:540px;margin:0 auto}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--mut);font-size:8.5px;font-weight:600;letter-spacing:.1px;border:none;background:none;padding:0}
  .navbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .navbtn.on{color:var(--leche)}
  .navbtn.on svg{stroke:var(--leche)}
  .rolehint{bottom:60px}
  /* ===== programa / desviaciones ===== */
  .progrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .progrow .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .progrow .t b{font-size:13px}
  .desv-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .d-on{background:var(--done-bg);color:var(--done)} .d-late{background:var(--rej-bg);color:var(--rej)} .d-soon{background:var(--wait-bg);color:var(--wait)} .d-none{background:var(--pend-bg);color:var(--mut)}
  .progrow .dates{display:flex;gap:0;font-size:10px}
  .progrow .dt{flex:1;text-align:center;border-left:1px solid var(--line)}
  .progrow .dt:first-child{border-left:none}
  .progrow .dt .v{font-weight:700;font-size:12px;font-family:'SF Mono',monospace}
  .progrow .dt .k{color:var(--mut);font-size:8px;text-transform:uppercase;letter-spacing:.4px}
  .curvebox{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .curvebox h4{font-size:12px;margin-bottom:10px;color:var(--steel)}
  .curve-svg{width:100%;height:150px}
  .progsum{display:flex;gap:8px;margin-bottom:10px}
  .progsum .s{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
  .progsum .s .v{font-size:19px;font-weight:800;line-height:1}
  .progsum .s .k{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  /* ===== actas ===== */
  .lotecard{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;cursor:pointer}
  .lotecard .top{display:flex;align-items:center;gap:10px;padding:11px 13px}
  .lotecard .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:17px}
  .ic-dep{background:var(--vobo-bg)} .ic-con{background:var(--milk)}
  .lotecard .nm{flex:1}.lotecard .nm b{font-size:13.5px;display:block}.lotecard .nm span{font-size:10.5px;color:var(--mut)}
  .acta-badge{font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;flex:0 0 auto}
  .ab-rev{background:var(--wait-bg);color:var(--wait)} .ab-ap{background:var(--done-bg);color:var(--done)} .ab-rej{background:var(--rej-bg);color:var(--rej)} .ab-arm{background:var(--pend-bg);color:var(--mut)}
  .lotecard .foot{border-top:1px solid var(--line);display:flex;font-size:10px}
  .lotecard .foot .f{flex:1;padding:7px;text-align:center;border-left:1px solid var(--line)}
  .lotecard .foot .f:first-child{border-left:none}
  .lotecard .foot .f .v{font-weight:800;font-size:12px}.lotecard .foot .f .k{color:var(--mut);font-size:8px;text-transform:uppercase}
  .obschips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .obschip{font-size:11px;padding:6px 10px;border:1px solid var(--line);border-radius:18px;cursor:pointer;background:#fff;user-select:none}
  .obschip.on{background:var(--rej);color:#fff;border-color:var(--rej)}
  .acta-upload{border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--mut);cursor:pointer;background:#fff;margin-bottom:10px}
  .acta-upload.done{border-color:var(--done);color:var(--done);background:var(--done-bg)}
  .acta-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .cobro-flag{display:flex;align-items:center;gap:8px;background:var(--milk);border-radius:9px;padding:9px 11px;font-size:12px;margin-bottom:8px}
  .cobro-flag .k{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  /* ===== map ===== */

<script>
function mostrarLogin(){ document.getElementById('loginScreen').style.display='flex'; }

async function hacerLogin() {
  const mail =
    document
      .getElementById('loginMail')
      .value
      .trim();

  const pass =
    document
      .getElementById('loginPass')
      .value;

  const boton =
    document.querySelector(
      '#loginScreen button'
    );

  const errorEl =
    document.getElementById('loginError');

  if (!mail || !pass) {
    errorEl.textContent =
      'Ingresa correo y contraseña';

    return;
  }

  boton.disabled = true;
  boton.textContent = 'Ingresando…';
  errorEl.textContent = '';

  try {
    await iniciarSesion(mail, pass);

    document
      .getElementById('loginScreen')
      .style
      .display = 'none';

    await arrancarApp();

  } catch (error) {
    console.error(
      'Error de inicio de sesión:',
      error
    );

    errorEl.textContent =
      'Correo o contraseña incorrectos';

  } finally {
    boton.disabled = false;
    boton.textContent = 'Entrar';
  }
}

async function confirmarCierreSesion() {
  const confirmar = window.confirm(
    '¿Deseas cerrar la sesión actual?'
  );

  if (!confirmar) {
    return;

  try {
    await cerrarSesion();
  } catch (error) {
    console.error(
      'No fue posible cerrar la sesión:',
      error
    );

    toast('No fue posible cerrar la sesión');
  }
}

let SUBS={};
let ZONAS_DINAMICAS=[];
const METAS={"SUB-1": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-2": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-3": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-4": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-5": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}, "SUB-6": {"semana": 10, "mes": 40, "inicio": "2026-07-06", "termino": "2026-10-31"}};


/* ---- contrato ---- */
const MIN=1000, MAX=2000;
// ===== PRECIOS =====
// A LA DEPENDENCIA: unidad estándar por lechería = 21 m² a $17,769.75 + IVA (fijo, sin extraordinarios)
const PRECIO_FACHADA=17769.75, M2_STD=21, M2_MAX = 28, IVA=0.16;
function m2Real(p) {
  if (
    p?.m2 === null ||
    p?.m2 === undefined ||
    p?.m2 === ''
  ) {
    return M2_STD;
  }

  const valor = Number(p.m2);

  return Number.isFinite(valor)
    ? valor
    : M2_STD;
}

function m2VisiblePorRol(p) {
  if (ROLE === 'dep') {
    return M2_STD;
  }

  return m2Real(p);
}
// EXTRAORDINARIOS: control INTERNO hacia subcontratistas (la dependencia NO paga extra).
// Precio por m² adicional configurable por subcontratista (default; se ajusta al cerrar cada subcontrato).
const PRECIO_M2_EXTRA_DEFAULT=450.00;
const PRECIO_M2_EXTRA_SUB={}; // {'SUB-1':450, ...} — se llena desde config; si no, usa el default
function precioExtraSub(sub){ return PRECIO_M2_EXTRA_SUB[sub] || PRECIO_M2_EXTRA_DEFAULT; }
// requisitos de evidencia (anexo técnico)
const MIN_FOTOS_PREV=3, MIN_FOTOS_FIN=3;
const CAT_FIN_OBLIGATORIAS=['fachada','letrero']; // de las "después"
const CAT_LABEL={fachada:'Fachada global',letrero:'Letrero lechería',general:'General',detalle:'Detalle'};
const MIN_FACTURA=50; // mínimo de lecherías por factura (ajustable con la dependencia)

const EMPRESA='LUMEN-OAX PROYECTOS Y CONSTRUCCIÓN S.A. DE C.V.';

const DEPENDENCIA='LECHE PARA EL BIENESTAR, S.A. DE C.V.';
const PROCEDIMIENTO='LA-08-VST-008VST977-N-54-2026';
// helpers de requisitos de fotos
function tiposFin(p){ return new Set((p.fotosFin||[]).map(f=>f.tipo)); }
function faltanCatFin(p){ const t=tiposFin(p); return CAT_FIN_OBLIGATORIAS.filter(c=>!t.has(c)); }
function fotosOk(p){
  return (p.fotosPrev||[]).length>=MIN_FOTOS_PREV
      && (p.fotosFin||[]).length>=MIN_FOTOS_FIN
      && faltanCatFin(p).length===0;
}
const HOY=new Date();
function addDays(iso, d) {
    const dt = new Date(iso);
    dt.setDate(dt.getDate() + d);
    return dt.toISOString().slice(0, 10);
}

function daysBetween(a, b) {
    return Math.round((new Date(b)-new Date(a))/86400000);
}

function creditoCompensacionM2(p) {
  if (!p?.bloque_especial_m2) {
    return 0;
  }

  return Math.max(
    M2_STD - m2Real(p),
    0
  );
}

function consumoCompensacionM2(p) {
  if (!p?.bloque_especial_m2) {
    return 0;
  }

  return Math.max(
    m2Real(p) - M2_STD,
    0
  );
}

function resumenCompensacionM2(
  grupo = 'BLOQUE_212'
) {

  const puntos =
    (LECH || []).filter(p =>
      p.bloque_especial_m2 &&
      p.grupo_compensacion_m2 === grupo &&
      p.status === 'at'
    );

  const credito =
    puntos.reduce(
      (total, p) =>
        total +
        creditoCompensacionM2(p),
      0
    );

  const consumo =
    puntos.reduce(
      (total, p) =>
        total +
        consumoCompensacionM2(p),
      0
    );

  return {
    atendidas: puntos.length,
    credito,
    consumo,
    saldo: credito - consumo
  };
}

function obtenerReporteCompensacionM2(
  grupo = 'BLOQUE_212'
) {

  const todos =
  (window.LECH || []).filter(p =>
      p.bloque_especial_m2 === true &&
      p.grupo_compensacion_m2 === grupo
    );

  const atendidos =
    todos.filter(p =>
      p.status === 'at'
    );

  const detalle =
    todos.map(p => {

      const real =
        m2Real(p);

      const esAtendida =
        p.status === 'at';

      const credito =
        esAtendida
          ? creditoCompensacionM2(p)
          : 0;

      const consumo =
        esAtendida
          ? consumoCompensacionM2(p)
          : 0;

      return {
        pv: p.pv,
        cuadrilla: p.sub || '',
        zona: p.zona || '',
        estado: p.estado || '',
        status: p.status,
        fecha_real: p.freal || '',

        contractual_m2:
          M2_STD,

        real_m2:
          real,

        credito_m2:
          credito,

        consumo_m2:
          consumo,

        balance_m2:
          credito - consumo
      };
    });

  const creditoTotal =
    detalle.reduce(
      (total, p) =>
        total + p.credito_m2,
      0
    );

  const consumoTotal =
    detalle.reduce(
      (total, p) =>
        total + p.consumo_m2,
      0
    );

  const m2Contractuales =
    atendidos.length *
    M2_STD;

  const m2Reales =
    detalle
      .filter(p =>
        p.status === 'at'
      )
      .reduce(
        (total, p) =>
          total + p.real_m2,
        0
      );

  return {

    grupo,

    total_lecherias:
      todos.length,

    atendidas:
      atendidos.length,

    pendientes:
      todos.length -
      atendidos.length,

    m2_contractuales:
      m2Contractuales,

    m2_reales:
      m2Reales,

    credito_generado:
      creditoTotal,

    credito_consumido:
      consumoTotal,

    saldo_m2:
      creditoTotal -
      consumoTotal,

    detalle
  };
}

function datosReporteEspecial() {

  const reporte =
    obtenerReporteCompensacionM2(
      'BLOQUE_212'
    );


  const ordenCuadrilla = {
    CUA12C: 1,
    CUA13C: 2,
    CUA14C: 3
  };


  const detalle =
    [...reporte.detalle]
      .sort((a, b) => {

        const ca =
          ordenCuadrilla[
            a.cuadrilla
          ] || 99;

        const cb =
          ordenCuadrilla[
            b.cuadrilla
          ] || 99;

        if (ca !== cb) {
          return ca - cb;
        }

        return String(a.pv)
          .localeCompare(
            String(b.pv)
          );
      });


  const cuadrillas =
    [
      'CUA12C',
      'CUA13C',
      'CUA14C'
    ]
      .map(sub => {

        const puntos =
          detalle.filter(
            p =>
              p.cuadrilla === sub
          );

        const atendidas =
          puntos.filter(
            p =>
              p.status === 'at'
          );

        const credito =
          atendidas.reduce(
            (total, p) =>
              total +
              Number(
                p.credito_m2 || 0
              ),
            0
          );

        const consumo =
          atendidas.reduce(
            (total, p) =>
              total +
              Number(
                p.consumo_m2 || 0
              ),
            0
          );


        return {
          cuadrilla: sub,
          asignadas:
            puntos.length,

          atendidas:
            atendidas.length,

          pendientes:
            puntos.length -
            atendidas.length,

          credito,

          consumo,

          saldo:
            credito -
            consumo
        };
      });


  return {
    reporte,
    cuadrillas,
    detalle
  };
}

function reconstruirConfiguracionDinamica() {
  /*
   * Zonas reales presentes en el padrón.
   */
  ZONAS_DINAMICAS = [
    ...new Set(
      LECH
        .map(p => p.zona)
        .filter(Boolean)
    )
  ].sort((a, b) =>
    String(a).localeCompare(
      String(b),
      'es',
      {
        numeric: true,
        sensitivity: 'base'
      }
    )
  );

  /*
   * Relación real SUB -> zonas.
   *
   * Ejemplo:
   * {
   *   "SUB-1": ["Z1", "Z4"],
   *   "SUB-2": ["Z1", "Z8"]
   * }
   */
  SUBS = {};

  LECH.forEach(p => {
    if (!p.sub || !p.zona) {
      return;
    }

    if (!SUBS[p.sub]) {
      SUBS[p.sub] = [];
    }

    if (
      !SUBS[p.sub].includes(p.zona)
    ) {
      SUBS[p.sub].push(p.zona);
    }
  });

  Object.keys(SUBS).forEach(sub => {
    SUBS[sub].sort((a, b) =>
      String(a).localeCompare(
        String(b),
        'es',
        {
          numeric: true,
          sensitivity: 'base'
        }
      )
    );
  });
}

function obtenerPuntosKPI(tipo) {
  const pts =
    visiblePts();

  if (tipo === 'ini') {
    return pts.filter(
      p => p.status === 'ini'
    );
  }

  if (tipo === 'at') {
    return pts.filter(
      p => p.status === 'at'
    );
  }

  if (tipo === 'ok') {
    return pts.filter(
      p => p.vobo === 'ok'
    );
  }

  if (tipo === 'ext') {
    return pts.filter(
      p => p.m2 > M2_STD
    );
  }

  return [];
}


function obtenerTituloKPI(tipo) {
  if (tipo === 'ini') {
    return 'Lecherías iniciadas';
  }

  if (tipo === 'at') {
    return 'Lecherías atendidas';
  }

  if (tipo === 'ok') {
    return 'Lecherías con Vo.Bo.';
  }

  if (tipo === 'ext') {
    return 'Lecherías con superficie extra';
  }

  return 'Detalle';
}

  const arr =

  const sheet =

  titulo.textContent =

  subtitulo.textContent =

        ? 'lechería'
        : 'lecherías'
    }`;

  body.innerHTML = `
    <div class="kpi-resumen">

      ${
        arr.length === 1
          ? 'lechería encontrada'
          : 'lecherías encontradas'

    sheet.classList.add('show');
    return;
  }


  const ordenadas =
    [...arr].sort((a, b) => {

      const estado =
        (a.estado || '')
          .localeCompare(
            b.estado || '',
            'es'
          );

      if (estado !== 0) {
        return estado;
      }

      return String(a.pv)
        .localeCompare(
          String(b.pv)
        );
    });


  ordenadas.forEach(p => {

    const stCls =
      p.status === 'at'
        ? 'st-at'
        : p.status === 'ini'
          ? 'st-ini'
          : 'st-no';

    const stTx =
      p.status === 'at'
        ? 'Atendido'

/* ---- tabs ---- */
function setTab(t) {
  const permitidas =
    tabsPermitidasPorRol();

  /*
   * No solamente ocultamos pestañas:
   * impedimos abrir módulos que no
   * corresponden al perfil actual.
   */
  if (
    !permitidas.includes(t)
  ) {
    console.warn(
      `El rol ${ROLE} no tiene acceso a la pestaña ${t}`
    );

    t = 'lista';
  }

  TAB = t;

  document
    .querySelectorAll(
      '.navbtn'
    )
    .forEach(b => {
      b.classList.toggle(
        'on',
        b.dataset.tab === t
      );
    });

  document
    .getElementById(
      'scroll'
    )
    .style.display =
      t === 'mapa'
        ? 'none'
        : 'block';

  document
    .getElementById(
      'mapWrap'
    )
    .style.display =
      t === 'mapa'
        ? 'block'
        : 'none';

  const showList =
    t === 'lista';

  document
    .getElementById(
      'crumbs'
    )
    .style.display =
      showList
        ? 'flex'
        : 'none';

  document
    .getElementById(
      'filters'
    )
    .style.display =
      showList
        ? 'flex'
        : 'none';

  render();

  if (t === 'mapa') {
    setTimeout(
      initMap,
      60
    );
  }
}

/* ---- render router ---- */
function render(){

  renderMinMax();
  renderKPI();

  if(TAB==='mapa'){
    if(MAP_READY) drawMarkers();
    return;
  }

  if(TAB==='programa'){
    renderPrograma();
    return;
  }

  if(TAB==='tablero'){
    renderTablero();
    return;
  }

  if(TAB==='actas'){
    renderActas();
    return;
  }

  if(TAB==='estim'){
    renderEstim();
    return;
  }

  if(TAB==='especial'){
    renderEspecial();
    return;
  }

  if(VIEW==='estados'){
    renderEstados();
  } else {
    renderPuntos();
  }
}

function renderCrumbs(){
  const c=document.getElementById('crumbs');
  if(VIEW==='estados'){ c.innerHTML=`<b style="color:var(--ink)">${ROLE==='sub'?'Estados de mi cartera':'Estados'}</b>`; }
  else c.innerHTML=`<a onclick="goEstados()">Estados</a><span class="sep">›</span><b style="color:var(--ink)">${CUR_EST}</b>`;
}

function renderFilters(){
  const f = document.getElementById('filters');

  if(VIEW === 'estados'){
    f.innerHTML = `
      <div class="search">
        <input
          placeholder="Buscar estado…"
          oninput="setSearch(this.value)"
          id="searchBox"
        >
      </div>`;

    document.getElementById('searchBox').value = SEARCH;
    return;
  }

  const cur = FILTER;

  f.innerHTML = `
    <div class="chip ${cur==='all'?'on':''}" onclick="setFilter('all',this)">Todas</div>
    <div class="chip ${cur==='no'?'on':''}" onclick="setFilter('no',this)">No atendido</div>
    <div class="chip ${cur==='ini'?'on':''}" onclick="setFilter('ini',this)">Iniciada</div>
    <div class="chip ${cur==='at'?'on':''}" onclick="setFilter('at',this)">Atendido</div>
    <div class="chip ${cur==='wait'?'on':''}" onclick="setFilter('wait',this)">Por Vo.Bo.</div>

        oninput="setSearch(this.value)"
        id="searchBox"
      >
    </div>`;

}

function getQ(){
  return SEARCH.trim().toLowerCase();
}

function setSearch(valor){
  SEARCH = valor;

  render();

  requestAnimationFrame(() => {
    const input = document.getElementById('searchBox');

    if(input){
      input.focus();

      const final = input.value.length;
      input.setSelectionRange(final, final);
    }
  });
}

function renderEstados(){
  renderCrumbs(); renderFilters();
  const q=getQ();
  const pts=visiblePts();
  const map={};
  pts.forEach(p=>{ (map[p.estado]=map[p.estado]||[]).push(p); });
  let ests=Object.keys(map).sort();
  if(q) ests=ests.filter(e=>e.toLowerCase().includes(q));
  const sc=document.getElementById('scroll'); sc.innerHTML='';
  if(!ests.length){ sc.innerHTML='<div style="text-align:center;color:var(--mut);padding:40px 0">Sin estados.</div>'; return; }
  ests.forEach(e=>{
    const arr=map[e], tot=arr.length, at=arr.filter(p=>p.status==='at').length;
    const pct=Math.round(at/tot*100);
    const abbr=e.replace('Edo. ','').slice(0,4).toUpperCase();
    const zonasEstado =
      [
        ...new Set(
          arr
            .map(p => p.zona)
            .filter(Boolean)
        )
      ]
        .sort((a, b) =>
          String(a).localeCompare(
            String(b),
            'es',
            {
              numeric: true,
              sensitivity: 'base'
            }
          )
        )
        .join(', ');
    const d=document.createElement('div'); d.className='estcard'; d.onclick=()=>openEstado(e);
    d.innerHTML=`<div class="top">
        <div class="flag">${abbr}</div>
        <div class="nm">
        <b>${e}</b>
        <span>${zonasEstado || 'Sin zona'}</span>
        </div>
        <div class="cnt"><div class="num">${tot}</div><div class="pct">${at} atend · ${pct}%</div></div>
      </div><div class="estbar"><div class="f" style="width:${pct}%"></div></div>`;
    sc.appendChild(d);
  });
}

function openEstado(e){
  CUR_EST = e;
  VIEW = 'puntos';
  FILTER = 'all';
  SEARCH = '';
  render();
}

function goEstados(){
  VIEW = 'estados';
  CUR_EST = null;
  FILTER = 'all';
  SEARCH = '';
  render();
}

function matchF(p) {
  if (
    FILTER === 'no'
  ) {
    return p.status === 'no';
  }

  if (
    FILTER === 'ini'
  ) {
    return p.status === 'ini';
  }

  if (
    FILTER === 'at'
  ) {
    return p.status === 'at';
  }

  if (
    FILTER === 'wait'
  ) {
    return (
      p.status === 'at' &&
      p.vobo === 'wait'
    );
  }

  if (
    FILTER === 'ext'
  ) {
    return p.m2 > M2_STD;
  }

  return true;
}

function renderPuntos(){
  renderCrumbs(); renderFilters();
  const q=getQ();
  let arr=visiblePts().filter(p=>p.estado===CUR_EST&&matchF(p));
  if(q) arr=arr.filter(p=>p.pv.includes(q)||(p.calle||'').toLowerCase().includes(q)||(p.colonia||'').toLowerCase().includes(q)||(p.municipio||'').toLowerCase().includes(q));
  const sc=document.getElementById('scroll'); sc.innerHTML='';
  if(!arr.length){ sc.innerHTML='<div style="text-align:center;color:var(--mut);padding:40px 0">Sin lecherías en este filtro.</div>'; return; }
  arr.forEach(p=>{
  const stCls =
  p.status === 'at'
    ? 'st-at'
    : p.status === 'ini'
      ? 'st-ini'
      : 'st-no';

  const stTx =
  p.status === 'at'
    ? 'Atendido'
    : p.status === 'ini'
      ? 'Iniciada'
      : 'No atendido';
    let voV='—',voC='v-pe';
    if(p.status==='at'){ if(p.vobo==='ok'){voV='Aprobado';voC='v-ok'} else if(p.vobo==='rej'){voV='Rechazado';voC='v-re'} else {voV='Por revisar';voC='v-wa'} }
    const exc=p.m2-M2_STD;
    const c=document.createElement('div'); c.className='card'; c.onclick=()=>openSheet(p.id);
    c.innerHTML=`<div class="row1">
        <span class="pv">${p.pv}</span>
        <div class="addr"><div class="a">${p.calle||'(sin calle)'}</div><div class="s">${p.colonia?p.colonia+' · ':''}${p.municipio}</div></div>
        <span class="stbadge ${stCls}">${stTx}</span>
      </div>
      <div class="row2">
        <div class="meta"><div class="v ${voC}">${voV}</div><div class="k">Vo.Bo.</div></div>
        <div class="meta"><div class="v">${p.m2} m²</div><div class="k">Superficie</div></div>
        <div class="meta"><div class="v ${exc>0?'v-ex':''}">${exc>0?'+'+exc:'—'}</div><div class="k">Extra m²</div></div>
        <div class="meta"><div class="v">${p.beneficiarios||'—'}</div><div class="k">Benef.</div></div>
      </div>`;
    sc.appendChild(c);
  });
}

async function confirmarEliminarFoto(idFoto, urlCodificada) {
  if (ROLE !== 'sub' || !CUR) return;

  if (CUR.vobo === 'ok') {
    toast('No se pueden borrar fotos con Vo.Bo. aprobado');
    return;
  }

  const confirmado = window.confirm(
    '¿Eliminar esta fotografía? Esta acción no se puede deshacer.'
  );

  if (!confirmado) return;

  const archivoUrl = decodeURIComponent(urlCodificada);

  try {
    await eliminarFoto(idFoto, archivoUrl);

    const fotos = await cargarFotos(CUR.pv);

    CUR.fotosPrev = fotos.prev;
    CUR.fotosFin = fotos.fin;

    toast('Fotografía eliminada');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible eliminar la fotografía');
  }
}

async function seleccionarArchivo(){
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = () => {
      if (input.files.length > 0) {
        resolve(input.files[0]);
      }else{
        resolve(null);
      }
    };
    input.click();
  });
}
async function obtenerUbicacion(){
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve({ lat: null, lng: null});
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        });
      },
      () => {
        resolve({
          lat: null,
          lng: null
        });
      },
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
      );
  });
}

async function addPhoto(
  kind,
  tipo
) {
  if (
    ROLE !== 'sub' ||
    !CUR
  ) {
    return;
  }

  const archivo =
    await seleccionarArchivo();

  if (!archivo) {
    return;
  }


  const {
    lat,
    lng
  } =
    await obtenerUbicacion();


  await subirFoto(
    CUR.pv,
    kind,
    tipo,
    archivo,
    lat,
    lng
  );


  const fotos =
    await cargarFotos(
      CUR.pv
    );


  CUR.fotosPrev =
    fotos.prev;

  CUR.fotosFin =
    fotos.fin;


  toast(
    'Foto subida correctamente'
  );


  await openSheet(
    CUR.id
  );
}

async function addAdjunto() {
  if (ROLE !== 'sub' || !CUR) return;

  if (CUR.vobo === 'ok') {
    toast('No se pueden agregar documentos con Vo.Bo. aprobado');
    return;
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';

  input.onchange = async () => {
    const archivo = input.files?.[0];
    if (!archivo) return;

    const tiposPermitidos = [
      'application/pdf',
      'image/jpeg',
      'image/png'
    ];

    if (
      archivo.type &&
      !tiposPermitidos.includes(archivo.type)
    ) {
      toast('Solo se permiten archivos PDF, JPG o PNG');
      return;
    }

    const limiteBytes = 15 * 1024 * 1024;

    if (archivo.size > limiteBytes) {
      toast('El archivo no debe superar 15 MB');
      return;
    }

    const esImagen = archivo.type.startsWith('image/');
    const tipo = esImagen ? 'mapa' : 'documento';

    try {
      const adjunto = await subirAdjunto(
        CUR.pv,
        tipo,
        archivo
      );

      CUR.adjuntos = CUR.adjuntos || [];
      CUR.adjuntos.push(adjunto);

      toast('Documento adjuntado');
      await openSheet(CUR.id);
      render();
    } catch (error) {
      console.error(error);
      toast('No fue posible adjuntar el documento');
    }
  };

  input.click();
}

async function confirmarEliminarAdjunto(idAdjunto, urlCodificada) {
  if (ROLE !== 'sub' || !CUR) return;

  if (CUR.vobo === 'ok') {
    toast('No se pueden borrar documentos con Vo.Bo. aprobado');
    return;
  }

  const confirmado = window.confirm(
    '¿Eliminar este documento? Esta acción no se puede deshacer.'
  );

  if (!confirmado) return;

  try {
    const archivoUrl = decodeURIComponent(urlCodificada);

    await eliminarAdjunto(idAdjunto, archivoUrl);

    CUR.adjuntos = (CUR.adjuntos || [])
      .filter(adjunto => adjunto.id !== idAdjunto);

    toast('Documento eliminado');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible eliminar el documento');
  }
}

async function generarActaApertura() {
  if (!CUR) {
    return;
  }

 /*
 * GEN y CUADRILLA pueden generar
 * el Acta V2 individual.
 */
if (
  ROLE !== 'gen' &&
  ROLE !== 'sub'
) {
  toast(
    'Tu perfil no puede generar esta acta'
  );

  return;
}

  try {
    let acta =
      CUR.actaApertura;

    /*
     * Si todavía no existe el registro,
     * lo creamos.
     */
    if (!acta) {
      acta =
        await crearActaAperturaBD(
          CUR
        );
    }

    /*
     * Si ya existe PDF generado,
     * simplemente lo abrimos.
     */
    if (
        acta.documento_generado_v2_url
      ) {
        window.open(
          acta.documento_generado_v2_url,
          '_blank'
        );

        CUR.actaApertura =
          acta;

        return;
      }

    const doc =
      crearPDFActaApertura(
        CUR,
        acta
      );

    const blob =
      doc.output(
        'blob'
      );

    acta =
      await guardarPDFGeneradoActaIndividualV2(
        acta,
        blob
      );

    CUR.actaApertura =
      acta;

    /*
     * También descargamos una copia local
     * para impresión/firma.
     */
    doc.save(
      `Acta_Inicio_Entrega_Recepcion_${CUR.pv}.pdf`
    );

    toast(
      'Acta de inicio y entrega-recepción generada'
    );

    await openSheet(
      CUR.id
    );

  } catch (error) {
    console.error(
      error
    );

    toast(
      error.message ||
      'No fue posible generar el acta'
    );
  }
}

async function addExtraEvidencia() {
  if (ROLE !== 'sub') return;

  const excedente = Math.max(0, CUR.m2 - M2_STD);

  if (excedente <= 0) {
    toast('Primero captura una superficie mayor a 21 m²');
    return;
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.jpg,.jpeg,.png,.pdf';

  input.onchange = async () => {
    const archivo = input.files?.[0];
    if (!archivo) return;

    try {
      /*
       * Ruta fija: si se vuelve a cargar una evidencia,
       * sustituye la anterior en lugar de crear archivos huérfanos.
       */
      const ruta = `${CUR.pv}/excedente/evidencia`;

      const { error: errorSubida } = await sb.storage
        .from('evidencias')
        .upload(ruta, archivo, {
          upsert: true,
          contentType: archivo.type || undefined
        });

      if (errorSubida) {
        throw errorSubida;
      }

      const { data: publica } = sb.storage
        .from('evidencias')
        .getPublicUrl(ruta);

      const url = publica.publicUrl;
      const precio = precioExtraSub(CUR.sub);

      await guardarExcedente(
        CUR.pv,
        excedente,
        precio,
        url
      );

      CUR.m2_excedente = excedente;
      CUR.precio_m2 = precio;
      CUR.evidencia_url = url;
      CUR.extraEvidencia = [url];

      toast('Evidencia del excedente guardada');
      openSheet(CUR.id);
      render();
    } catch (error) {
      console.error(error);
      toast('No fue posible guardar la evidencia');
    }
  };

  input.click();
}

async function markAt() {
  if (!CUR || ROLE !== 'sub') return;

  const aperturaAutorizada =
  !!(
    CUR.actaApertura &&
    CUR.actaApertura.documento_firmado_v2_url &&
    (
      CUR.actaApertura.estado === 'en_revision' ||
      CUR.actaApertura.estado === 'aprobada'
    )
  );

  if (!aperturaAutorizada) {
    toast(
      'Primero genera, firma y carga el Acta de Inicio. Después podrás marcar la lechería como atendida.'
    );
    return;
  }

  const nP = (CUR.fotosPrev || []).length;
  const nF = (CUR.fotosFin || []).length;

  const requiereStreet =
  CUR.bloque_especial_m2 === true &&
  m2Real(CUR) < M2_STD;

  const nStreet =
    (CUR.fotosStreet || []).length;

  if (
    requiereStreet &&
    nStreet < 1
  ) {
    toast(
      'Esta lechería tiene menos de 21 m² reales. Debes cargar al menos una imagen en Referencia histórica antes de marcarla como atendida.'
    );

    return;
  }

  if (nP < MIN_FOTOS_PREV) {
    toast(`Faltan fotos previas (${nP}/${MIN_FOTOS_PREV})`);
    return;
  }

  if (nF < MIN_FOTOS_FIN) {
    toast(`Faltan fotos finales (${nF}/${MIN_FOTOS_FIN})`);
    return;
  }

  const categoriasFaltantes = faltanCatFin(CUR);

  if (categoriasFaltantes.length) {
    toast(
      'Falta foto obligatoria: ' +
      categoriasFaltantes.map(c => CAT_LABEL[c]).join(', ')
    );
    return;
  }

  try {
    await guardarAtendido(CUR.pv, CUR.m2);

    CUR.status = 'at';
    CUR.vobo = 'wait';
    CUR.motivo = '';
    CUR.freal = new Date().toISOString().slice(0, 10);

    toast('✓ Atendido — pasa a Vo.Bo.');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible marcar la lechería como atendida');
  }
}

async function setM2(v) {

  if (!CUR || ROLE !== 'sub') {
    return;
  }

  const m2Anterior =
    Number(CUR.m2);

  const valor =
    Number(v);


  if (!Number.isFinite(valor)) {

    toast(
      'Ingresa una superficie válida'
    );

    await openSheet(CUR.id);
    return;
  }


  /*
   * HISTÓRICOS PROTEGIDOS
   *
   * Si ya tenían más de 28 m² antes
   * del nuevo límite, no permitimos
   * modificarlos.
   */
  if (CUR.m2_protegido) {

  toast(
    `Este registro conserva su superficie histórica de ${m2Anterior} m²`
  );

  await openSheet(CUR.id);
  return;
}


  const minimoPermitido =
  CUR.bloque_especial_m2
    ? 0
    : M2_STD;

  if (valor < minimoPermitido) {
    toast(
      CUR.bloque_especial_m2
        ? 'La superficie mínima permitida para este bloque es 0 m²'
        : `La superficie mínima es de ${M2_STD} m²`
    );

    await openSheet(CUR.id);
    return;
  }


  if (valor > M2_MAX) {

    toast(
      `La superficie máxima permitida es de ${M2_MAX} m²`
    );

    await openSheet(CUR.id);
    return;
  }


  CUR.m2 =
    valor;

  CUR.m2_excedente =
    Math.max(
      0,
      valor - M2_STD
    );


  try {

    await guardarM2(
      CUR.pv,
      CUR.m2,
      CUR.status,
      CUR.vobo,
      CUR.motivo,
      CUR.freal
    );

    await openSheet(
      CUR.id
    );

    render();

  } catch (error) {

    console.error(error);

    CUR.m2 =
      m2Anterior;

    CUR.m2_excedente =
      Math.max(
        0,
        m2Anterior - M2_STD
      );

    toast(
      'No se pudo guardar la superficie'
    );

    await openSheet(
      CUR.id
    );
  }
}
async function vobo(aprobado) {
  if (!CUR || ROLE !== 'admin') return;

  if (aprobado) {
    try {
      await guardarVobo(CUR.pv, 'ok');

      CUR.vobo = 'ok';
      CUR.motivo = '';

      toast('✅ Vo.Bo. otorgado — entra a estimación');
      await openSheet(CUR.id);
      render();

      // Si la Estimación Interna LUMEN está cargada, refresca sus
      // contadores/listado en segundo plano para reflejar el nuevo Vo.Bo.
      if (ESTIMACION_LUMEN?.estimacion?.numero) {
        await cargarVistaEstimacionLumen(
          Number(ESTIMACION_LUMEN.estimacion.numero)
        );
      }
    } catch (error) {
      console.error(error);
      toast('No fue posible otorgar el Vo.Bo.');
    }

    return;
  }

  const textarea = document.getElementById('rejMotivo');
  const motivo = textarea ? textarea.value.trim() : '';

  if (!motivo) {
    toast('Escribe el motivo del rechazo');

    if (textarea) {
      textarea.focus();
    }

    return;
  }

  try {
    await guardarVobo(CUR.pv, 'rej', motivo);

    CUR.vobo = 'rej';
    CUR.motivo = motivo;

    toast('Rechazado — regresa a la cuadrilla');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible rechazar la lechería');
  }
}

async function cambiarFechaCompromiso(
  id,
  nuevaFecha
) {
  const p = LECH[id];

  if (!p) {
    toast(
      'No se encontró la lechería'
    );
    return;
  }

  if (
    ROLE !== 'gen' &&
    ROLE !== 'admin'
  ) {
    toast(
      'Tu perfil no puede modificar la fecha compromiso'
    );
    return;
  }

  const fechaAnterior =
    p.fcomp || '';

  if (
    nuevaFecha === fechaAnterior
  ) {
    return;
  }

  try {
    await guardarFechaCompromiso(
      p.pv,
      nuevaFecha
    );

    p.fcomp =
      nuevaFecha || '';

    toast(
      'Fecha compromiso actualizada'
    );

    /*
     * Actualizamos la ficha para que
     * desviación y programa se recalculen.
     */
    openSheet(id);

    /*
     * Los módulos usan p.fcomp directamente,
     * por lo que también quedarán actualizados
     * sin volver a consultar Supabase.
     */
    render();

  } catch (error) {
    console.error(
      'No fue posible actualizar la fecha compromiso:',
      error
    );

    /*
     * Dejamos el valor anterior en memoria.
     */
    p.fcomp =
      fechaAnterior;

    toast(
      'No fue posible guardar la fecha'
    );
  }
}

async function resend() {
  if (!CUR || ROLE !== 'sub') return;

  if (CUR.vobo !== 'rej') {
    toast('Esta lechería no está rechazada');
    return;
  }

  const nP = (CUR.fotosPrev || []).length;
  const nF = (CUR.fotosFin || []).length;
  const categoriasFaltantes = faltanCatFin(CUR);

  if (nP < MIN_FOTOS_PREV) {
    toast(`Faltan fotos previas (${nP}/${MIN_FOTOS_PREV})`);
    return;
  }

  if (nF < MIN_FOTOS_FIN) {
    toast(`Faltan fotos finales (${nF}/${MIN_FOTOS_FIN})`);
    return;
  }

  if (categoriasFaltantes.length) {
    toast(
      'Falta foto obligatoria: ' +
      categoriasFaltantes.map(c => CAT_LABEL[c]).join(', ')
    );
    return;
  }

  try {
    await guardarVobo(CUR.pv, 'wait');

    CUR.vobo = 'wait';
    CUR.motivo = '';

    toast('Reenviado a revisión');
    await openSheet(CUR.id);
    render();
  } catch (error) {
    console.error(error);
    toast('No fue posible reenviar la lechería');
  }
}

function markerColor(p) {
  if (
    p.status === 'ini'
  ) {
    return '#d6a000';
  }

  if (
    p.status !== 'at'
  ) {
    return '#9aa7b4';
  }

  if (
    p.vobo === 'ok'
  ) {
    return '#1f8a4c';
  }

  if (
    p.vobo === 'rej'
  ) {
    return '#c0362c';
  }

  return '#e08a1e';
}

function initMap(){
  if(!MAP){
    MAP=L.map('map',{zoomControl:true,attributionControl:false}).setView([21.5,-99.5],5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(MAP);
    MAPLAYER=L.layerGroup().addTo(MAP);
    MAP_READY=true;
  }
  MAP.invalidateSize();
  drawMarkers();
}

function drawMarkers(){
  if (!MAPLAYER) {
    return;
  }

  MAPLAYER.clearLayers();

  const pts = visiblePts().filter(p => {
    if (
      p.lat === null ||
      p.lat === undefined ||
      p.lat === '' ||
      p.lng === null ||
      p.lng === undefined ||
      p.lng === ''
    ) {
      return false;
    }

    const lat = Number(p.lat);
    const lng = Number(p.lng);

    return (
      Number.isFinite(lat) &&
      Number.isFinite(lng) &&
      lat >= -90 &&
      lat <= 90 &&
      lng >= -180 &&
      lng <= 180
    );
  });

  const bounds=[];
  pts.forEach(p=>{
    const lat = Number(p.lat);
    const lng = Number(p.lng);
    const c=markerColor(p);
    const m=L.circleMarker([lat,lng],{radius:6,color:'#fff',weight:1.5,fillColor:c,fillOpacity:.95});
    const stTxt =
    p.status === 'at'
      ? (
          p.vobo === 'ok'
            ? 'Con Vo.Bo.'
            : p.vobo === 'rej'
              ? 'Rechazado'
              : 'Atendido s/ Vo.Bo.'
        )
      : p.status === 'ini'
        ? 'Iniciada'
        : 'No atendido';
    m.bindPopup(`<b>P.V. ${p.pv}</b><br>${p.calle||''}<br><span style="color:#6b7b8c">${p.municipio}, ${p.estado}</span><br><b style="color:${c}">${stTxt}</b> · ${p.m2} m²<br><span class="popbtn" onclick="fromMap(${p.id})">Ver detalle</span>`);
    m.addTo(MAPLAYER); bounds.push([lat,lng]);
  });

  if(bounds.length){ try{ MAP.fitBounds(bounds,{padding:[30,30],maxZoom:12}); }catch(error){console.warn('No se pudo ajustar el mapa:', error);} }
}

function detalleExcedentes(datos) {
  const grupos = {};

  (datos.extras || []).forEach(extra => {
    const sub = extra.sub || 'Sin cuadrilla';

    if (!grupos[sub]) {
      grupos[sub] = {
        m2: 0,
        importe: 0,
        cantidad: 0,
        sinEvidencia: 0
      };
    }

    const precio =
      Number(extra.precio_m2) ||
      precioExtraSub(sub);

    const m2 =
      Number(extra.m2_excedente) || 0;

    grupos[sub].m2 += m2;

    grupos[sub].importe +=
      m2 * precio;

    grupos[sub].cantidad += 1;

    if (!extra.evidencia_url) {
      grupos[sub].sinEvidencia += 1;
    }
  });

  return grupos;
}

function aplicarPeriodoEstimacion() {
  const inicio =
    document
      .getElementById(
        'estimFechaInicio'
      )
      .value;

  const fin =
    document
      .getElementById(
        'estimFechaFin'

    );

    );

  }

  ESTIMACION_PERIODO.inicio =
    inicio;

  ESTIMACION_PERIODO.fin =
    fin;

  /*
   * Al consultar otro periodo regresamos
   * a la vista principal.
   */
  VISTA_ESTIMACION =
    'estimables';

  calcularEstimacionPeriodo();
}

function calcularEstimacionPeriodo() {
  const inicio =
    ESTIMACION_PERIODO.inicio;

  const fin =
    ESTIMACION_PERIODO.fin;

  /*
   * Primero obtenemos únicamente trabajos
   * realmente ejecutados dentro del periodo.
   *
   * freal = fecha real de ejecución.
   */
  const ejecutadas =
    LECH.filter(p =>
      p.status === 'at' &&
      p.freal &&
      p.freal >= inicio &&
      p.freal <= fin
    );

  /*
   * Con Vo.Bo. aprobado:
   * sí forman parte de la estimación.
   */
  const estimables =
    ejecutadas.filter(
      p => p.vobo === 'ok'
    );

  /*
   * Ejecutadas que todavía están
   * esperando validación.
   */
  const pendientes =
    ejecutadas.filter(
      p =>
        p.vobo !== 'ok' &&
        p.vobo !== 'rej'
    );

  /*
   * Ejecutadas pero rechazadas.
   */
  const rechazadas =
    ejecutadas.filter(
      p => p.vobo === 'rej'
    );

  ESTIMACION_PERIODO.ejecutadas =
    ejecutadas;

  ESTIMACION_PERIODO.estimables =
    estimables;

  ESTIMACION_PERIODO.pendientes =
    pendientes;

  ESTIMACION_PERIODO.rechazadas =
    rechazadas;

  pintarEstimacionPeriodo();
}

function cambiarVistaEstimacion(
  vista
) {
  const permitidas = [
    'estimables',
    'pendientes',
    'rechazadas'
  ];

  if (
    !permitidas.includes(vista)
  ) {
    return;
  }

  VISTA_ESTIMACION =
    vista;

  pintarEstimacionPeriodo();
}

async function reporteSemanal() {
  const boton =
    document.querySelector(
      '[onclick="reporteSemanal()"]'
    );

  const contenidoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent =
      'Generando reporte…';
  }

  try {
    const puntos =
      Array.isArray(visiblePts())
        ? visiblePts()
        : [];

    if (!puntos.length) {
      toast(
        'No existen lecherías en el alcance actual'
      );

      return;
    }

    /*
     * =========================================================
     * FECHAS Y PERIODO SEMANAL
     * =========================================================
     */

    function fechaLocalDesdeValor(
      valor
    ) {
      if (!valor) {
        return null;
      }

      if (valor instanceof Date) {
        return Number.isNaN(
          valor.getTime()
        )
          ? null
          : new Date(valor);
      }

      const texto =
        String(valor).trim();

      const coincidencia =
        texto.match(
          /^(\d{4})-(\d{2})-(\d{2})/
        );

      if (coincidencia) {
        const fecha =
          new Date(
            Number(coincidencia[1]),
            Number(coincidencia[2]) - 1,
            Number(coincidencia[3])
          );

        return Number.isNaN(
          fecha.getTime()
        )
          ? null
          : fecha;
      }

      const fecha =
        new Date(valor);

      return Number.isNaN(
        fecha.getTime()
      )
        ? null
        : fecha;
    }

    function inicioDelDia(
      fecha
    ) {
      const resultado =
        new Date(fecha);

      resultado.setHours(
        0,
        0,
        0,
        0
      );

      return resultado;
    }

    function finDelDia(
      fecha
    ) {
      const resultado =
        new Date(fecha);

      resultado.setHours(
        23,
        59,
        59,
        999
      );

      return resultado;
    }

    function sumarDias(
      fecha,
      dias
    ) {
      const resultado =
        new Date(fecha);

      resultado.setDate(
        resultado.getDate() +
        dias
      );

      return resultado;
    }

    function perteneceAlPeriodo(
      valor,
      inicio,
      fin
    ) {
      const fecha =
        fechaLocalDesdeValor(
          valor
        );

      if (!fecha) {
        return false;
      }

      return (
        fecha >= inicio &&
        fecha <= fin
      );
    }

    function esAnterior(
      valor,
      limite
    ) {
      const fecha =
        fechaLocalDesdeValor(
          valor
        );

      if (!fecha) {
        return false;
      }

      return (
        inicioDelDia(fecha) <
        inicioDelDia(limite)
      );
    }

    function formatoFecha(
      valor
    ) {
      const fecha =
        fechaLocalDesdeValor(
          valor
        );

      if (!fecha) {
        return '—';
      }

      return fecha.toLocaleDateString(
        'es-MX',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }

    function formatoFechaLarga(
      fecha
    ) {
      return fecha.toLocaleDateString(
        'es-MX',
        {
          weekday: 'long',
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        }
      );
    }

    function fechaArchivo(
      fecha
    ) {
      const anio =
        fecha.getFullYear();

      const mes =
        String(
          fecha.getMonth() + 1
        ).padStart(2, '0');

      const dia =
        String(
          fecha.getDate()
        ).padStart(2, '0');

      return `${anio}-${mes}-${dia}`;
    }

    function obtenerNumeroSemana(
      fecha
    ) {
      const copia =
        new Date(
          Date.UTC(
            fecha.getFullYear(),
            fecha.getMonth(),
            fecha.getDate()
          )
        );

      const diaSemana =
        copia.getUTCDay() || 7;

      copia.setUTCDate(
        copia.getUTCDate() +
        4 -
        diaSemana
      );

      const inicioAnio =
        new Date(
          Date.UTC(
            copia.getUTCFullYear(),
            0,
            1
          )
        );

      return Math.ceil(
        (
          (
            copia -
            inicioAnio
          ) /
          86400000 +
          1
        ) / 7
      );
    }

    const hoy =
      new Date();

    const hoyInicio =
      inicioDelDia(hoy);

    const diaSemana =
      hoyInicio.getDay();

    /*
     * En JavaScript:
     * domingo = 0
     * lunes = 1
     *
     * Calculamos cuántos días retroceder
     * para llegar al lunes.
     */
    const desplazamientoLunes =
      diaSemana === 0
        ? -6
        : 1 - diaSemana;

    const inicioSemana =
      inicioDelDia(
        sumarDias(
          hoyInicio,
          desplazamientoLunes
        )
      );

    const finSemana =
      finDelDia(
        sumarDias(
          inicioSemana,
          6
        )
      );

    const numeroSemana =
      obtenerNumeroSemana(
        inicioSemana
      );

    const periodoTexto =
      `${formatoFecha(inicioSemana)} al ${formatoFecha(finSemana)}`;

    const alcance =
      ROLE === 'sub'
        ? CURSUB
        : 'Nacional';

    /*
     * =========================================================
     * FUNCIONES DE ESTADO
     * =========================================================
     */

    function textoVobo(
      valor
    ) {
      const estados = {
        ok: 'Aprobado',
        wait: 'En revisión',
        rej: 'Rechazado',
        '-': 'No solicitado'
      };

      return estados[valor] ||
        'No solicitado';
    }

    function superficiePunto(
      punto
    ) {
      const superficie =
        Number(
          m2Real(punto)
        );

      return Number.isFinite(
        superficie
      )
        ? superficie
        : Number(M2_STD);
    }

    function excedentePunto(
      punto
    ) {
      return Math.max(
        superficiePunto(punto) -
        Number(M2_STD),
        0
      );
    }

    function tieneEvidenciaCompleta(
      punto
    ) {
      /*
       * Se utiliza la validación ya existente
       * en la aplicación cuando está disponible.
       */
      if (
        typeof fotosOk ===
        'function'
      ) {
        try {
          return Boolean(
            fotosOk(punto)
          );

        } catch (error) {
          console.warn(
            'No fue posible validar fotosOk:',
            error
          );
        }
      }

      const previas =
        Array.isArray(
          punto.fotosPrev
        )
          ? punto.fotosPrev
          : [];

      const finales =
        Array.isArray(
          punto.fotosFin
        )
          ? punto.fotosFin
          : [];

      return (
        previas.length > 0 &&
        finales.length > 0
      );
    }

    function ubicacionPunto(
      punto
    ) {
      return [
        punto.estado,
        punto.municipio
      ]
        .filter(Boolean)
        .join(' / ') ||
        'Sin ubicación';
    }

    /*
     * =========================================================
     * CÁLCULOS SEMANALES
     * =========================================================
     */

    const programadosSemana =
      puntos
        .filter(punto =>
          perteneceAlPeriodo(
            punto.fcomp,
            inicioSemana,
            finSemana
          )
        )
        .sort((a, b) =>
          String(a.fcomp || '')
            .localeCompare(
              String(b.fcomp || '')
            )
        );

    const terminadosSemana =
      puntos
        .filter(punto =>
          punto.status === 'at' &&
          perteneceAlPeriodo(
            punto.freal,
            inicioSemana,
            finSemana
          )
        )
        .sort((a, b) =>
          String(a.freal || '')
            .localeCompare(
              String(b.freal || '')
            )
        );

    /*
     * Programado cumplido:
     *
     * Tiene fecha compromiso en la semana y
     * ya está marcado como atendido.
     *
     * Adicionalmente, su fecha real no debe
     * ser posterior al domingo de la semana.
     */
    const programadosCumplidos =
      programadosSemana.filter(
        punto => {
          if (
            punto.status !== 'at'
          ) {
            return false;
          }

          const fechaReal =
            fechaLocalDesdeValor(
              punto.freal
            );

          if (!fechaReal) {
            return true;
          }

          return fechaReal <= finSemana;
        }
      );

    const programadosPendientes =
      programadosSemana.filter(
        punto =>
          !programadosCumplidos
            .some(
              cumplido =>
                cumplido.id ===
                punto.id
            )
      );

    /*
     * Terminados no programados:
     * se concluyeron durante la semana,
     * pero su fecha compromiso no pertenece
     * a esa misma semana.
     */
    const terminadosNoProgramados =
      terminadosSemana.filter(
        punto =>
          !perteneceAlPeriodo(
            punto.fcomp,
            inicioSemana,
            finSemana
          )
      );

    const cumplimientoSemanal =
      programadosSemana.length
        ? (
            programadosCumplidos.length /
            programadosSemana.length *
            100
          )
        : (
            terminadosSemana.length
              ? 100
              : 0
          );

    /*
     * Avance acumulado general.
     */
    const atendidosAcumulados =
      puntos.filter(
        punto =>
          punto.status === 'at'
      );

    const pendientesAcumulados =
      puntos.filter(
        punto =>
          punto.status !== 'at'
      );

    const avanceAcumulado =
      puntos.length
        ? (
            atendidosAcumulados.length /
            puntos.length *
            100
          )
        : 0;

    /*
     * Estados de los terminados esta semana.
     */
    const conVoboSemana =
      terminadosSemana.filter(
        punto =>
          punto.vobo === 'ok'
      );

    const enRevisionSemana =
      terminadosSemana.filter(
        punto =>
          punto.vobo === 'wait'
      );

    const rechazadosSemana =
      terminadosSemana.filter(
        punto =>
          punto.vobo === 'rej'
      );

    const sinSolicitudVoboSemana =
      terminadosSemana.filter(
        punto =>
          !punto.vobo ||
          punto.vobo === '-'
      );

    const evidenciaIncompletaSemana =
      terminadosSemana.filter(
        punto =>
          !tieneEvidenciaCompleta(
            punto
          )
      );

    const conExcedenteSemana =
      terminadosSemana.filter(
        punto =>
          excedentePunto(punto) > 0
      );

    const m2Semana =
      terminadosSemana.reduce(
        (total, punto) =>
          total +
          superficiePunto(punto),
        0
      );

    const m2ExcedentesSemana =
      terminadosSemana.reduce(
        (total, punto) =>
          total +
          excedentePunto(punto),
        0
      );

    /*
     * =========================================================
     * ALERTAS ACUMULADAS
     * =========================================================
     */

    const vencidos =
      puntos
        .filter(punto =>
          punto.status !== 'at' &&
          punto.fcomp &&
          esAnterior(
            punto.fcomp,
            hoyInicio
          )
        )
        .sort((a, b) =>
          String(a.fcomp || '')
            .localeCompare(
              String(b.fcomp || '')
            )
        );

    const rechazadosActuales =
      puntos.filter(
        punto =>
          punto.vobo === 'rej'
      );

    const atendidosSinVobo =
      puntos.filter(
        punto =>
          punto.status === 'at' &&
          (
            !punto.vobo ||
            punto.vobo === '-' ||
            punto.vobo === 'wait'
          )
      );

    const atendidosSinEvidencia =
      puntos.filter(
        punto =>
          punto.status === 'at' &&
          !tieneEvidenciaCompleta(
            punto
          )
      );

    const excedentesActuales =
      puntos.filter(
        punto =>
          punto.status === 'at' &&
          excedentePunto(punto) > 0
      );

    /*
     * =========================================================
     * PRODUCTIVIDAD POR GRUPO
     * =========================================================
     */

    const grupos = {};

    puntos.forEach(
      punto => {
        const clave =
          ROLE === 'sub'
            ? (
                punto.estado ||
                'Sin entidad'
              )
            : (
                punto.sub ||
                'Sin cuadrilla'
              );

        if (!grupos[clave]) {
          grupos[clave] = [];
        }

        grupos[clave].push(
          punto
        );
      }
    );

    const productividad =
      Object.entries(grupos)
        .map(
          ([nombre, registros]) => {
            const programados =
              registros.filter(
                punto =>
                  perteneceAlPeriodo(
                    punto.fcomp,
                    inicioSemana,
                    finSemana
                  )
              );

            const terminados =
              registros.filter(
                punto =>
                  punto.status === 'at' &&
                  perteneceAlPeriodo(
                    punto.freal,
                    inicioSemana,
                    finSemana
                  )
              );

            const cumplidos =
              programados.filter(
                punto => {
                  if (
                    punto.status !== 'at'
                  ) {
                    return false;
                  }

                  const fechaReal =
                    fechaLocalDesdeValor(
                      punto.freal
                    );

                  return (
                    !fechaReal ||
                    fechaReal <=
                    finSemana
                  );
                }
              );

            const pendientes =
              Math.max(
                programados.length -
                cumplidos.length,
                0
              );

            const porcentaje =
              programados.length
                ? (
                    cumplidos.length /
                    programados.length *
                    100
                  )
                : (
                    terminados.length
                      ? 100
                      : 0
                  );

            return {
              nombre,
              alcance:
                registros.length,
              programados:
                programados.length,
              terminados:
                terminados.length,
              cumplidos:
                cumplidos.length,
              pendientes,
              porcentaje
            };
          }
        )
        .sort(
          (a, b) => {
            if (
              b.porcentaje !==
              a.porcentaje
            ) {
              return (
                b.porcentaje -
                a.porcentaje
              );
            }

            if (
              b.terminados !==
              a.terminados
            ) {
              return (
                b.terminados -
                a.terminados
              );
            }

            return a.nombre
              .localeCompare(
                b.nombre
              );
          }
        );

    /*
     * =========================================================
     * CONCLUSIONES AUTOMÁTICAS
     * =========================================================
     */

    const conclusiones = [];

    if (
      programadosSemana.length === 0
    ) {
      conclusiones.push(
        terminadosSemana.length
          ? `No había P.V. con fecha compromiso dentro de la semana; sin embargo, se concluyeron ${terminadosSemana.length} trabajos.`
          : 'No existen P.V. con fecha compromiso ni terminaciones registradas dentro de la semana.'
      );

    } else if (
      cumplimientoSemanal >= 90
    ) {
      conclusiones.push(
        `El cumplimiento semanal es satisfactorio: ${cumplimientoSemanal.toFixed(1)}% de los P.V. programados fueron atendidos.`
      );

    } else if (
      cumplimientoSemanal >= 70
    ) {
      conclusiones.push(
        `El cumplimiento semanal es moderado: ${cumplimientoSemanal.toFixed(1)}%. Se recomienda dar seguimiento a ${programadosPendientes.length} P.V. pendientes.`
      );

    } else {
      conclusiones.push(
        `El cumplimiento semanal es bajo: ${cumplimientoSemanal.toFixed(1)}%. Se requiere revisar la programación y atender ${programadosPendientes.length} P.V. pendientes.`
      );
    }

    if (vencidos.length) {
      conclusiones.push(
        `Existen ${vencidos.length} P.V. no atendidos cuya fecha compromiso ya venció.`
      );
    }

    if (rechazadosActuales.length) {
      conclusiones.push(
        `${rechazadosActuales.length} P.V. mantienen un Vo.Bo. rechazado y requieren corrección o aclaración.`
      );
    }

    if (evidenciaIncompletaSemana.length) {
      conclusiones.push(
        `${evidenciaIncompletaSemana.length} trabajos terminados esta semana tienen evidencia fotográfica incompleta.`
      );
    }

    if (
      enRevisionSemana.length ||
      sinSolicitudVoboSemana.length
    ) {
      conclusiones.push(
        `${enRevisionSemana.length + sinSolicitudVoboSemana.length} trabajos terminados esta semana todavía no cuentan con Vo.Bo. aprobado.`
      );
    }

    if (m2ExcedentesSemana > 0) {
      conclusiones.push(
        `Durante la semana se registraron ${m2ExcedentesSemana.toFixed(2)} m² excedentes en ${conExcedenteSemana.length} P.V.`
      );
    }

    if (
      conclusiones.length === 1 &&
      cumplimientoSemanal >= 90 &&
      !vencidos.length &&
      !rechazadosActuales.length &&
      !evidenciaIncompletaSemana.length
    ) {
      conclusiones.push(
        'No se detectaron alertas operativas relevantes al momento de generar el reporte.'
      );
    }

    /*
     * =========================================================
     * CONFIGURACIÓN DEL PDF
     * =========================================================
     */

    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const anchoPagina = 210;
    const margenX = 12;
    const anchoUtil = 186;
    const limiteInferior = 282;

    let y = 0;

    function encabezadoPagina() {
      doc.setFillColor(
        13,
        27,
        42
      );

      doc.rect(
        0,
        0,
        anchoPagina,
        30,
        'F'
      );

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(14);

      doc.text(
        'Reporte semanal de supervisión',
        margenX,
        12
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(8.5);

      doc.text(
        `Semana ${numeroSemana} · ${alcance}`,
        margenX,
        19
      );

      doc.text(
        `Procedimiento ${PROCEDIMIENTO}`,
        margenX,
        25
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      y = 40;
    }

    function nuevaPagina() {
      doc.addPage();

      encabezadoPagina();
    }

    function asegurarEspacio(
      altoNecesario
    ) {
      if (
        y + altoNecesario >
        limiteInferior
      ) {
        nuevaPagina();
      }
    }

    function tituloSeccion(
      texto
    ) {
      asegurarEspacio(14);

      doc.setDrawColor(
        31,
        111,
        235
      );

      doc.setLineWidth(.7);

      doc.line(
        margenX,
        y,
        margenX + 14,
        y
      );

      doc.setTextColor(
        58,
        79,
        102
      );

      doc.setFont(
        undefined,
        'bold'
      );
