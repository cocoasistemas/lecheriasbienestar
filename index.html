            align: 'right'
          }
        }
      ]);

      vencidos.forEach(
        (
          punto,
          indice
        ) => {
          asegurarEspacio(9);

          filaAlternada(
            indice,
            9
          );

          const fechaCompromiso =
            fechaLocalDesdeValor(
              punto.fcomp
            );

          const diasVencidos =
            fechaCompromiso
              ? Math.max(
                  Math.floor(
                    (
                      hoyInicio -
                      inicioDelDia(
                        fechaCompromiso
                      )
                    ) /
                    86400000
                  ),
                  0
                )
              : 0;

          doc.setTextColor(
            20,
            20,
            20
          );

          doc.setFont(
            undefined,
            'normal'
          );

          doc.setFontSize(6.8);

          doc.text(
            String(
              punto.pv || ''
            ),
            15,
            y + 5.8
          );

          doc.text(
            ubicacionPunto(
              punto
            ).slice(0, 43),
            47,
            y + 5.8
          );

          doc.text(
            String(
              punto.sub || '—'
            ),
            126,
            y + 5.8
          );

          doc.text(
            formatoFecha(
              punto.fcomp
            ),
            155,
            y + 5.8
          );

          doc.text(
            String(
              diasVencidos
            ),
            195,
            y + 5.8,
            {
              align: 'right'
            }
          );

          y += 9;
        }
      );
    }

    y += 6;

    /*
     * =========================================================
     * CONCLUSIONES
     * =========================================================
     */

    tituloSeccion(
      'Conclusiones automáticas'
    );

    doc.setFont(
      undefined,
      'normal'
    );

    doc.setFontSize(8.4);

    conclusiones.forEach(
      (
        conclusion,
        indice
      ) => {
        const lineas =
          doc.splitTextToSize(
            `${indice + 1}. ${conclusion}`,
            178
          );

        asegurarEspacio(
          lineas.length *
          4.5 +
          4
        );

        doc.text(
          lineas,
          16,
          y
        );

        y +=
          lineas.length *
          4.5 +
          3;
      }
    );

    /*
     * =========================================================
     * NOTA METODOLÓGICA
     * =========================================================
     */

    y += 4;

    asegurarEspacio(25);

    doc.setFillColor(
      238,
      241,
      244
    );

    const nota =
      'Criterio del reporte: los P.V. programados se determinan por la fecha compromiso; ' +
      'los terminados, por la fecha real de atención. El cumplimiento compara los P.V. ' +
      'programados para la semana contra los que ya fueron atendidos al cierre del periodo.';

    const lineasNota =
      doc.splitTextToSize(
        nota,
        176
      );

    const altoNota =
      Math.max(
        17,
        lineasNota.length *
        4 +
        9
      );

    doc.roundedRect(
      margenX,
      y,
      anchoUtil,
      altoNota,
      2,
      2,
      'F'
    );

    doc.setTextColor(
      107,
      123,
      140
    );

    doc.setFont(
      undefined,
      'normal'
    );

    doc.setFontSize(7);

    doc.text(
      'NOTA METODOLÓGICA',
      16,
      y + 6
    );

    doc.text(
      lineasNota,
      16,
      y + 11
    );

    /*
     * =========================================================
     * PIE DE PÁGINA
     * =========================================================
     */

    const totalPaginas =
      doc.getNumberOfPages();

    for (
      let pagina = 1;
      pagina <= totalPaginas;
      pagina++
    ) {
      doc.setPage(
        pagina
      );

      doc.setTextColor(
        107,
        123,
        140
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(7.2);

      doc.text(
        `Reporte semanal · Semana ${numeroSemana} · ${alcance} · Página ${pagina} de ${totalPaginas}`,
        105,
        292,
        {
          align: 'center'
        }
      );
    }

    /*
     * =========================================================
     * DESCARGA
     * =========================================================
     */

    const alcanceSeguro =
      String(alcance)
        .replace(
          /[^0-9A-Za-z_-]/g,
          '_'
        );

    doc.save(
      `Reporte_semanal_${fechaArchivo(inicioSemana)}_${alcanceSeguro}.pdf`
    );

    toast(
      'Reporte semanal generado'
    );

  } catch (error) {
    console.error(
      'No fue posible generar el reporte semanal:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte semanal'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =
        contenidoOriginal;
    }
  }
}

async function reporteMensual() {
  const boton =
    document.querySelector(
      '[onclick="reporteMensual()"]'
    );

  const contenidoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent =
      'Generando reporte…';
  }

  try {
    const puntos =
      Array.isArray(visiblePts())
        ? visiblePts()
        : [];

    if (!puntos.length) {
      toast(
        'No existen lecherías en el alcance actual'
      );

      return;
    }

    const fechaActual =
      new Date();

    const anio =
      fechaActual.getFullYear();

    const mes =
      fechaActual.getMonth();

    const inicioMes =
      new Date(
        anio,
        mes,
        1
      );

    const finMes =
      new Date(
        anio,
        mes + 1,
        0
      );

    /*
     * Incluye todo el mes calendario.
     * Al comparar se usan fechas locales para evitar
     * desplazamientos por zona horaria.
     */
    function fechaLocalDesdeISO(
      valor
    ) {
      if (!valor) {
        return null;
      }

      const texto =
        String(valor);

      const soloFecha =
        texto.slice(0, 10);

      const partes =
        soloFecha.split('-');

      if (partes.length !== 3) {
        const fecha =
          new Date(valor);

        return Number.isNaN(
          fecha.getTime()
        )
          ? null
          : fecha;
      }

      const fecha =
        new Date(
          Number(partes[0]),
          Number(partes[1]) - 1,
          Number(partes[2])
        );

      return Number.isNaN(
        fecha.getTime()
      )
        ? null
        : fecha;
    }

    function estaEnMesActual(
      valor
    ) {
      const fecha =
        fechaLocalDesdeISO(valor);

      if (!fecha) {
        return false;
      }

      return (
        fecha.getFullYear() === anio &&
        fecha.getMonth() === mes
      );
    }

    function fechaCorta(
      valor
    ) {
      const fecha =
        fechaLocalDesdeISO(valor);

      if (!fecha) {
        return '—';
      }

      return fecha.toLocaleDateString(
        'es-MX',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );
    }

    function textoVoboMensual(
      valor
    ) {
      const textos = {
        ok: 'Aprobado',
        wait: 'En revisión',
        rej: 'Rechazado',
        '-': 'No solicitado'
      };

      return textos[valor] ||
        'No solicitado';
    }

    function textoEstadoDocumento(
      valor
    ) {
      const textos = {
        aprobada: 'Aprobada',
        en_revision: 'En revisión',
        rechazada: 'Rechazada',
        por_armar: 'Por armar'
      };

      return textos[valor] ||
        valor ||
        'Sin estado';
    }

    const alcance =
      ROLE === 'sub'
        ? CURSUB
        : 'Nacional';

    const nombreMes =
      inicioMes.toLocaleDateString(
        'es-MX',
        {
          month: 'long',
          year: 'numeric'
        }
      );

    const periodoTexto =
      `${fechaCorta(
        inicioMes.toISOString()
      )} al ${fechaCorta(
        finMes.toISOString()
      )}`;

    /*
     * Movimiento operativo del mes:
     * una lechería cuenta cuando su fecha real está
     * dentro del mes calendario seleccionado.
     */
    const atendidasMes =
      puntos
        .filter(punto =>
          punto.status === 'at' &&
          estaEnMesActual(
            punto.freal
          )
        )
        .sort((a, b) =>
          String(a.freal).localeCompare(
            String(b.freal)
          )
        );

    const atendidasAcumuladas =
      puntos.filter(punto =>
        punto.status === 'at'
      );

    const voboAcumulado =
      puntos.filter(punto =>
        punto.vobo === 'ok'
      );

    const revisionAcumulada =
      puntos.filter(punto =>
        punto.status === 'at' &&
        punto.vobo === 'wait'
      );

    const rechazadasAcumuladas =
      puntos.filter(punto =>
        punto.vobo === 'rej'
      );

    const pendientesAcumuladas =
      puntos.filter(punto =>
        punto.status !== 'at'
      );

    const conExcedenteMes =
      atendidasMes.filter(punto =>
        Number(
          punto.m2 || M2_STD
        ) > M2_STD
      );

    const m2EjecutadosMes =
      atendidasMes.reduce(
        (total, punto) =>
          total +
          Number(
            punto.m2 || M2_STD
          ),
        0
      );

    const m2ExcedentesMes =
      atendidasMes.reduce(
        (total, punto) =>
          total +
          Math.max(
            Number(
              punto.m2 || M2_STD
            ) -
            M2_STD,
            0
          ),
        0
      );

    /*
     * Documentos creados durante el mes.
     * Se usa el campo real actas.creado.
     */
    let documentosMes = [];

    try {
      const actas =
        await cargarActas();

      documentosMes =
        (actas || [])
          .filter(documento =>
            estaEnMesActual(
              documento.creado
            )
          )
          .filter(documento => {
            if (ROLE !== 'sub') {
              return true;
            }

            return (
              documento.sub === CURSUB ||
              documento.tipo ===
              'dependencia'
            );
          });

    } catch (error) {
      console.warn(
        'No fue posible cargar los documentos del mes:',
        error
      );
    }

    const actasSubMes =
      documentosMes.filter(documento =>
        documento.tipo ===
        'contratista'
      );

    const cartasDepMes =
      documentosMes.filter(documento =>
        documento.tipo ===
        'dependencia'
      );

    /*
     * Agrupación:
     * SUB se desglosa por estado.
     * Los demás roles, por subcontratista.
     */
    const grupos = {};

    puntos.forEach(punto => {
      const clave =
        ROLE === 'sub'
          ? (
              punto.estado ||
              'Sin entidad'
            )
          : (
              punto.sub ||
              'Sin cuadrilla'
            );

      if (!grupos[clave]) {
        grupos[clave] = [];
      }

      grupos[clave].push(
        punto
      );
    });

    const filasGrupo =
      Object.entries(grupos)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([nombre, registros]) => {
          const movimiento =
            registros.filter(punto =>
              punto.status === 'at' &&
              estaEnMesActual(
                punto.freal
              )
            );

          return {
            nombre,
            total:
              registros.length,
            mes:
              movimiento.length,
            acumuladas:
              registros.filter(punto =>
                punto.status === 'at'
              ).length,
            vobo:
              registros.filter(punto =>
                punto.vobo === 'ok'
              ).length,
            pendientes:
              registros.filter(punto =>
                punto.status !== 'at'
              ).length
          };
        });

    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const anchoPagina = 210;
    const margenX = 12;
    const limiteInferior = 282;

    let y = 0;

    function encabezado() {
      doc.setFillColor(
        13,
        27,
        42
      );

      doc.rect(
        0,
        0,
        anchoPagina,
        30,
        'F'
      );

      doc.setTextColor(
        255,
        255,
        255
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(14);

      doc.text(
        'Reporte mensual de avance',
        margenX,
        12
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(8.5);

      doc.text(
        `Pintura de fachadas · ${alcance}`,
        margenX,
        19
      );

      doc.text(
        `Procedimiento ${PROCEDIMIENTO}`,
        margenX,
        25
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      y = 40;
    }

    function nuevaPagina() {
      doc.addPage();

      encabezado();
    }

    function asegurarEspacio(
      alto
    ) {
      if (
        y + alto >
        limiteInferior
      ) {
        nuevaPagina();
      }
    }

    function tituloSeccion(
      texto
    ) {
      asegurarEspacio(14);

      doc.setDrawColor(
        31,
        111,
        235
      );

      doc.setLineWidth(.7);

      doc.line(
        margenX,
        y,
        margenX + 14,
        y
      );

      doc.setTextColor(
        58,
        79,
        102
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(10);

      doc.text(
        texto.toUpperCase(),
        margenX + 18,
        y + 1
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      y += 10;
    }

    function escribirDato(
      etiqueta,
      valor
    ) {
      asegurarEspacio(7);

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(8.5);

      doc.text(
        `${etiqueta}:`,
        14,
        y
      );

      doc.setFont(
        undefined,
        'normal'
      );

      const lineas =
        doc.splitTextToSize(
          String(valor),
          125
        );

      doc.text(
        lineas,
        69,
        y
      );

      y += Math.max(
        6,
        lineas.length * 4.4
      );
    }

    function tarjetaResumen(
      x,
      yTarjeta,
      ancho,
      titulo,
      valor,
      subtitulo = ''
    ) {
      doc.setFillColor(
        238,
        243,
        247
      );

      doc.roundedRect(
        x,
        yTarjeta,
        ancho,
        22,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        107,
        123,
        140
      );

      doc.setFont(
        undefined,
        'normal'
      );

      doc.setFontSize(7.2);

      doc.text(
        titulo,
        x + 4,
        yTarjeta + 6
      );

      doc.setTextColor(
        20,
        20,
        20
      );

      doc.setFont(
        undefined,
        'bold'
      );

      doc.setFontSize(13);

      doc.text(
        String(valor),
        x + 4,
        yTarjeta + 14
      );

      if (subtitulo) {
        doc.setTextColor(
          107,
          123,
          140
        );

        doc.setFont(
          undefined,
          'normal'
        );

        doc.setFontSize(6.5);

        doc.text(
          subtitulo,
          x + 4,
          yTarjeta + 19
        );
      }
    }

    encabezado();

    /*
     * Identificación del reporte.
     */
    tituloSeccion(
      'Periodo del informe'
    );

    escribirDato(
      'Mes reportado',
      nombreMes
    );

    escribirDato(
      'Periodo',
      periodoTexto
    );

    escribirDato(
      'Alcance',
      alcance
    );

    escribirDato(
      'Fecha de generación',
      new Date().toLocaleString(
        'es-MX'
      )
    );

    y += 4;

    /*
     * Movimiento mensual.
     */
    tituloSeccion(
      'Movimiento del mes'
    );

    tarjetaResumen(
      12,
      y,
      57,
      'LECHERÍAS TERMINADAS',
      atendidasMes.length,
      'Fecha real dentro del mes'
    );

    tarjetaResumen(
      76,
      y,
      57,
      'M² EJECUTADOS',
      m2EjecutadosMes.toFixed(2),
      'Superficie registrada'
    );

    tarjetaResumen(
      140,
      y,
      58,
      'M² EXCEDENTES',
      m2ExcedentesMes.toFixed(2),
      `${conExcedenteMes.length} lecherías`
    );

    y += 30;

    /*
     * Estado acumulado.
     */
    tituloSeccion(
      'Estado acumulado al cierre'
    );

    const avance =
      puntos.length
        ? (
            atendidasAcumuladas.length /
            puntos.length *
            100
          ).toFixed(1)
        : '0.0';

    const acumulado = [
      [
        'Total en alcance',
        puntos.length
      ],
      [
        'Atendidas',
        atendidasAcumuladas.length
      ],
      [
        'Con Vo.Bo.',
        voboAcumulado.length
      ],
      [
        'En revisión',
        revisionAcumulada.length
      ],
      [
        'Rechazadas',
        rechazadasAcumuladas.length
      ],
      [
        'Pendientes',
        pendientesAcumuladas.length
      ],
      [
        'Avance acumulado',
        `${avance}%`
      ]
    ];

    doc.setFillColor(
      244,
      246,
      248
    );

    doc.roundedRect(
      12,
      y,
      186,
      41,
      2,
      2,
      'F'
    );

    acumulado.forEach(
      (
        [etiqueta, valor],
        indice
      ) => {
        const columna =
          indice % 2;

        const fila =
          Math.floor(
            indice / 2
          );

        const xEtiqueta =
          columna === 0
            ? 17
            : 109;

        const xValor =
          columna === 0
            ? 98
            : 193;

        const yFila =
          y +
          8 +
          fila * 9;

        doc.setFont(
          undefined,
          'normal'
        );

        doc.setFontSize(8);

        doc.setTextColor(
          58,
          79,
          102
        );

        doc.text(
          etiqueta,
          xEtiqueta,
          yFila
        );

        doc.setFont(
          undefined,
          'bold'
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        doc.text(
          String(valor),
          xValor,
          yFila,
          {
            align: 'right'
          }
        );
      }
    );

    y += 49;

    /*
     * Tabla por subcontratista o entidad.
     */
    tituloSeccion(
      ROLE === 'sub'
        ? 'Desglose por entidad'
        : 'Desglose por cuadrilla'
    );

    asegurarEspacio(15);

    doc.setFillColor(
      22,
      38,
      58
    );

    doc.rect(
      12,
      y,
      186,
      9,
      'F'
    );

    doc.setTextColor(
      255,
      255,
      255
    );

    doc.setFont(
      undefined,
      'bold'
    );

    doc.setFontSize(7.2);

    doc.text(
      ROLE === 'sub'
        ? 'Entidad'
        : 'Cuadrilla',

async function exportReporteInterno() {
  if (
    ROLE !== 'gen' &&
    ROLE !== 'admin'
  ) {
    toast(
      'Este reporte está reservado para control interno'
    );

    return;
  }

  const boton =
    document.querySelector(
      '[onclick="exportReporteInterno()"]'
    );

  const textoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent =
      'Generando reporte…';
  }

  try {
    /*
     * Actualizamos las fuentes para que el reporte
     * no dependa de información anterior en memoria.
     */
    const [
      actas,
      estimacion
    ] = await Promise.all([
      cargarActas(),
      obtenerEstimacion()
    ]);

    const puntos =
      Array.isArray(LECH)
        ? LECH
        : [];

    /*
     * Obtenemos las relaciones reales de cada acta
     * y carta mediante la RPC central.
     */
    const detalles =
      await Promise.all(
        (actas || []).map(async acta => {
          try {
            return await obtenerDetalleActa(
              acta.id
            );
          } catch (error) {
            console.warn(
              `No se pudo cargar ${acta.numero}:`,
              error
            );

            return {
              acta,
              lecherias: []
            };
          }
        })
      );

    /*
     * Índices por P.V.
     */
    const actasSubPorPv = {};
    const cartasDepPorPv = {};

    detalles.forEach(detalle => {
      const acta =
        detalle.acta || {};

      const lecherias =
        Array.isArray(detalle.lecherias)
          ? detalle.lecherias
          : [];

      const destino =
        acta.tipo === 'dependencia'
          ? cartasDepPorPv
          : actasSubPorPv;

      lecherias.forEach(punto => {
        if (!destino[punto.pv]) {
          destino[punto.pv] = [];
        }

        destino[punto.pv].push({
          id: acta.id,
          numero:
            acta.numero || '',
          estado:
            acta.estado || '',
          monto:
            Number(acta.monto || 0),
          fini:
            acta.fini || '',
          ffin:
            acta.ffin || ''
        });
      });
    });

    function documentosPv(
      indice,
      pv
    ) {
      return Array.isArray(indice[pv])
        ? indice[pv]
        : [];
    }

    function foliosDocumentos(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .map(documento =>
          documento.numero
        )
        .filter(Boolean)
        .join(', ');
    }

    function estadosDocumentos(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .map(documento =>
          etiquetaEstadoCarta(
            documento.estado
          )
        )
        .filter(Boolean)
        .join(', ');
    }

    function tieneDocumentoAprobado(
      indice,
      pv
    ) {
      return documentosPv(indice, pv)
        .some(documento =>
          documento.estado ===
          'aprobada'
        );
    }

    /*
     * Datos de excedentes.
     */
    const extras =
      Array.isArray(
        estimacion.extras
      )
        ? estimacion.extras
        : [];

    const extraPorPv = {};

    extras.forEach(extra => {
      extraPorPv[extra.pv] = extra;
    });

    /*
     * HOJA 1: RESUMEN GENERAL
     */
    const resumenEstimacion =
      estimacion.resumen || {};

    const resumenGeneral = [
      {
        Concepto:
          'Procedimiento',
        Valor:
          PROCEDIMIENTO
      },
      {
        Concepto:
          'Empresa',
        Valor:
          EMPRESA
      },
      {
        Concepto:
          'RFC',
        Valor:
          EMPRESA_RFC
      },
      {
        Concepto:
          'Dependencia',
        Valor:
          DEPENDENCIA
      },
      {
        Concepto:
          'Rango mínimo del contrato',
        Valor:
          MIN
      },
      {
        Concepto:
          'Rango máximo del contrato',
        Valor:
          MAX
      },
      {
        Concepto:
          'Lecherías definidas',
        Valor:
          LECH.length
      },
      {
        Concepto:
          'Lecherías cargadas',
        Valor:
          puntos.length
      },
      {
        Concepto:
          'Lecherías atendidas',
        Valor:
          puntos.filter(p =>
            p.status === 'at'
          ).length
      },
      {
        Concepto:
          'Lecherías con Vo.Bo.',
        Valor:
          puntos.filter(p =>
            p.vobo === 'ok'
          ).length
      },
      {
        Concepto:
          'Lecherías rechazadas',
        Valor:
          puntos.filter(p =>
            p.vobo === 'rej'
          ).length
      },
      {
        Concepto:
          'Lecherías en cartas DEP aprobadas',
        Valor:
          Number(
            resumenEstimacion.cobrables || 0
          )
      },
      {
        Concepto:
          'Cartas DEP aprobadas',
        Valor:
          Number(
            resumenEstimacion
              .cartas_aprobadas || 0
          )
      },
      {
        Concepto:
          'Subtotal aprobado',
        Valor:
          Number(
            resumenEstimacion.subtotal || 0
          )
      },
      {
        Concepto:
          'IVA',
        Valor:
          Number(
            resumenEstimacion.iva || 0
          )
      },
      {
        Concepto:
          'Total aprobado',
        Valor:
          Number(
            resumenEstimacion.total || 0
          )
      }
    ];

    /*
     * HOJA 2: POR SUBCONTRATISTA
     */
    const gruposSub = {};

    puntos.forEach(punto => {
      const sub =
        punto.sub ||
        'Sin cuadrilla';

      if (!gruposSub[sub]) {
        gruposSub[sub] = [];
      }

      gruposSub[sub].push(punto);
    });

    const porCuadrilla =
      Object.entries(gruposSub)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([sub, registros]) => {
          const extrasSub =
            registros
              .map(punto =>
                extraPorPv[punto.pv]
              )
              .filter(Boolean);

          return {
            Cuadrilla:
              sub,

            Zona:
              registros[0]?.zona || '',

            Total:
              registros.length,

            Atendidas:
              registros.filter(p =>
                p.status === 'at'
              ).length,

            'Con Vo.Bo.':
              registros.filter(p =>
                p.vobo === 'ok'
              ).length,

            'En revisión Vo.Bo.':
              registros.filter(p =>
                p.status === 'at' &&
                p.vobo === 'wait'
              ).length,

            Rechazadas:
              registros.filter(p =>
                p.vobo === 'rej'
              ).length,

            'Sin atender':
              registros.filter(p =>
                p.status === 'no'
              ).length,

            'En acta SUB aprobada':
              registros.filter(p =>
                tieneDocumentoAprobado(
                  actasSubPorPv,
                  p.pv
                )
              ).length,

            'En carta DEP aprobada':
              registros.filter(p =>
                tieneDocumentoAprobado(
                  cartasDepPorPv,
                  p.pv
                )
              ).length,

            'Lecherías con excedente':
              extrasSub.length,

            'm² excedentes':
              extrasSub.reduce(
                (total, extra) =>
                  total +
                  Number(
                    extra.m2_excedente || 0
                  ),
                0
              ),

            'Costo excedentes':
              extrasSub.reduce(
                (total, extra) => {
                  const m2 =
                    Number(
                      extra.m2_excedente || 0
                    );

                  const precio =
                    Number(extra.precio_m2) ||
                    precioExtraSub(sub);

                  return total +
                    m2 * precio;
                },
                0
              ),

            'Sin evidencia excedente':
              extrasSub.filter(extra =>
                !extra.evidencia_url
              ).length
          };
        });

    /*
     * HOJA 3: POR ZONA
     */
    const gruposZona = {};

    puntos.forEach(punto => {
      const zona =
        punto.zona ||
        'Sin zona';

      if (!gruposZona[zona]) {
        gruposZona[zona] = [];
      }

      gruposZona[zona].push(punto);
    });

    const porZona =
      Object.entries(gruposZona)
        .sort(([a], [b]) =>
          a.localeCompare(b)
        )
        .map(([zona, registros]) => ({
          Zona:
            zona,

          Total:
            registros.length,

          Atendidas:
            registros.filter(p =>
              p.status === 'at'
            ).length,

          'Con Vo.Bo.':
            registros.filter(p =>
              p.vobo === 'ok'
            ).length,

          'En revisión Vo.Bo.':
            registros.filter(p =>
              p.status === 'at' &&
              p.vobo === 'wait'
            ).length,

          Rechazadas:
            registros.filter(p =>
              p.vobo === 'rej'
            ).length,

          'Sin atender':
            registros.filter(p =>
              p.status === 'no'
            ).length,

          'En acta SUB aprobada':
            registros.filter(p =>
              tieneDocumentoAprobado(
                actasSubPorPv,
                p.pv
              )
            ).length,

          'En carta DEP aprobada':
            registros.filter(p =>
              tieneDocumentoAprobado(
                cartasDepPorPv,
                p.pv
              )
            ).length
        }));

    /*
     * HOJA 4: DETALLE GENERAL
     */
    const detalleGeneral =
      [...puntos]
        .sort((a, b) =>
          String(a.pv).localeCompare(
            String(b.pv)
          )
        )
        .map(punto => {
          const extra =
            extraPorPv[punto.pv];

          const m2Extra =
            Number(
              extra?.m2_excedente ||
              punto.m2_excedente ||
              Math.max(
                Number(punto.m2 || M2_STD) -
                M2_STD,
                0
              )
            );

          const precioExtra =
            Number(extra?.precio_m2) ||
            Number(punto.precio_m2) ||
            precioExtraSub(punto.sub);

          return {
            'Clave P.V.':
              String(punto.pv || ''),

            Entidad:
              punto.estado || '',

            Municipio:
              punto.municipio || '',

            Localidad:
              punto.localidad || '',

            Calle:
              punto.calle || '',

            Colonia:
              punto.colonia || '',

            Zona:
              punto.zona || '',

            Cuadrilla:
              punto.sub || '',

            Beneficiarios:
              Number(
                punto.beneficiarios || 0
              ),

            'Fecha compromiso':
              punto.fcomp || '',

            'Fecha real':
              punto.freal || '',

            'Desviación días':
              punto.fcomp
                ? desvio(punto).dias
                : '',

            'Estado del avance':
              textoEstadoAvance(punto),

            'Vo.Bo.':
              textoVobo(punto.vobo),

            'Motivo rechazo':
              punto.motivo || '',

            'm² estándar':
              M2_STD,

            'm² real':
              Number(
                punto.m2 || M2_STD
              ),

            'm² excedente':
              m2Extra,

            'Precio m² excedente':
              precioExtra,

            'Importe excedente':
              m2Extra * precioExtra,

            'Evidencia excedente':
              extra?.evidencia_url ||
              punto.evidencia_url
                ? 'Sí'
                : 'No',

            'Acta SUB':
              foliosDocumentos(
                actasSubPorPv,
                punto.pv
              ),

            'Estado acta SUB':
              estadosDocumentos(
                actasSubPorPv,
                punto.pv
              ),

            'Carta DEP':
              foliosDocumentos(
                cartasDepPorPv,
                punto.pv
              ),

            'Estado carta DEP':
              estadosDocumentos(
                cartasDepPorPv,
                punto.pv
              )
          };
        });

    /*
     * HOJA 5: DESVIACIONES
     */
    const desviaciones =
      puntos
        .filter(punto =>
          punto.fcomp
        )
        .map(punto => {
          const desviacion =
            desvio(punto);

          return {
            'Clave P.V.':
              String(punto.pv || ''),

            Entidad:
              punto.estado || '',

            Municipio:
              punto.municipio || '',

            Zona:
              punto.zona || '',

            Cuadrilla:
              punto.sub || '',

            Compromiso:
              punto.fcomp || '',

            Real:
              punto.freal || '',

            'Desviación días':
              desviacion.dias,

            Estatus:
              desviacion.txt,

            Avance:
              textoEstadoAvance(punto),

            'Vo.Bo.':
              textoVobo(punto.vobo)
          };
        });

    /*
     * HOJA 6: EXCEDENTES
     */
    const filasExcedentes =
      extras.map(extra => {
        const m2 =
          Number(
            extra.m2_excedente || 0
          );

        const precio =
          Number(extra.precio_m2) ||
          precioExtraSub(extra.sub);

        return {
          'Clave P.V.':
            String(extra.pv || ''),

          Entidad:
            extra.estado || '',

          Municipio:
            extra.municipio || '',

          Zona:
            extra.zona || '',

          Cuadrilla:
            extra.sub || '',

          'm² real':
            Number(
              extra.m2_real || M2_STD

          'm² excedente':
            m2,

          'Precio por m²':
            precio,

          Importe:
            m2 * precio,

          Evidencia:
            extra.evidencia_url
              ? 'Sí'
              : 'FALTA',

          'URL evidencia':
            extra.evidencia_url || ''
        };
      });

    /*
     * HOJA 7: ACTAS SUB
     */
    const filasActasSub =
      detalles
        .filter(detalle =>
          detalle.acta?.tipo ===
          'contratista'
        )
        .map(detalle => {
          const acta =
            detalle.acta || {};

          return {
            Folio:
              acta.numero || '',

            Cuadrilla:

            Zona:

            Inicio:
              acta.fini || '',

            Término:

            Estado:

      filasCartasDep,
      [
        16, 28, 14, 14, 16,

      ]
    );

    const fecha =

        .toISOString()
        .slice(0, 10);

    XLSX.writeFile(
      libro,
      `Reporte_interno_completo_${fecha}.xlsx`
    );

    toast(
      'Reporte interno completo generado'
    );

  } catch (error) {
    console.error(
      'No fue posible generar el reporte interno:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte interno'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =

    }
  }
}

function ajustarHojaExcel(
  hoja,
  anchos = [],
  aplicarFiltro = true
) {
  hoja['!cols'] = anchos.map(ancho => ({
    wch: ancho
  }));

  if (
    aplicarFiltro &&
    hoja['!ref']
  ) {
    const rango =
      XLSX.utils.decode_range(
        hoja['!ref']
      );

    hoja['!autofilter'] = {
      ref: XLSX.utils.encode_range({
        s: {
          r: rango.s.r,
          c: rango.s.c
        },
        e: {
          r: rango.s.r,
          c: rango.e.c
        }
      })
    };
  }
}

function agregarHojaExcel(
  libro,
  nombre,
  filas,
  anchos = []
) {
  const datos =
    filas.length
      ? filas
      : [
          {
            Información:
              'Sin registros para mostrar'
          }
        ];

  const hoja =
    XLSX.utils.json_to_sheet(datos);

  ajustarHojaExcel(
    hoja,
    anchos.length
      ? anchos
      : Object.keys(datos[0]).map(
          () => 18
        )
  );

  XLSX.utils.book_append_sheet(
    libro,
    hoja,
    nombre.slice(0, 31)
  );
}

function textoEstadoAvance(punto) {
  if (punto.status !== 'at') {
    return 'Sin atender';
  }

  if (punto.vobo === 'ok') {
    return 'Atendido con Vo.Bo.';
  }

  if (punto.vobo === 'rej') {
    return 'Atendido rechazado';
  }

  return 'Atendido en revisión';
}

function textoVobo(valor) {
  const textos = {
    ok: 'Aprobado',
    wait: 'En revisión',
    rej: 'Rechazado',
    '-': 'No solicitado'
  };

  return textos[valor] ||
    valor ||
    'No solicitado';
}

    lecherias.forEach((p, indice) => {
      linea += `${p.pv}   `;

      const finFila =
        (indice + 1) % 6 === 0;

      const ultimo =
        indice === lecherias.length - 1;

      if (finFila || ultimo) {
        if (y > 285) {
          doc.addPage();
          y = 18;
        }

        doc.text(
          linea.trim(),
          14,
          y
        );

        linea = '';
        y += 5;
      }
    });
  }

  /*
   * Pie de página.
   */
  const paginas =
    doc.getNumberOfPages();

  for (
    let pagina = 1;
    pagina <= paginas;
    pagina++
  ) {
    doc.setPage(pagina);

    doc.setFontSize(8);
    doc.setTextColor(107, 123, 140);

    doc.text(
      `Página ${pagina} de ${paginas}`,
      105,
      292,
      {
        align: 'center'
      }
    );
  }

  const fecha =
    new Date()
      .toISOString()
      .slice(0, 10);

  doc.save(
    `Estimacion_${fecha}.pdf`
  );

  toast('PDF de estimación generado');
}

/* ============ REPORTE PDF antes/después por punto ============ */
async function reportePDF() {
if (ROLE === 'sub') {
  toast(
    'Este reporte no está disponible para cuadrillas'
  );
  return;
}

  if (!CUR) {
    toast('Primero abre una lechería');
    return;
  }

  const p = CUR;

  const fotosPrev =
    Array.isArray(p.fotosPrev)
      ? p.fotosPrev
      : [];

  const fotosFin =
    Array.isArray(p.fotosFin)
      ? p.fotosFin
      : [];

  if (!fotosPrev.length && !fotosFin.length) {
    toast('La lechería no tiene evidencia fotográfica');
    return;
  }

  const boton =
    document.querySelector(
      '[onclick="reportePDF()"]'
    );

  const textoOriginal =
    boton
      ? boton.innerHTML
      : '';

  if (boton) {
    boton.disabled = true;
    boton.textContent = 'Generando reporte…';
  }

  try {
    const { jsPDF } =
      window.jspdf;

    const doc =
      new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

    const margenX = 12;
    const anchoPagina = 210;
    const altoPagina = 297;
    const limiteInferior = 283;

    let y = 0;

    function encabezadoPagina(
      mostrarDatos = false
    ) {
      doc.setFillColor(13, 27, 42);
      doc.rect(
        0,
        0,
        anchoPagina,
        28,
        'F'
      );

      doc.setTextColor(255, 255, 255);
      doc.setFont(undefined, 'bold');
      doc.setFontSize(14);

      doc.text(
        `Reporte fotográfico · P.V. ${p.pv}`,
        margenX,
        12
      );

      doc.setFont(undefined, 'normal');
      doc.setFontSize(8.5);

      doc.text(
        'Pintura de fachadas',
        margenX,
        18
      );

      doc.text(
        `Proc. ${PROCEDIMIENTO}`,
        margenX,
        23
      );

      doc.setTextColor(20, 20, 20);

      y = mostrarDatos
        ? 36
        : 35;
    }

    function agregarPiePagina() {
      const paginas =
        doc.getNumberOfPages();

      for (
        let pagina = 1;
        pagina <= paginas;
        pagina++
      ) {
        doc.setPage(pagina);

        doc.setFontSize(7.5);
        doc.setTextColor(107, 123, 140);

        doc.text(
          `P.V. ${p.pv} · Página ${pagina} de ${paginas}`,
          105,
          292,
          {
            align: 'center'
          }
        );
      }
    }

    function nuevaPagina() {
      doc.addPage();
      encabezadoPagina(false);
    }

    function asegurarEspacio(
      altoNecesario
    ) {
      if (
        y + altoNecesario >
        limiteInferior
      ) {
        nuevaPagina();
      }
    }

    function textoVoboReporte(valor) {
      const textos = {
        ok: 'Aprobado',
        wait: 'Pendiente de revisión',
        rej: 'Rechazado',
        '-': 'No solicitado'
      };

      return textos[valor] ||
        'No solicitado';
    }

    function textoEstadoReporte() {
      if (p.status !== 'at') {
        return 'No atendido';
      }

      if (p.vobo === 'ok') {
        return 'Atendido con Vo.Bo.';
      }

      if (p.vobo === 'rej') {
        return 'Atendido rechazado';
      }

      return 'Atendido en revisión';
    }

    function formatoFecha(
      valor
    ) {
      if (!valor) {
        return 'Sin fecha';
      }

      const fecha =
        new Date(valor);

      if (
        Number.isNaN(
          fecha.getTime()
        )
      ) {
        return String(valor);
      }

      return fecha.toLocaleString(
        'es-MX',
        {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }
      );
    }

    function coordenadasFoto(
      foto
    ) {
      const lat =
        foto.lat !== null &&
        foto.lat !== undefined &&
        foto.lat !== ''
          ? Number(foto.lat).toFixed(6)
          : '';

      const lng =
        foto.lng !== null &&
        foto.lng !== undefined &&
        foto.lng !== ''
          ? Number(foto.lng).toFixed(6)
          : '';

      return lat && lng
        ? `${lat}, ${lng}`
        : 'Sin coordenadas';
    }

    async function cargarImagenComoDataUrl(
      url
    ) {
      try {
        const respuesta =
          await fetch(url, {
            cache: 'no-store'
          });

        if (!respuesta.ok) {
          throw new Error(
            `HTTP ${respuesta.status}`
          );
        }

        const blob =
          await respuesta.blob();

        return await new Promise(
          (resolve, reject) => {
            const lector =
              new FileReader();

            lector.onload =
              () => resolve(
                lector.result
              );

            lector.onerror =
              () => reject(
                new Error(
                  'No fue posible leer la imagen'
                )
              );

            lector.readAsDataURL(blob);
          }
        );

      } catch (error) {
        console.warn(
          'No se pudo cargar una fotografía para el PDF:',
          url,
          error
        );

        return null;
      }
    }

    function tipoImagen(
      dataUrl
    ) {
      if (
        String(dataUrl).startsWith(
          'data:image/png'
        )
      ) {
        return 'PNG';
      }

      if (
        String(dataUrl).startsWith(
          'data:image/webp'
        )
      ) {
        return 'WEBP';
      }

      return 'JPEG';
    }

    function dibujarImagenAjustada(
      dataUrl,
      formato,
      x,
      yImagen,
      anchoCaja,
      altoCaja
    ) {
      try {
        const propiedades =
          doc.getImageProperties(
            dataUrl
          );

        const proporcionImagen =
          propiedades.width /
          propiedades.height;

        const proporcionCaja =
          anchoCaja /
          altoCaja;

        let anchoImagen =
          anchoCaja;

        let altoImagen =
          altoCaja;

        let xImagen =
          x;

        let yReal =
          yImagen;

        if (
          proporcionImagen >
          proporcionCaja
        ) {
          altoImagen =
            anchoCaja /
            proporcionImagen;

          yReal +=
            (
              altoCaja -
              altoImagen
            ) / 2;

        } else {
          anchoImagen =
            altoCaja *
            proporcionImagen;

          xImagen +=
            (
              anchoCaja -
              anchoImagen
            ) / 2;
        }

        doc.setFillColor(
          238,
          241,
          244
        );

        doc.rect(
          x,
          yImagen,
          anchoCaja,
          altoCaja,
          'F'
        );

        doc.addImage(
          dataUrl,
          formato,
          xImagen,
          yReal,
          anchoImagen,
          altoImagen
        );

      } catch (error) {
        console.warn(
          'No se pudo insertar la fotografía en el PDF:',
          error
        );

        doc.setFillColor(
          238,
          241,
          244
        );

        doc.rect(
          x,
          yImagen,
          anchoCaja,
          altoCaja,
          'F'
        );

        doc.setTextColor(
          107,
          123,
          140
        );

        doc.setFontSize(8);

        doc.text(
          'Imagen no disponible',
          x + anchoCaja / 2,
          yImagen + altoCaja / 2,
          {
            align: 'center'
          }
        );
      }
    }

    async function agregarSeccionFotos(
      titulo,
      fotos
    ) {
      asegurarEspacio(18);

      doc.setTextColor(
        20,
        20,
        20
      );

      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);

      doc.text(
        `${titulo} (${fotos.length})`,
        margenX,
        y
      );

      y += 7;

      if (!fotos.length) {
        doc.setFillColor(
          248,
          227,
          225
        );

        doc.roundedRect(
          margenX,
          y,
          186,
          13,
          2,
          2,
          'F'
        );

        doc.setTextColor(
          192,
          54,
          44
        );

        doc.setFont(undefined, 'normal');
        doc.setFontSize(9);

        doc.text(
          'No existe evidencia registrada en esta etapa.',
          margenX + 4,
          y + 8
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        y += 19;
        return;
      }

      const anchoTarjeta = 88;
      const altoImagen = 61;
      const altoPie = 18;
      const altoTarjeta =
        altoImagen +
        altoPie;

      const separacionX = 10;
      const separacionY = 8;

      for (
        let indice = 0;
        indice < fotos.length;
        indice += 2
      ) {
        asegurarEspacio(
          altoTarjeta +
          separacionY
        );

        const fila =
          fotos.slice(
            indice,
            indice + 2
          );

        const resultados =
          await Promise.all(
            fila.map(foto =>
              cargarImagenComoDataUrl(
                foto.url
              )
            )
          );

        fila.forEach(
          (foto, posicion) => {
            const x =
              margenX +
              posicion *
              (
                anchoTarjeta +
                separacionX
              );

            const dataUrl =
              resultados[posicion];

            doc.setDrawColor(
              223,
              229,
              236
            );

            doc.roundedRect(
              x,
              y,
              anchoTarjeta,
              altoTarjeta,
              2,
              2,
              'S'
            );

            if (dataUrl) {
              dibujarImagenAjustada(
                dataUrl,
                tipoImagen(dataUrl),
                x + 1,
                y + 1,
                anchoTarjeta - 2,
                altoImagen - 2
              );

            } else {
              doc.setFillColor(
                238,
                241,
                244
              );

              doc.rect(
                x + 1,
                y + 1,
                anchoTarjeta - 2,
                altoImagen - 2,
                'F'
              );

              doc.setTextColor(
                107,
                123,
                140
              );

              doc.setFontSize(8);

              doc.text(
                'Imagen no disponible',
                x +
                anchoTarjeta / 2,
                y +
                altoImagen / 2,
                {
                  align: 'center'
                }
              );
            }

            const categoria =
              CAT_LABEL[foto.tipo] ||
              foto.tipo ||
              'General';

            doc.setTextColor(
              20,
              20,
              20
            );

            doc.setFont(undefined, 'bold');
            doc.setFontSize(8);

            doc.text(
              categoria,
              x + 3,
              y + altoImagen + 5
            );

            doc.setFont(undefined, 'normal');
            doc.setFontSize(6.8);
            doc.setTextColor(
              107,
              123,
              140
            );

            const coordenadas =
              coordenadasFoto(foto);

            doc.text(
              coordenadas,
              x + 3,
              y + altoImagen + 10
            );

            const fecha =
              formatoFecha(
                foto.fecha
              );

            doc.text(
              fecha,
              x + 3,
              y + altoImagen + 15
            );
          }
        );

        y +=
          altoTarjeta +
          separacionY;
      }

      y += 3;
    }

    encabezadoPagina(true);

    /*
     * Datos generales.
     */
    doc.setFont(undefined, 'bold');
    doc.setFontSize(10);

    doc.text(
      'Datos generales',
      margenX,
      y
    );

    y += 7;

    const domicilio =
      [
        p.calle,
        p.colonia
      ]
        .filter(Boolean)
        .join(', ') ||
      'Sin domicilio registrado';

    const ubicacion =
      [
        p.municipio,
        p.estado
      ]
        .filter(Boolean)
        .join(', ') ||
      'Sin ubicación registrada';

    const coordenadasPv =
      p.lat !== null &&
      p.lat !== undefined &&
      p.lng !== null &&
      p.lng !== undefined
        ? `${p.lat}, ${p.lng}`
        : 'Sin coordenadas';

    const superficie =
      Number(p.m2 || M2_STD);

    const excedente =
      Math.max(
        superficie -
        M2_STD,
        0
      );

    const filasInfo = [
      [
        'Domicilio',
        domicilio
      ],
      [
        'Municipio / entidad',
        ubicacion
      ],
      [
        'Zona / cuadrilla',
        `${p.zona || 'Sin zona'} / ${p.sub || 'Sin Cuadrilla'}`
      ],
      [
        'Coordenadas del P.V.',
        coordenadasPv
      ],
      [
        'Fecha compromiso',
        p.fcomp || 'Sin fecha'
      ],
      [
        'Fecha real',
        p.freal || 'Sin fecha'
      ],
      [
        'Superficie',
        `${superficie} m²${
          excedente > 0
            ? ` (+${excedente} m² excedentes)`
            : ''
        }`
      ],
      [
        'Estado',
        textoEstadoReporte()
      ],
      [
        'Vo.Bo.',
        textoVoboReporte(
          p.vobo
        )
      ],
      [
        'Generado',
        new Date().toLocaleString(
          'es-MX'
        )
      ]
    ];

    doc.setFontSize(8.5);

    filasInfo.forEach(
      ([etiqueta, valor]) => {
        asegurarEspacio(7);

        doc.setFont(
          undefined,
          'bold'
        );

        doc.setTextColor(
          20,
          20,
          20
        );

        doc.text(
          `${etiqueta}:`,
          14,
          y
        );

        doc.setFont(
          undefined,
          'normal'
        );

        const lineas =
          doc.splitTextToSize(
            String(valor),
            132
          );

        doc.text(
          lineas,
          62,
          y
        );

        y += Math.max(
          5.5,
          lineas.length *
          4.5
        );
      }
    );

    y += 4;

    /*
     * Resumen de evidencia.
     */
    asegurarEspacio(22);

    doc.setFillColor(
      238,
      243,
      247
    );

    doc.roundedRect(
      margenX,
      y,
      186,
      16,
      2,
      2,
      'F'
    );

    doc.setTextColor(
      20,
      20,
      20
    );

    doc.setFont(undefined, 'bold');
    doc.setFontSize(9);

    doc.text(
      `Fotos previas: ${fotosPrev.length}`,
      18,
      y + 7
    );

    doc.text(
      `Fotos finales: ${fotosFin.length}`,
      78,
      y + 7
    );

    doc.text(
      `Total: ${fotosPrev.length + fotosFin.length}`,
      144,
      y + 7
    );

    doc.setFont(undefined, 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(
      107,
      123,
      140
    );

    doc.text(
      fotosOk(p)
        ? 'Evidencia mínima completa'
        : 'Evidencia incompleta según requisitos',
      18,
      y + 12
    );

    y += 23;

    await agregarSeccionFotos(
      'ANTES',
      fotosPrev
    );

    await agregarSeccionFotos(
      'DESPUÉS',
      fotosFin
    );

    /*
     * Observaciones.
     */
    if (p.motivo) {
      asegurarEspacio(22);

      doc.setFillColor(
        248,
        227,
        225
      );

      doc.roundedRect(
        margenX,
        y,
        186,
        18,
        2,
        2,
        'F'
      );

      doc.setTextColor(
        192,
        54,
        44
      );

      doc.setFont(undefined, 'bold');
      doc.setFontSize(8.5);

      doc.text(
        'Observación o motivo de rechazo:',
        16,
        y + 6
      );

      doc.setFont(undefined, 'normal');

      const lineas =
        doc.splitTextToSize(
          p.motivo,
          176
        );

      doc.text(
        lineas.slice(0, 2),
        16,
        y + 11
      );

      y += 23;
    }

    agregarPiePagina();

    const pvSeguro =
      String(p.pv)
        .replace(
          /[^0-9A-Za-z_-]/g,
          '_'
        );

    doc.save(
      `Reporte_fotografico_${pvSeguro}.pdf`
    );

    toast(
      'Reporte fotográfico generado'
    );

  } catch (error) {
    console.error(
      'No fue posible generar el reporte fotográfico:',
      error
    );

    toast(
      error.message ||
      'No fue posible generar el reporte fotográfico'
    );

  } finally {
    if (boton) {
      boton.disabled = false;
      boton.innerHTML =
        textoOriginal;
    }
  }
}

/* ============ PROGRAMA DE OBRA (fechas, desviaciones, curva) ============ */
function desvio(p){
  // devuelve {clase, txt, dias}
  if(p.status!=='at' || !p.fcomp){
    // no atendida: ¿ya venció el compromiso?
    if(p.fcomp && daysBetween(p.fcomp, HOY.toISOString().slice(0,10))>0)
      return {cls:'d-late',txt:'Vencida', dias:daysBetween(p.fcomp,HOY.toISOString().slice(0,10))};
    return {cls:'d-none',txt:'Programada', dias:0};
  }
  const d=daysBetween(p.fcomp,p.freal); // + = atrasado
  if(d>2) return {cls:'d-late',txt:'+'+d+'d tarde',dias:d};
  if(d< -1) return {cls:'d-soon',txt:Math.abs(d)+'d antes',dias:d};
  return {cls:'d-on',txt:'A tiempo',dias:d};
}
function renderPrograma(){
  document.getElementById('crumbs').style.display='none';
  document.getElementById('filters').style.display='none';
  const pts=visiblePts().filter(p=>p.fcomp);
  const hoy=HOY.toISOString().slice(0,10);
  // programado a la fecha = compromisos <= hoy ; real = atendidas <= hoy
  const programado=pts.filter(p=>daysBetween(p.fcomp,hoy)>=0).length;
  const real=pts.filter(p=>p.status==='at'&&p.freal&&daysBetween(p.freal,hoy)>=0).length;
  const atrasadas=pts.filter(p=>{const d=desvio(p);return d.cls==='d-late';}).length;
  const aTiempo=pts.filter(p=>{const d=desvio(p);return d.cls==='d-on'||d.cls==='d-soon';}).length;
  const desvGlobal=real-programado; // negativo = atraso

  const sc=document.getElementById('scroll'); sc.innerHTML='';
  const wrap=document.createElement('div');

  // curva programado vs real (por semana)
  const curva=buildCurva(pts);
  wrap.innerHTML=`
    <div class="progsum">
      <div class="s"><div class="v">${programado}</div><div class="k">Programado a hoy</div></div>
      <div class="s"><div class="v" style="color:var(--leche)">${real}</div><div class="k">Real a hoy</div></div>
      <div class="s"><div class="v" style="color:${desvGlobal<0?'var(--rej)':'var(--done)'}">${desvGlobal>=0?'+':''}${desvGlobal}</div><div class="k">Desviación</div></div>
    </div>
    <div class="curvebox">
      <h4>Avance programado vs real (acumulado)</h4>
      ${curva}
      <div style="display:flex;gap:16px;font-size:10.5px;margin-top:8px;color:var(--mut)">
        <span><span style="display:inline-block;width:14px;height:3px;background:#9aa7b4;vertical-align:middle;margin-right:5px"></span>Programado</span>
        <span><span style="display:inline-block;width:14px;height:3px;background:var(--leche);vertical-align:middle;margin-right:5px"></span>Real</span>
      </div>
    </div>
    <div class="progsum" style="margin-top:2px">
      <div class="s"><div class="v" style="color:var(--rej)">${atrasadas}</div><div class="k">Atrasadas</div></div>
      <div class="s"><div class="v" style="color:var(--done)">${aTiempo}</div><div class="k">A tiempo</div></div>
      <div class="s"><div class="v">${pts.length}</div><div class="k">Con fecha</div></div>
    </div>
    <div class="sectlabel">Detalle por lechería (desviaciones)</div>`;
  sc.appendChild(wrap);

  // ordenar: más atrasadas primero
  const sorted=[...pts].sort((a,b)=>desvio(b).dias-desvio(a).dias).slice(0,120);
  sorted.forEach(p=>{
    const d=desvio(p);
    const row=document.createElement('div'); row.className='progrow'; row.style.cursor='pointer';
    row.onclick=()=>openSheet(p.id);
    row.innerHTML=`
      <div class="t"><b>${p.pv} · ${p.municipio}</b><span class="desv-badge ${d.cls}">${d.txt}</span></div>
      <div class="dates">
        <div class="dt"><div class="v">${p.fcomp||'—'}</div><div class="k">Compromiso</div></div>
        <div class="dt"><div class="v">${p.freal||'—'}</div><div class="k">Real</div></div>
        <div class="dt"><div class="v">${p.sub||'—'}</div><div class="k">Cuadrilla</div></div>
      </div>`;
    sc.appendChild(row);
  });
}
function buildCurva(pts){
  // acumulado semanal de programado (por fcomp) y real (por freal)
  const hoy=HOY.toISOString().slice(0,10);
  const dates=pts.map(p=>p.fcomp).concat(pts.filter(p=>p.freal).map(p=>p.freal)).sort();
  if(!dates.length) return '<div style="color:var(--mut);font-size:12px">Sin datos de fechas</div>';
  const t0=new Date(dates[0]), t1=new Date(dates[dates.length-1]);
  const weeks=Math.max(1,Math.ceil(daysBetween(dates[0],dates[dates.length-1])/7));
  const prog=[], real=[];
  for(let w=0;w<=weeks;w++){
    const cut=new Date(t0); cut.setDate(cut.getDate()+w*7); const ci=cut.toISOString().slice(0,10);
    prog.push(pts.filter(p=>p.fcomp&&daysBetween(p.fcomp,ci)>=0).length);
    real.push(pts.filter(p=>p.status==='at'&&p.freal&&daysBetween(p.freal,ci)>=0&&daysBetween(ci,hoy)>=0).length);
  }
  const maxV=Math.max(...prog,...real,1);
  const W=300,H=130,pad=6;
  const x=i=>pad+i*(W-2*pad)/Math.max(1,weeks);
  const y=v=>H-pad-v*(H-2*pad)/maxV;
  const line=(arr,col)=>{
    let d='M'+arr.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' L');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  };
  return `<svg class="curve-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e0e5ec"/>
    ${line(prog,'#9aa7b4')}${line(real,'#1f6feb')}</svg>`;
}

    return;
  }

  const fechaInicio = window.prompt(

  if (fechaInicio === null) return;

  const fechaFin = window.prompt(
    'Fecha final del corte (AAAA-MM-DD):',
    '2026-07-31'
  );

  const formatoFecha = /^\d{4}-\d{2}-\d{2}$/;

    return;

    toast('La fecha inicial no puede ser posterior a la final');
    return;
  }

  const confirmado = window.confirm(
    `¿Generar el acta de ${subNormalizado} para el periodo ` +
    `${fechaInicio} a ${fechaFin}?`
  );

  if (!confirmado) return;

  try {

      subNormalizado,
      fechaInicio.trim(),
      fechaFin.trim(),
      PRECIO_FACHADA

    console.error(error);

      'No fue posible generar el acta'
    );
  }
}

function fechaISOlocal(fecha) {
  const y =
    fecha.getFullYear();

  const m =
    String(
      fecha.getMonth() + 1
    ).padStart(2, '0');

  const d =
    String(
      fecha.getDate()
    ).padStart(2, '0');

  return `${y}-${m}-${d}`;
}

function obtenerSemanaActual() {
  const hoy =
    new Date();

  const dia =
    hoy.getDay();

  /*
   * Semana lunes-domingo.
   */
  const diferenciaLunes =
    dia === 0
      ? -6
      : 1 - dia;

  const lunes =
    new Date(hoy);

  lunes.setDate(
    hoy.getDate() +
    diferenciaLunes
  );

  const domingo =
    new Date(lunes);

  domingo.setDate(
    lunes.getDate() + 6
  );

  return {
    inicio:
      fechaISOlocal(lunes),

    fin:
      fechaISOlocal(domingo)
  };
}

              ? p.fcomp
              : p.freal
          }
        </div>
      </div>
    `;
  }

  const generada =
    a.documento_generado_url;

  const firmada =
    a.documento_firmado_url;

  let estadoTexto =
    'Por armar';

  let estadoColor =
    'var(--mut)';

  if (
    a.estado ===
    'en_revision'
  ) {
    estadoTexto =
      'En revisión';

    estadoColor =
      'var(--wait)';
  }

  if (
    a.estado ===
    'aprobada'
  ) {
    estadoTexto =
      'Aprobada';

    estadoColor =
      'var(--done)';
  }

  if (
    a.estado ===
    'rechazada'
  ) {
    estadoTexto =
      'Rechazada';

    estadoColor =
      'var(--rej)';
  }

  return `
    <div
      class="estim-row"
      style="
        align-items:flex-start;
      "
    >
      <div
        class="l"
        style="
          flex:1;
          min-width:0;
        "
      >
        <b>P.V. ${p.pv}</b>

        <div
          style="
            font-size:10px;
            margin-top:2px;
            color:var(--mut);
          "
        >

          ${p.estado}
        </div>

        <div
          style="
            font-size:10px;
            margin-top:3px;
            color:${estadoColor};
            font-weight:700;
          "
        >
          ${estadoTexto}
        </div>

        <div
          style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:5px;
            font-size:10px;
          "
        >
          ${
            generada
              ? `
                <a
                  href="${generada}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="
                    color:var(--leche);
                    text-decoration:none;
                    font-weight:700;
                  "
                >
                  📄 Generada
                </a>
              `
              : ''
          }

          ${
            firmada
              ? `
                <a
                  href="${firmada}"
                  target="_blank"
                  rel="noopener noreferrer"
                  style="
                    color:var(--done);
                    text-decoration:none;
                    font-weight:700;
                  "
                >
                  ✓ Firmada
                </a>
              `
              : ''
          }

          ${
            !generada &&
            !firmada
              ? `
                <span
                  style="
                    color:var(--wait);
                  "
                >
                  Sin documento cargado
                </span>
              `
              : ''
          }
        </div>
      </div>

      <div
        class="v"
        style="
          font-size:11px;
          margin-left:10px;
        "
      >
        ${
          clase === 'apertura'
            ? p.fcomp
            : p.freal
        }
      </div>

    </div>
  `;
}

async function descargarActasPeriodo(
  clase
) {
  if (
    ROLE !== 'gen' &&
    ROLE !== 'admin'
  ) {
    toast(
      'Tu perfil no puede descargar este concentrado'
    );

    return;
  }

  const registros =
  ACTAS_PERIODO.actas || [];

  const conDocumentos =
    registros.filter(
      x =>
        x.acta &&
        (
          x.acta.documento_generado_url ||
          x.acta.documento_firmado_url
        )
    );

  if (!conDocumentos.length) {
    toast(
      'No hay documentos disponibles en este periodo'
    );

    return;
  }

  try {
    toast(
      'Preparando concentrado…'
    );

    const zip =
      new JSZip();

    for (
      const item
      of conDocumentos
    ) {
      const pv =
        String(
          item.punto.pv
        );

      const acta =
        item.acta;

      if (
        acta.documento_generado_url
      ) {
        await agregarArchivoActaZIP(
          zip,
          acta.documento_generado_url,
          `${pv}_GENERADA`
        );
      }

      if (
        acta.documento_firmado_url
      ) {
        await agregarArchivoActaZIP(
          zip,
          acta.documento_firmado_url,
          `${pv}_FIRMADA`
        );
      }
    }

    const blob =
      await zip.generateAsync({
        type: 'blob'
      });

    const nombre =
  `actas_inicio_entrega_recepcion_` +
  `${ACTAS_PERIODO.inicio}_` +
  `${ACTAS_PERIODO.fin}.zip`;

    const enlace =
      document.createElement('a');

    enlace.href =
      URL.createObjectURL(
        blob
      );

    enlace.download =
      nombre;

    document.body.appendChild(
      enlace
    );

    enlace.click();

    enlace.remove();

    URL.revokeObjectURL(
      enlace.href
    );

    toast(
      'Concentrado descargado'
    );

  } catch (error) {
    console.error(
      'Error preparando ZIP:',
      error
    );

    toast(
      'No fue posible preparar el concentrado'
    );
  }
}

async function agregarArchivoActaZIP(
  zip,
  url,
  nombreBase
) {
  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {
    throw new Error(
      `No fue posible descargar ${nombreBase}`
    );
  }

  const blob =
    await respuesta.blob();

  let extension =
    'pdf';

  const tipo =
    blob.type || '';

  if (
    tipo.includes('png')
  ) {
    extension =
      'png';
  } else if (
    tipo.includes('jpeg') ||
    tipo.includes('jpg')
  ) {
    extension =
      'jpg';
  }

  zip.file(
    `${nombreBase}.${extension}`,
    blob
  );
}

function reporteInicioPDF() {
  const puntos =
    Array.isArray(visiblePts())
      ? visiblePts()
      : [];

  if (!puntos.length) {
    toast('No existen lecherías en el alcance actual');
    return;
  }

  const { jsPDF } =
    window.jspdf;

  const doc =
    new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

  const margenX = 12;
  const anchoPagina = 210;
  const limiteInferior = 282;

  const esSub =
    ROLE === 'sub';

  const alcance =
    esSub
      ? CURSUB
      : 'Nacional';

  const puntosAtendidos =
    puntos.filter(
      punto => punto.status === 'at'
    ).length;

  const puntosVobo =
    puntos.filter(
      punto => punto.vobo === 'ok'
    ).length;

  const zonas =
    [...new Set(
      puntos
        .map(punto => punto.zona)
        .filter(Boolean)
    )]
      .sort();

  const subs =
    [...new Set(
      puntos
        .map(punto => punto.sub)
        .filter(Boolean)
    )]
      .sort();

  /*
   * La fecha de arranque se toma de METAS.
   * Para un subcontratista usa su propia fecha.
   * En alcance nacional usa la fecha más temprana.
   */
  const fechasInicio =
    esSub
      ? [
          METAS[CURSUB]?.inicio
        ].filter(Boolean)
      : Object.values(METAS)
          .map(meta => meta.inicio)
          .filter(Boolean);

  const fechaInicio =
    fechasInicio.length
      ? fechasInicio.sort()[0]
      : '';

  const fechasTermino =
    esSub
      ? [
          METAS[CURSUB]?.termino
        ].filter(Boolean)
      : Object.values(METAS)
          .map(meta => meta.termino)
          .filter(Boolean);

  const fechaTermino =
    fechasTermino.length
      ? fechasTermino.sort().at(-1)
      : '';

  const metaSemanal =
    esSub
      ? Number(
          METAS[CURSUB]?.semana || 0
        )
      : subs.reduce(
          (total, sub) =>
            total +
            Number(
              METAS[sub]?.semana || 0
            ),
          0
        );

  const metaMensual =
    esSub
      ? Number(
          METAS[CURSUB]?.mes || 0
        )
      : subs.reduce(
          (total, sub) =>
            total +
            Number(
              METAS[sub]?.mes || 0
            ),
          0
        );

  function formatoFechaDocumento(
    valor
  ) {
    if (!valor) {
      return 'Sin fecha definida';
    }

    const partes =
      String(valor).split('-');

    if (partes.length !== 3) {
      return String(valor);
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function agregarEncabezado() {
    doc.setFillColor(13, 27, 42);

    doc.rect(
      0,
      0,
      anchoPagina,
      31,
      'F'
    );

    doc.setTextColor(
      255,
      255,
      255
    );

    doc.setFont(
      undefined,
      'bold'
    );

    doc.setFontSize(14);

    doc.text(
      'Reporte de inicio de trabajos',
      margenX,
      12
    );

    doc.setFont(
      undefined,
      'normal'
    );

    doc.setFontSize(8.5);

    doc.text(
      'Junta de arranque · Pintura de fachadas de lecherías',
      margenX,
      19
    );

    doc.text(
      `Procedimiento ${PROCEDIMIENTO}`,
      margenX,
      25
    );

    doc.setTextColor(
      20,
      20,
      20
    );
  }

  function nuevaPagina() {
    doc.addPage();

    agregarEncabezado();

    return 40;
  }

  function asegurarEspacio(
    y,
    alto
  ) {
    if (
      y + alto >
      limiteInferior
    ) {
      return nuevaPagina();
    }

    return y;
  }

  function escribirFila(
    etiqueta,
    valor,
    y
  ) {
    y =
      asegurarEspacio(
        y,
        8
      );

    doc.setFont(
      undefined,
      'bold'
    );

    doc.setFontSize(8.7);

    doc.text(
      `${etiqueta}:`,
      14,
      y
    );

    doc.setFont(
      undefined,
      'normal'
    );

    const lineas =
      doc.splitTextToSize(
        String(valor),
        128
      );

    doc.text(
      lineas,
      66,
      y
    );

    return y +
      Math.max(
        6,
        lineas.length * 4.5
      );
  }

  function tituloSeccion(
    titulo,
    y
  ) {
    y =
      asegurarEspacio(
        y,
        13
      );

    doc.setDrawColor(
      31,

      235
    );

    );

    doc.setTextColor(
      20,

    );

    return y + 9;
  }

    );

  y =
    escribirFila(
      'Alcance del reporte',

    );

  y =
    escribirFila(

      formatoFechaDocumento(
        fechaInicio

    );

  y =
    escribirFila(
      'Fecha programada de término',

  /*

  const resumen = [

    );
  }

  const alcanceSeguro =
    String(alcance)
      .replace(
        /[^0-9A-Za-z_-]/g,
        '_'
      );

  doc.save(
    `Reporte_inicio_trabajos_${alcanceSeguro}.pdf`
  );

  toast(
    'Reporte de inicio de trabajos generado'
  );
}

function toggleObs(o,el){
  const i=ACTA_OBS_SEL.indexOf(o);
  if(i>=0){ACTA_OBS_SEL.splice(i,1);el.classList.remove('on');}
  else{ACTA_OBS_SEL.push(o);el.classList.add('on');}
}

async function uploadActa() {
  if (!ACTA_CUR) return;

  if (ACTA_CUR.estado === 'aprobada') {
    toast('No se puede modificar un acta aprobada');
    return;
  }

  const input = document.createElement('input');

  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';

  input.onchange = async () => {
    const archivo = input.files?.[0];

    if (!archivo) return;

    const limite = 20 * 1024 * 1024;

    if (archivo.size > limite) {
      toast('El archivo no debe superar 20 MB');
      return;
    }

    try {
      toast('Cargando documento…');

      const actaActualizada =
        await subirDocumentoActa(
          ACTA_CUR,
          archivo
        );

      const indice = LOTES.findIndex(
        acta => acta.id === ACTA_CUR.id
      );

      if (indice !== -1) {
        LOTES[indice] = actaActualizada;
      }

      ACTA_CUR = actaActualizada;

      toast('Acta cargada — pasa a revisión');
      openActa(ACTA_CUR.id);
      await renderActas();
    } catch (error) {
      console.error(error);

      toast(
        error.message ||
        'No fue posible cargar el acta'
      );
    }
  };

  input.click();
}

async function aprobarActa() {
  if (!ACTA_CUR) return;

  const esDependencia =
    ACTA_CUR.tipo === 'dependencia';

  const rolEsperado =
    esDependencia ? 'dep' : 'admin';

  if (ROLE !== rolEsperado) {
    toast('Tu perfil no puede aprobar este documento');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'aprobada',
        []
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast(
      esDependencia
        ? '✅ Carta aprobada por la dependencia'
        : '✅ Acta aprobada — lista para cobro'
    );

    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible aprobar el documento'
    );
  }
}

async function rechazarActa() {
    if (!ACTA_CUR) return;

  const puedeRechazar =
    (
      ACTA_CUR.tipo === 'contratista' &&
      ROLE === 'admin'
    ) ||
    (
      ACTA_CUR.tipo === 'dependencia' &&
      ROLE === 'dep'
    );

  if (!puedeRechazar) {
    toast('Tu perfil no puede rechazar este documento');
    return;
  }
  const libre =
    document.getElementById('obsLibre');

  const textoLibre =
    libre ? libre.value.trim() : '';

  const observaciones = [...ACTA_OBS_SEL];

  if (textoLibre) {
    observaciones.push(textoLibre);
  }

  if (!observaciones.length) {
    toast('Marca al menos una observación');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'rechazada',
        observaciones
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast('Acta rechazada con observaciones');
    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible rechazar el acta'
    );
  }
}


function actaPDF() {
  if (
    !ACTA_CUR ||
    !ACTA_DETALLE ||
    !Array.isArray(ACTA_DETALLE.lecherias)
  ) {
    toast('Primero abre el detalle completo del documento');
    return;
  }

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const acta = ACTA_CUR;
  const lecherias = ACTA_DETALLE.lecherias;

  const esDependencia =
    acta.tipo === 'dependencia';

  const administradorDocumento =
  esDependencia
    ? (
        acta.admin ||
        `Administrador · ${DEPENDENCIA}`
      )
    : EMPRESA;

  const nombreDocumento =
    esDependencia
      ? 'Carta de entrega-recepción'
      : 'Acta de conformidad';

  const contextoDocumento =
    esDependencia
      ? 'Con la dependencia'
      : 'Corte con cuadrilla';

  const numero =
    acta.numero ||
    (
      (esDependencia ? 'DEP-' : 'SUB-') +
      String(acta.id).padStart(3, '0')
    );

  const cantidad =
    lecherias.length;

  const monto =
    Number(acta.monto || 0);

  const estadoTexto =
    loteStatusBadge(acta.estado)[1];

  /*
   * Encabezado.
   */
  doc.setFillColor(13, 27, 42);
  doc.rect(0, 0, 210, 28, 'F');

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(15);
  doc.setFont(undefined, 'bold');
  doc.text(nombreDocumento, 12, 13);

  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text(
    `${contextoDocumento} · ${cantidad} lecherías`,
    12,
    20
  );

  /*
   * Datos generales.
   */
  doc.setTextColor(20, 20, 20);
  doc.setFontSize(10);

  let y = 40;

  const filas = [
    ['Documento', numero],
    ['Inicio de obra', acta.fini || '—'],
    ['Término de obra', acta.ffin || '—'],
    ['Administrador', administradorDocumento],
    ['Contratista', acta.contratista || '—'],
    ['Lecherías amparadas', String(cantidad)],
    ['Monto', money(monto)],
    ['Estatus', estadoTexto]
  ];

  filas.forEach(([etiqueta, valor]) => {
    doc.setFont(undefined, 'bold');
    doc.text(`${etiqueta}:`, 14, y);

    doc.setFont(undefined, 'normal');

    const lineas =
      doc.splitTextToSize(
        String(valor),
        120
      );

    doc.text(lineas, 70, y);

    y += Math.max(
      7,
      lineas.length * 5
    );
  });

  /*
   * Observaciones del documento.
   */
  if (
    Array.isArray(acta.obs) &&
    acta.obs.length
  ) {
    y += 3;

    doc.setTextColor(192, 54, 44);
    doc.setFont(undefined, 'bold');
    doc.text('Observaciones:', 14, y);

    y += 6;

    doc.setFont(undefined, 'normal');

    acta.obs.forEach(observacion => {
      const lineas =
        doc.splitTextToSize(
          `• ${observacion}`,
          175
        );

      if (
        y + lineas.length * 5 >
        285
      ) {
        doc.addPage();
        y = 18;
      }

      doc.text(lineas, 16, y);
      y += lineas.length * 5;
    });

    doc.setTextColor(20, 20, 20);
  }

  /*
   * Relación de P.V.
   */
  y += 5;

  if (y > 275) {
    doc.addPage();
    y = 18;
  }

  doc.setFont(undefined, 'bold');
  doc.setFontSize(10);
  doc.text(
    'Lecherías incluidas (Clave P.V.):',
    14,
    y
  );

  y += 7;

  doc.setFont(undefined, 'normal');
  doc.setFontSize(8);

  let linea = '';

  lecherias.forEach((lecheria, indice) => {
    linea += `${lecheria.pv}   `;

    const terminaFila =
      (indice + 1) % 6 === 0;

    const esUltima =
      indice === lecherias.length - 1;

    if (terminaFila || esUltima) {
      if (y > 285) {
        doc.addPage();
        y = 18;
      }

      doc.text(linea.trim(), 16, y);

      y += 5;
      linea = '';
    }
  });

  /*
   * Numeración de páginas.
   */
  const paginas =
    doc.getNumberOfPages();

  for (
    let pagina = 1;
    pagina <= paginas;
    pagina++
  ) {
    doc.setPage(pagina);

    doc.setFontSize(8);
    doc.setTextColor(107, 123, 140);

    doc.text(
      `${numero} · Página ${pagina} de ${paginas}`,
      105,
      292,
      {
        align: 'center'
      }
    );
  }

  /*
   * Descarga.
   */
  const nombreArchivo =
    esDependencia
      ? `Carta_${numero}.pdf`
      : `Acta_${numero}.pdf`;

  doc.save(nombreArchivo);

  toast(
    esDependencia
      ? 'Carátula de la carta generada'
      : 'Carátula del acta generada'
  );
}

let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
