  ];
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Resultado');
  return XLSX.write(libro, { bookType:'xlsx', type:'array' });
}

async function descargarListadoPV(tipo='todo') {
  if (ROLE !== 'gen' && ROLE !== 'admin') {
    toast('Tu perfil no puede realizar esta descarga');
    return;
  }

  const encontrados = Array.isArray(DESCARGA_LISTADO_PV?.encontrados)
    ? DESCARGA_LISTADO_PV.encontrados : [];
  const noEncontrados = Array.isArray(DESCARGA_LISTADO_PV?.noEncontrados)
    ? DESCARGA_LISTADO_PV.noEncontrados : [];
  if (!encontrados.length) {
    toast('Primero carga un archivo con P.V. válidas');
    return;
  }

  const incluirActas = tipo === 'actas' || tipo === 'todo';
  const incluirReportes = tipo === 'reportes' || tipo === 'todo';

  try {
    toast('Preparando descarga por listado…');
    const zip = new JSZip();
    const carpetaActas = incluirActas ? zip.folder('Actas') : null;
    const carpetaReportes = incluirReportes ? zip.folder('Reportes') : null;
    const resultado = [];
    let actasAgregadas = 0;
    let reportesAgregados = 0;

    for (let i=0; i<encontrados.length; i++) {
      const item = encontrados[i];
      const pv = String(item.pv);
      const punto = item.punto;
      const acta = item.acta;
      let estadoActa = incluirActas ? 'Sin acta V2' : 'No solicitada';
      let estadoReporte = incluirReportes ? 'No generado' : 'No solicitado';
      const observaciones = [];

      if (incluirActas) {
        const urlActa = acta?.documento_firmado_v2_url || acta?.documento_generado_v2_url || null;
        if (urlActa) {
          try {
            await agregarArchivoActaZIP(
              carpetaActas,
              urlActa,
              `${String(i+1).padStart(3,'0')}_${pv}_ACTA_INICIO_ENTREGA_RECEPCION`
            );
            estadoActa = acta?.documento_firmado_v2_url ? 'Acta V2 firmada' : 'Acta V2 generada';
            actasAgregadas++;
          } catch (error) {
            estadoActa = 'Error al descargar';
            observaciones.push(`Acta: ${error.message || 'error de descarga'}`);
          }
        }
      }

      if (incluirReportes) {
        if (punto?.status !== 'at') {
          estadoReporte = 'No atendida';
          observaciones.push('Reporte omitido: la P.V. no está atendida');
        } else {
          try {
            const fotos = await cargarFotos(pv);
            const puntoReporte = {
              ...punto,
              fotosStreet:Array.isArray(fotos?.street) ? fotos.street : [],
              fotosPrev:Array.isArray(fotos?.prev) ? fotos.prev : [],
              fotosFin:Array.isArray(fotos?.fin) ? fotos.fin : []
            };
            const blob = await reportePDF(puntoReporte, false);
            if (!blob) throw new Error('el generador no devolvió un PDF');
            carpetaReportes.file(
              `${String(i+1).padStart(3,'0')}_${pv}_REPORTE_ANTES_DESPUES.pdf`,
              blob
            );
            estadoReporte = 'Generado';
            reportesAgregados++;
          } catch (error) {
            estadoReporte = 'Error al generar';
            observaciones.push(`Reporte: ${error.message || 'error de generación'}`);
          }
        }
      }

      resultado.push({
        'P.V.':pv,
        Estado:punto?.estado || '',
        Cuadrilla:punto?.sub || '',
        'Estado avance':punto?.status || '',
        Acta:estadoActa,
        Reporte:estadoReporte,
        Observaciones:observaciones.join(' | ')
      });
    }

    noEncontrados.forEach(pv => {
      resultado.push({
        'P.V.':pv,
        Estado:'',
        Cuadrilla:'',
        'Estado avance':'',
        Acta:'No existe en padrón',
        Reporte:'No existe en padrón',
        Observaciones:'P.V. no encontrada en el catálogo activo cargado por la Bitácora'
      });
    });

    zip.file('resultado_listado_PV.xlsx', crearResumenDescargaListadoPV(resultado));
    const blobZip = await zip.generateAsync({ type:'blob' });
    const fecha = fechaISOlocal(new Date());
    descargarBlobListadoPV(blobZip, `descarga_listado_PV_${fecha}.zip`);
    toast(`Descarga lista: ${actasAgregadas} actas, ${reportesAgregados} reportes`);
  } catch (error) {

function fechaISOlocal(fecha) {
  const y =
    fecha.getFullYear();

  const m =
    String(
      fecha.getMonth() + 1
    ).padStart(2, '0');

  const d =
    String(
      fecha.getDate()
    ).padStart(2, '0');

  return `${y}-${m}-${d}`;
}

function obtenerSemanaActual() {
  const hoy =
    new Date();

  const dia =
    hoy.getDay();

  /*
   * Semana lunes-domingo.
   */
  const diferenciaLunes =
    dia === 0
      ? -6
      : 1 - dia;

  const lunes =
    new Date(hoy);

  lunes.setDate(
    hoy.getDate() +
    diferenciaLunes
  );

  const domingo =
    new Date(lunes);

  domingo.setDate(
    lunes.getDate() + 6
  );

  return {
    inicio:
      fechaISOlocal(lunes),

    fin:
      fechaISOlocal(domingo)
  };
}

function sumarDiasISOReporte(
  iso,
  dias
) {

  const partes =
    String(iso)
      .split('-')
      .map(Number);

  const fecha =
    new Date(
      partes[0],
      partes[1] - 1,
      partes[2],
      12,
      0,
      0
    );

  fecha.setDate(
    fecha.getDate() + dias
  );

  return fechaISOlocal(fecha);
}


function inicioSemanaReporte(
  iso
) {

  const partes =
    String(iso)
      .split('-')
      .map(Number);

  const fecha =
    new Date(
      partes[0],
      partes[1] - 1,
      partes[2],
      12,
      0,
      0
    );

  const dia =
    fecha.getDay();

  const mover =
    dia === 0
      ? -6
      : 1 - dia;

  fecha.setDate(
    fecha.getDate() + mover
  );

  return fechaISOlocal(fecha);
}


function fechaCortaReporte(
  iso
) {

  if (!iso) {
    return '—';
  }

  const partes =
    iso.split('-')
      .map(Number);

  const fecha =
    new Date(
      partes[0],
      partes[1] - 1,
      partes[2],
      12,
      0,
      0
    );

  return fecha
    .toLocaleDateString(
      'es-MX',
      {
        day: '2-digit',
        month: 'short'
      }
    )
    .replace('.', '');
}


function obtenerSemanasPrograma() {

  const semanas =
    new Set();

  (LECH || [])
    .forEach(p => {

      if (!p.fcomp) {
        return;
      }

      semanas.add(
        inicioSemanaReporte(
          p.fcomp
        )
      );
    });

  return [...semanas]
    .sort();
}


function porcentajeReporte(
  realizado,
  programado
) {

  if (!programado) {
    return 0;
  }

  return Number(
    (
      realizado /
      programado *
      100
    ).toFixed(1)
  );
}


function desviacionPorcentualReporte(
  realizado,
  programado
) {

  if (!programado) {
    return 0;
  }

  return Number(
    (
      (
        realizado -
        programado
      ) /
      programado *
      100
    ).toFixed(1)
  );
}


function calcularReporteSemanal(
  inicioSemana
) {

  const inicio =
    inicioSemana;

  const fin =
    sumarDiasISOReporte(
      inicio,
      6
    );

  const hoy =
    fechaISOlocal(
      new Date()
    );


  /*
   * ==========================
   * PROGRAMA DE LA SEMANA
   * ==========================
   */

  const programadasSemana =
    LECH.filter(p =>
      p.fcomp &&
      p.fcomp >= inicio &&
      p.fcomp <= fin
    );


  /*
   * ==========================
   * CUMPLIMIENTO DE LA SEMANA
   * ==========================
   *
   * Importante: para medir la semana
   * comparamos el MISMO universo:
   * P.V. programadas entre inicio y fin
   * que ya tenían Vo.Bo. al cierre.
   *
   * Un Vo.Bo. otorgado esta semana a una
   * P.V. de otra semana NO compensa un
   * compromiso semanal pendiente.
   */

  const atendidasSemana =
    programadasSemana.filter(p =>
      p.vobo === 'ok' &&
      p.fecha_vobo &&
      p.fecha_vobo <= fin
    );


  /*
   * Flujo administrativo independiente:
   * todos los Vo.Bo. que se otorgaron
   * durante la semana, sin importar la
   * fecha compromiso de esas P.V.
   */

  const voboOtorgadosSemana =
    LECH.filter(p =>
      p.vobo === 'ok' &&
      p.fecha_vobo &&
      p.fecha_vobo >= inicio &&
      p.fecha_vobo <= fin
    );


  /*
   * ==========================
   * PROGRAMA ACUMULADO
   * ==========================
   *
   * Todas las lecherías cuya
   * fecha compromiso ya cayó
   * hasta el cierre analizado.
   */

  const programadasAcumuladas =
    LECH.filter(p =>
      p.fcomp &&
      p.fcomp <= fin
    );


  /*
   * ==========================
   * Vo.Bo. TOTALES AL CORTE
   * ==========================
   *
   * Incluye tanto las que
   * pertenecen al programa
   * acumulado como las que
   * fueron adelantadas.
   */

  const atendidasAcumuladas =
    LECH.filter(p =>
      p.vobo === 'ok' &&
      p.fecha_vobo &&
      p.fecha_vobo <= fin
    );


  /*
   * ==========================
   * PENDIENTES DEL PROGRAMA
   * ==========================
   *
   * De las que ya debían estar
   * cumplidas según fcomp,
   * cuáles todavía no tenían
   * Vo.Bo. al cierre.
   */

  const programadasPendientes =
    programadasAcumuladas
      .filter(p =>
        !p.fecha_vobo ||
        p.fecha_vobo > fin
      )
      .length;


  /*
   * AHORA SÍ podemos calcular
   * cumplidasPrograma porque
   * programadasPendientes ya
   * existe.
   */

  const cumplidasPrograma =
    programadasAcumuladas.length -
    programadasPendientes;


  /*
   * ==========================
   * TRABAJOS ADELANTADOS
   * ==========================
   *
   * Tienen Vo.Bo. al corte,
   * pero su fecha compromiso
   * pertenece a una semana
   * posterior.
   */

  const trabajosAdelantados =
    LECH.filter(p =>
      p.vobo === 'ok' &&
      p.fecha_vobo &&
      p.fecha_vobo <= fin &&
      p.fcomp &&
      p.fcomp > fin
    ).length;


  /*
   * ==========================
   * SEMANA
   * ==========================
   */

  const faltantesSemana =
    Math.max(
      programadasSemana.length -
      atendidasSemana.length,
      0
    );


  /*
   * ==========================
   * ACUMULADO
   * ==========================
   *
   * Aquí NO descontamos las
   * adelantadas.
   *
   * Pendientes significa
   * realmente pendientes del
   * programa acumulado.
   */

  const faltantesAcumulados =
    programadasPendientes;


  /*
   * ==========================
   * ESTADO DE LA SEMANA
   * ==========================
   */

  let estadoSemana =
    'cerrada';

  if (inicio > hoy) {

    estadoSemana =
      'futura';

  } else if (
    hoy >= inicio &&
    hoy <= fin
  ) {

    estadoSemana =
      'curso';
  }


  /*
   * ==========================
   * RESULTADO
   * ==========================
   */

  return {

    inicio,
    fin,
    estadoSemana,


    /*
     * SEMANA
     */

    programadasSemana:
      programadasSemana.length,

    atendidasSemana:
      atendidasSemana.length,

    voboOtorgadosSemana:
      voboOtorgadosSemana.length,

    faltantesSemana,

    cumplimientoSemana:
      porcentajeReporte(
        atendidasSemana.length,
        programadasSemana.length
      ),

    desviacionSemana:
      desviacionPorcentualReporte(
        atendidasSemana.length,
        programadasSemana.length
      ),


    /*
     * ACUMULADO REAL DEL PROGRAMA
     */

    programadasAcumuladas:
      programadasAcumuladas.length,

    cumplidasPrograma,

    programadasPendientes,

    faltantesAcumulados,

    cumplimientoAcumulado:
      porcentajeReporte(
        cumplidasPrograma,
        programadasAcumuladas.length
      ),

    desviacionAcumulada:
      desviacionPorcentualReporte(
        cumplidasPrograma,
        programadasAcumuladas.length
      ),


    /*
     * PRODUCCIÓN TOTAL
     */

    trabajosAdelantados,

    atendidasAcumuladas:
      atendidasAcumuladas.length

  };
}

  setTimeout(() => {

function pintarConcentradoActas() {
  const contenedor =
    document.getElementById(
      'actasResultado'
    );

  if (!contenedor) {
    return;
  }

  const registros =
    ACTAS_PERIODO.actas || [];

  const disponibles =
    registros.filter(
      tieneDocumentoActa
    );

  const pendientes =
    registros.filter(
      item =>
        !tieneDocumentoActa(item)
    );

  /*
 * Dentro de las actas disponibles:
 *
 * - cargadas:
 *   existe un documento que fue
 *   cargado/reemplazado por el usuario.
 *
 * - soloGeneradas:
 *   existe únicamente el PDF generado
 *   por el sistema.
 */


const cargadas =
  disponibles.filter(
    item =>
      item.acta &&
      item.acta.documento_firmado_v2_url
  );

const soloGeneradas =
  disponibles.filter(
    item =>
      item.acta &&
      item.acta.documento_generado_v2_url &&
      !item.acta.documento_firmado_v2_url
  );

  const vistaActual =
    VISTA_ACTAS.acta ||
    'disponibles';

  const mostrar =
  vistaActual === 'pendientes'
    ? pendientes
    : disponibles;


/*
 * ==========================
 * PAGINACIÓN
 * ==========================
 */

  Math.max(
    1,
    Math.ceil(
      mostrar.length /
      ACTAS_POR_PAGINA
    )

 * Evita quedar en una página
 * inexistente si cambia el periodo
 * o cambia de Disponibles/Pendientes.

  VISTA_ACTAS.pagina >
  totalPaginas
) {
  VISTA_ACTAS.pagina =
    totalPaginas;
}

) {
  VISTA_ACTAS.pagina = 1;
}

  VISTA_ACTAS.pagina;


const inicioPagina =
  (
    paginaActual - 1

  ACTAS_POR_PAGINA;


const finPagina =
  inicioPagina +
  ACTAS_POR_PAGINA;


const mostrarPagina =
  mostrar.slice(

    finPagina

function cambiarPaginaActas(
  pagina
) {

  const nuevaPagina =
    Number(pagina);

  if (
    !Number.isFinite(
      nuevaPagina
    ) ||
    nuevaPagina < 1
  ) {
    return;
  }

  VISTA_ACTAS.pagina =
    nuevaPagina;

  pintarConcentradoActas();


  /*
   * Regresamos al inicio de
   * la sección de resultados.
   */
  const contenedor =
    document.getElementById(
      'actasResultado'
    );

  if (contenedor) {
    contenedor.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
  }
}

function tieneDocumentoActa(item) {
  return !!(
    item &&
    item.acta &&
    (
      item.acta.documento_generado_v2_url ||
      item.acta.documento_firmado_v2_url
    )
  );
}

function renderGrupoConcentradoActas(
  clase,
  titulo,
  registros
) {

    registros.filter(
      tieneDocumentoActa
    );

  const pendientes =
    registros.filter(
      item =>
        !tieneDocumentoActa(item)
    );

  const vistaActual =
    VISTA_ACTAS[clase] ||
    'disponibles';

  const mostrar =
    vistaActual === 'pendientes'
      ? pendientes
      : disponibles;

  const tarjetas =
    mostrar.length
      ? mostrar
          .map(
            item =>
              renderActaPeriodoItem(
                item,
                clase
              )
          )
          .join('')
      : `
        <div
          style="
            background:#fff;

        >

            vistaActual === 'disponibles'
              ? 'No hay actas disponibles en este periodo.'
              : 'No hay actas pendientes en este periodo.'
          }
        </div>
      `;

  return `
    <div class="sect">

        style="
          font-size:10.5px;
          color:var(--mut);
          margin-bottom:8px;

          margin-bottom:10px;

          type="button"

            vistaActual === 'disponibles'
              ? 'on'
              : ''

            cambiarVistaActas(
              '${clase}',
              'disponibles'
            )
          "
        >
          Disponibles
          (${disponibles.length})

        <button
          type="button"
          class="chip ${
            vistaActual === 'pendientes'
              ? 'on'
              : ''
          }"
          style="flex:1"
          onclick="
            cambiarVistaActas(
              '${clase}',
              'pendientes'
            )
          "
        >
          Pendientes
          (${pendientes.length})

      <div

                )

            >

            </button>
          `
          : ''
      }

    </div>
  `;
}

function cambiarVistaActas(
  clase,
  vista
) {

  if (clase !== 'acta') {
    return;
  }

  if (
    vista !== 'disponibles' &&
    vista !== 'pendientes'
  ) {
    return;
  }

  VISTA_ACTAS.acta =
    vista;

  /*
   * Cada vez que cambiamos entre
   * disponibles y pendientes,
   * regresamos a la página 1.
   */
  VISTA_ACTAS.pagina = 1;

  pintarConcentradoActas();
}

                  rel="noopener noreferrer"
                  style="
                    color:var(--done);
                    text-decoration:none;
                    font-weight:700;
                  "
                >
                  ✓ Firmada
                </a>
              `
              : ''
          }

          ${
            !generada &&
            !firmada
              ? `
                <span
                  style="
                    color:var(--wait);
                  "
                >
                  Sin documento cargado
                </span>
              `
              : ''
          }
        </div>
      </div>

      <div
        class="v"
        style="
          font-size:11px;
          margin-left:10px;
        "
      >
        ${
          clase === 'apertura'
            ? p.fcomp
            : p.freal
        }
      </div>

    </div>
  `;
}

async function descargarActasPeriodo(
  clase
) {
  if (
    ROLE !== 'gen' &&
    ROLE !== 'admin'
  ) {
    toast(
      'Tu perfil no puede descargar este concentrado'
    );

    return;
  }

  /*
   * ACTAS_PERIODO.actas ya contiene
   * únicamente P.V.:
   *
   * - atendidas
   * - con Vo.Bo. aprobado
   * - cuya fecha_vobo está dentro
   *   del periodo seleccionado
   */
  const registros =
    ACTAS_PERIODO.actas || [];

  /*
   * Para el nuevo concentrado únicamente
   * consideramos actas V2.
   *
   * Puede existir:
   * - V2 generada en blanco
   * - V2 firmada/cargada
   */
  const conDocumentos =
    registros.filter(
      x =>
        x.acta &&
        (
          x.acta.documento_generado_v2_url ||
          x.acta.documento_firmado_v2_url
        )
    );

  if (!conDocumentos.length) {
    toast(
      'No hay actas V2 disponibles en este periodo'
    );

    return;
  }

  try {
    toast(
      'Preparando concentrado…'
    );

    const zip =
      new JSZip();

    let indice = 0;

    for (
      const item
      of conDocumentos
    ) {
      indice++;

      const pv =
        String(
          item.punto.pv
        );

      const acta =
        item.acta;

      /*
       * ==========================
       * 1. ACTA V2
       * ==========================
       *
       * Si ya regresó firmada,
       * usamos la firmada.
       *
       * Si todavía no,
       * usamos la V2 generada
       * para impresión y firma.
       */
      const documentoFinal =
        acta.documento_firmado_v2_url ||
        acta.documento_generado_v2_url;

      await agregarArchivoActaZIP(
        zip,
        documentoFinal,
        `${indice}_${pv}_ACTA_INICIO_ENTREGA_RECEPCION`
      );

      /*
       * ==========================
       * 2. REPORTE ANTES / DESPUÉS
       * ==========================
       */
      const fotos =
        await cargarFotos(
          pv
        );

      const puntoReporte = {
        ...item.punto,

        fotosPrev:
          Array.isArray(
            fotos?.prev
          )
            ? fotos.prev
            : [],

        fotosFin:
          Array.isArray(
            fotos?.fin
          )
            ? fotos.fin
            : []
      };

      /*
       * reportePDF() ya está preparado
       * para devolver Blob cuando el
       * segundo parámetro es false.
       */
      const reporteBlob =
        await reportePDF(
          puntoReporte,
          false
        );

      if (!reporteBlob) {
        throw new Error(
          `No fue posible generar el reporte de la P.V. ${pv}`
        );
      }

      /*
       * Se agrega DIRECTAMENTE al ZIP.
       * No existe carpeta por P.V.
       */
      zip.file(
        `${indice}_${pv}_REPORTE_ANTES_DESPUES.pdf`,
        reporteBlob
      );
    }

    const blob =
      await zip.generateAsync({
        type: 'blob'
      });

    const nombre =
      `expedientes_vobo_` +
      `${ACTAS_PERIODO.inicio}_` +
      `${ACTAS_PERIODO.fin}.zip`;

    const enlace =
      document.createElement(
        'a'
      );

    const urlTemporal =
      URL.createObjectURL(
        blob
      );

    enlace.href =
      urlTemporal;

    enlace.download =
      nombre;

    document.body.appendChild(
      enlace
    );

    enlace.click();

    enlace.remove();

    URL.revokeObjectURL(
      urlTemporal
    );

    toast(
      `Concentrado descargado: ${conDocumentos.length} actas y ${conDocumentos.length} reportes`
    );

  } catch (error) {
    console.error(
      'Error preparando ZIP:',
      error
    );

    toast(
      error.message ||
      'No fue posible preparar el concentrado'
    );
  }
}

async function agregarArchivoActaZIP(
  zip,
  url,
  nombreBase
) {
  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {
    throw new Error(
      `No fue posible descargar ${nombreBase}`
    );
  }

  const blob =
    await respuesta.blob();

  let extension =
    'pdf';

  const tipo =
    blob.type || '';

  if (
    tipo.includes('png')
  ) {
    extension =
      'png';
  } else if (
    tipo.includes('jpeg') ||
    tipo.includes('jpg')
  ) {
    extension =
      'jpg';
  }

  zip.file(
    `${nombreBase}.${extension}`,
    blob
  );
}

function reporteInicioPDF() {
  const puntos =
    Array.isArray(visiblePts())
      ? visiblePts()
      : [];

  if (!puntos.length) {
    toast('No existen lecherías en el alcance actual');
    return;
  }

  const { jsPDF } =
    window.jspdf;

  const doc =
    new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

  const margenX = 12;
  const anchoPagina = 210;
  const limiteInferior = 282;

  const esSub =
    ROLE === 'sub';

  const alcance =
    esSub
      ? CURSUB
      : 'Nacional';

  const puntosAtendidos =
    puntos.filter(
      punto => punto.status === 'at'
    ).length;

  const puntosVobo =
    puntos.filter(
      punto => punto.vobo === 'ok'
    ).length;

  const zonas =
    [...new Set(
      puntos
        .map(punto => punto.zona)
        .filter(Boolean)
    )]
      .sort();

  const subs =
    [...new Set(
      puntos
        .map(punto => punto.sub)
        .filter(Boolean)
    )]
      .sort();

  /*
   * La fecha de arranque se toma de METAS.
   * Para un subcontratista usa su propia fecha.
   * En alcance nacional usa la fecha más temprana.
   */
  const fechasInicio =
    esSub
      ? [
          METAS[CURSUB]?.inicio
        ].filter(Boolean)
      : Object.values(METAS)
          .map(meta => meta.inicio)
          .filter(Boolean);

  const fechaInicio =
    fechasInicio.length
      ? fechasInicio.sort()[0]
      : '';

  const fechasTermino =
    esSub
      ? [
          METAS[CURSUB]?.termino
        ].filter(Boolean)
      : Object.values(METAS)
          .map(meta => meta.termino)
          .filter(Boolean);

  const fechaTermino =
    fechasTermino.length
      ? fechasTermino.sort().at(-1)
      : '';

  const metaSemanal =
    esSub
      ? Number(
          METAS[CURSUB]?.semana || 0
        )
      : subs.reduce(
          (total, sub) =>
            total +
            Number(
              METAS[sub]?.semana || 0
            ),
          0
        );

  const metaMensual =
    esSub
      ? Number(
          METAS[CURSUB]?.mes || 0
        )
      : subs.reduce(
          (total, sub) =>
            total +
            Number(
              METAS[sub]?.mes || 0
            ),
          0
        );

  function formatoFechaDocumento(
    valor
  ) {
    if (!valor) {
      return 'Sin fecha definida';
    }

    const partes =
      String(valor).split('-');

    if (partes.length !== 3) {
      return String(valor);
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function agregarEncabezado() {
    doc.setFillColor(13, 27, 42);

    doc.rect(
      0,
      0,
      anchoPagina,
      31,
      'F'
    );

    doc.setTextColor(
      255,
      255,
      255
    );

    doc.setFont(
      undefined,
      'bold'
    );

    doc.setFontSize(14);

    doc.text(
      'Reporte de inicio de trabajos',
      margenX,
      12
    );

    doc.setFont(
      undefined,
      'normal'
    );

    doc.setFontSize(8.5);

    doc.text(
      'Junta de arranque · Pintura de fachadas de lecherías',
      margenX,
      19
    );

    doc.text(
      `Procedimiento ${PROCEDIMIENTO}`,
      margenX,
      25
    );

    doc.setTextColor(
      20,
      20,
      20
    );
  }

  function nuevaPagina() {
    doc.addPage();

    agregarEncabezado();

    return 40;
  }

  function asegurarEspacio(
    y,
    alto
  ) {
    if (
      y + alto >
      limiteInferior
    ) {
      return nuevaPagina();
    }

    return y;
  }

  function escribirFila(
    etiqueta,
    valor,
    y
  ) {
    y =
      asegurarEspacio(
        y,
        8
      );

      'bold'
    );

      undefined,
      'normal'
    );

    const lineas =
      doc.splitTextToSize(
        String(valor),
        128
      );

    doc.text(
      lineas,
      66,
      y

  );

  const paginas =

  ) {

    );

      {
        align: 'center'
      }
    );
  }

  const alcanceSeguro =
    String(alcance)
      .replace(
        /[^0-9A-Za-z_-]/g,
        '_'
      );

  doc.save(
    `Reporte_inicio_trabajos_${alcanceSeguro}.pdf`
  );

  toast(
    'Reporte de inicio de trabajos generado'
  );
}

function loteCard(lote) {
  const [claseBadge, textoBadge] =
    loteStatusBadge(lote.estado);

  const pvs = Array.isArray(lote.pvs)
    ? lote.pvs
    : [];

  const cantidad = Number(
    lote.cantidad_lecherias ?? pvs.length
  );

  const monto = Number(
    lote.monto ?? cantidad * PRECIO_FACHADA
  );

  const numero = lote.numero ||
    `${lote.tipo === 'dependencia' ? 'DEP' : 'SUB'}-` +
    String(lote.id).padStart(3, '0');

  const referencia = lote.tipo === 'dependencia'
    ? (lote.zona || 'Nacional')
    : (lote.sub || 'Sin cuadrilla');

  const tarjeta = document.createElement('div');

  tarjeta.className = 'lotecard';
  tarjeta.onclick = () => openActa(lote.id);

  tarjeta.innerHTML = `
    <div class="top">
      <div class="ic ${
        lote.tipo === 'dependencia'
          ? 'ic-dep'
          : 'ic-con'
      }">
        ${lote.tipo === 'dependencia' ? '🏛️' : '👷'}
      </div>

      <div class="nm">
        <b>
          ${lote.tipo === 'dependencia' ? 'Carta' : 'Acta'}
          ${numero}
        </b>
        <span>
          ${referencia} ·
          ${cantidad} lecherías
        </span>
      </div>

      <span class="acta-badge ${claseBadge}">
        ${textoBadge}
      </span>
    </div>

    <div class="foot">
      <div class="f">
        <div class="v">${cantidad}</div>
        <div class="k">Lecherías</div>
      </div>

      <div class="f">
        <div class="v">${money(monto)}</div>
        <div class="k">Monto</div>
      </div>

      <div class="f">
        <div class="v">${lote.ffin || '—'}</div>
        <div class="k">Término</div>
      </div>
    </div>
  `;

  return tarjeta;
}

async function openActa(id) {

  toast('No se encontró el acta');
  return;
}

try {
  ACTA_DETALLE =
    await obtenerDetalleActa(ACTA_CUR.id);

  if (
    !ACTA_DETALLE ||
    !ACTA_DETALLE.acta ||
    !Array.isArray(ACTA_DETALLE.lecherias)
  ) {
    throw new Error(
      'La base de datos devolvió un detalle incompleto'
    );
  }

  /*
   * Usamos el registro devuelto por la RPC como fuente
   * principal, porque contiene la información más reciente.
   */
  ACTA_CUR = ACTA_DETALLE.acta;

} catch (error) {
  console.error(
    'No fue posible cargar el detalle del acta:',
    error
  );

  ACTA_DETALLE = null;

  toast(
    error.message ||
    'No fue posible cargar el detalle del acta'

function toggleObs(o,el){
  const i=ACTA_OBS_SEL.indexOf(o);
  if(i>=0){ACTA_OBS_SEL.splice(i,1);el.classList.remove('on');}
  else{ACTA_OBS_SEL.push(o);el.classList.add('on');}
}

async function uploadActa() {
  if (!ACTA_CUR) return;

  if (ACTA_CUR.estado === 'aprobada') {
    toast('No se puede modificar un acta aprobada');
    return;
  }

  const input = document.createElement('input');

  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';

  input.onchange = async () => {
    const archivo = input.files?.[0];

    if (!archivo) return;

    const limite = 20 * 1024 * 1024;

    if (archivo.size > limite) {
      toast('El archivo no debe superar 20 MB');
      return;
    }

    try {
      toast('Cargando documento…');

      const actaActualizada =
        await subirDocumentoActa(
          ACTA_CUR,
          archivo
        );

      const indice = LOTES.findIndex(
        acta => acta.id === ACTA_CUR.id
      );

      if (indice !== -1) {
        LOTES[indice] = actaActualizada;
      }

      ACTA_CUR = actaActualizada;

      toast('Acta cargada — pasa a revisión');
      openActa(ACTA_CUR.id);
      await renderActas();
    } catch (error) {
      console.error(error);

      toast(
        error.message ||
        'No fue posible cargar el acta'
      );
    }
  };

  input.click();
}

async function aprobarActa() {
  if (!ACTA_CUR) return;

  const esDependencia =
    ACTA_CUR.tipo === 'dependencia';

  const rolEsperado =
    esDependencia ? 'dep' : 'admin';

  if (ROLE !== rolEsperado) {
    toast('Tu perfil no puede aprobar este documento');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'aprobada',
        []
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast(
      esDependencia
        ? '✅ Carta aprobada por la dependencia'
        : '✅ Acta aprobada — lista para cobro'
    );

    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible aprobar el documento'
    );
  }
}

async function rechazarActa() {
    if (!ACTA_CUR) return;

  const puedeRechazar =
    (
      ACTA_CUR.tipo === 'contratista' &&
      ROLE === 'admin'
    ) ||
    (
      ACTA_CUR.tipo === 'dependencia' &&
      ROLE === 'dep'
    );

  if (!puedeRechazar) {
    toast('Tu perfil no puede rechazar este documento');
    return;
  }
  const libre =
    document.getElementById('obsLibre');

  const textoLibre =
    libre ? libre.value.trim() : '';

  const observaciones = [...ACTA_OBS_SEL];

  if (textoLibre) {
    observaciones.push(textoLibre);
  }

  if (!observaciones.length) {
    toast('Marca al menos una observación');
    return;
  }

  try {
    const actaActualizada =
      await revisarActaBD(
        ACTA_CUR.id,
        'rechazada',
        observaciones
      );

    const indice = LOTES.findIndex(
      acta => acta.id === ACTA_CUR.id
    );

    if (indice !== -1) {
      LOTES[indice] = actaActualizada;
    }

    ACTA_CUR = actaActualizada;

    toast('Acta rechazada con observaciones');
    openActa(ACTA_CUR.id);
    await renderActas();
  } catch (error) {
    console.error(error);

    toast(
      error.message ||
      'No fue posible rechazar el acta'
    );
  }
}


function actaPDF() {
  if (
    !ACTA_CUR ||
    !ACTA_DETALLE ||
    !Array.isArray(ACTA_DETALLE.lecherias)
  ) {
    toast('Primero abre el detalle completo del documento');
    return;
  }

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });

  const acta = ACTA_CUR;
  const lecherias = ACTA_DETALLE.lecherias;

  const esDependencia =
    acta.tipo === 'dependencia';

  const administradorDocumento =
  esDependencia
    ? (
        acta.admin ||
        `Administrador · ${DEPENDENCIA}`
      )
    : EMPRESA;

  const nombreDocumento =
    esDependencia
      ? 'Carta de entrega-recepción'
      : 'Acta de conformidad';

  const contextoDocumento =
    esDependencia
      ? 'Con la dependencia'
      : 'Corte con cuadrilla';

  const numero =
    acta.numero ||
    (
      (esDependencia ? 'DEP-' : 'SUB-') +
      String(acta.id).padStart(3, '0')
    );

  const cantidad =
    lecherias.length;

  const monto =
    Number(acta.monto || 0);

  const estadoTexto =
    loteStatusBadge(acta.estado)[1];

  /*
   * Encabezado.
   */
  doc.setFillColor(13, 27, 42);
  doc.rect(0, 0, 210, 28, 'F');

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(15);
  doc.setFont(undefined, 'bold');
  doc.text(nombreDocumento, 12, 13);

  doc.setFontSize(9);
  doc.setFont(undefined, 'normal');
  doc.text(
    `${contextoDocumento} · ${cantidad} lecherías`,
    12,
    20
  );

  /*
   * Datos generales.
   */
  doc.setTextColor(20, 20, 20);
  doc.setFontSize(10);

  let y = 40;

  const filas = [
    ['Documento', numero],
    ['Inicio de obra', acta.fini || '—'],
    ['Término de obra', acta.ffin || '—'],
    ['Administrador', administradorDocumento],
    ['Contratista', acta.contratista || '—'],
    ['Lecherías amparadas', String(cantidad)],
    ['Monto', money(monto)],
    ['Estatus', estadoTexto]
  ];

  filas.forEach(([etiqueta, valor]) => {
    doc.setFont(undefined, 'bold');
    doc.text(`${etiqueta}:`, 14, y);

    doc.setFont(undefined, 'normal');

    const lineas =
      doc.splitTextToSize(
        String(valor),
        120
      );

    doc.text(lineas, 70, y);

    y += Math.max(
      7,
      lineas.length * 5
    );
  });

  /*
   * Observaciones del documento.
   */
  if (
    Array.isArray(acta.obs) &&
    acta.obs.length
  ) {
    y += 3;

    doc.setTextColor(192, 54, 44);
    doc.setFont(undefined, 'bold');
    doc.text('Observaciones:', 14, y);

    y += 6;

    doc.setFont(undefined, 'normal');

    acta.obs.forEach(observacion => {
      const lineas =
        doc.splitTextToSize(
          `• ${observacion}`,
          175
        );

      if (
        y + lineas.length * 5 >
        285
      ) {
        doc.addPage();
        y = 18;
      }

      doc.text(lineas, 16, y);
      y += lineas.length * 5;
    });

    doc.setTextColor(20, 20, 20);
  }

  /*
   * Relación de P.V.
   */
  y += 5;

  if (y > 275) {
    doc.addPage();
    y = 18;
  }

  doc.setFont(undefined, 'bold');
  doc.setFontSize(10);
  doc.text(
    'Lecherías incluidas (Clave P.V.):',
    14,
    y
  );

  y += 7;

  doc.setFont(undefined, 'normal');
  doc.setFontSize(8);

  let linea = '';

  lecherias.forEach((lecheria, indice) => {
    linea += `${lecheria.pv}   `;

    const terminaFila =
      (indice + 1) % 6 === 0;

    const esUltima =
      indice === lecherias.length - 1;

    if (terminaFila || esUltima) {
      if (y > 285) {
        doc.addPage();
        y = 18;
      }

      doc.text(linea.trim(), 16, y);

      y += 5;
      linea = '';
    }
  });

  /*
   * Numeración de páginas.
   */
  const paginas =
    doc.getNumberOfPages();

  for (
    let pagina = 1;
    pagina <= paginas;
    pagina++
  ) {
    doc.setPage(pagina);

    doc.setFontSize(8);
    doc.setTextColor(107, 123, 140);

    doc.text(
      `${numero} · Página ${pagina} de ${paginas}`,
      105,
      292,
      {
        align: 'center'
      }
    );
  }

  /*
   * Descarga.
   */
  const nombreArchivo =
    esDependencia
      ? `Carta_${numero}.pdf`
      : `Acta_${numero}.pdf`;

  doc.save(nombreArchivo);

  toast(
    esDependencia
      ? 'Carátula de la carta generada'
      : 'Carátula del acta generada'
  );
}

function claveEntidadEstimacion(valor) {
  return String(valor || 'Sin entidad')
    .trim()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase();
}

function nombreEntregaEstimacion(numero) {
  const nombres = {
    1: 'UNO',
    2: 'DOS',
    3: 'TRES',
    4: 'CUATRO',
    5: 'CINCO'
  };

  return nombres[Number(numero)] ||
    String(numero);
}

function fechaEstimadaMX(valor) {
  if (!valor) {
    return '—';
  }

  const partes =
    String(valor).slice(0, 10).split('-');

  if (partes.length !== 3) {
    return valor;
  }

  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function textoSeguroLumen(valor) {
  return String(valor ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function claveAtributoLumen(valor) {
  return encodeURIComponent(
    String(valor ?? '')
  ).replace(/'/g, '%27');
}

function resumenEstadosEstimacion(datos) {
  const estimacion =
    datos.estimacion || {};

  const numeroActual =
    Number(estimacion.numero || 1);

  const catalogo =
    Array.isArray(datos.catalogo)
      ? datos.catalogo
      : [];

  const lecherias =
    Array.isArray(datos.lecherias)
      ? datos.lecherias
      : [];

  const entregas =
    Array.isArray(datos.entregas)
      ? datos.entregas
      : [];

  const porClave = new Map();

  function asegurar(estado) {
    const clave =
      claveEntidadEstimacion(estado);

    if (!porClave.has(clave)) {
      porClave.set(clave, {
        clave,
        estado:
          estado || 'Sin entidad',
        catalogo: 0,
        puntosActuales: [],
        entregas: new Map()
      });
    }

    return porClave.get(clave);
  }

  catalogo.forEach(item => {
    const grupo =
      asegurar(item.estado);

    grupo.estado =
      item.estado || grupo.estado;

    grupo.catalogo =
      Number(item.cantidad || 0);
  });

  entregas.forEach(item => {
    const grupo =
      asegurar(item.estado);

    const numero =
      Number(item.numero || 0);

    grupo.entregas.set(numero, {
      cantidad:
        Number(item.cantidad || 0),
      importe:
        Number(item.importe || 0)
    });
  });

  lecherias.forEach(punto => {
    const grupo =
      asegurar(punto.estado);

    grupo.puntosActuales.push(punto);
  });

  /*
   * Mientras la estimación está en borrador,
   * la entrega actual todavía no existe en el
   * histórico cerrado; se incorpora solo para
   * la vista y el archivo preliminar.
   */
  if (estimacion.estado !== 'cerrada') {
    porClave.forEach(grupo => {
      const cantidad =
        grupo.puntosActuales.length;

      if (cantidad) {
        grupo.entregas.set(numeroActual, {
          cantidad,
          importe:
            cantidad *
            Number(
              estimacion.precio_unitario ||
              PRECIO_FACHADA
            )
        });
      }
    });
  }

  return [...porClave.values()]
    .map(grupo => {
      let anteriores = 0;
      let acumuladas = 0;

      grupo.entregas.forEach(
        (entrega, numero) => {
          if (numero < numeroActual) {
            anteriores +=
              entrega.cantidad;
          }

          if (numero <= numeroActual) {
            acumuladas +=
              entrega.cantidad;
          }
        }
      );

      const actual =
        grupo.puntosActuales.length;

      return {
        ...grupo,
        anteriores,
        actual,
        acumuladas,
        pendientes:
          Math.max(
            grupo.catalogo - acumuladas,
            0
          )
      };
    })
    .sort((a, b) =>
      a.estado.localeCompare(
        b.estado,
        'es',
        {
          sensitivity: 'base'
        }
      )
    );
}

function renderEstimacionLumenEspecial() {

      </div>

async function cargarVistaEstimacionLumen(
  numero = null
) {
  const sc =
    document.getElementById(
      'estimacionLumenEspecial'
    );

  if (!sc) {
    return;
  }

  try {
    ESTIMACION_LUMEN =
      await obtenerEstimacionLumen(numero);

    ESTIMACION_LUMEN_ADELANTADAS_SEL.clear();

    pintarVistaEstimacionLumen();

  } catch (error) {
    console.error(
      'No fue posible consultar la estimación LUMEN:',
      error
    );

    sc.innerHTML = `
      <div class="sect">
        <div class="note" style="border-left:4px solid var(--rej)">
          <b>No fue posible cargar la estimación interna.</b>
          <br><br>
          ${error.message || 'Revisa que el script SQL de estimaciones haya sido ejecutado.'}
        </div>
      </div>
    `;
  }
}

function marcarAdelantadaLumen(
  pvCodificada,
  marcada
) {
  const pv =
    decodeURIComponent(pvCodificada);

  if (marcada) {
    ESTIMACION_LUMEN_ADELANTADAS_SEL.add(pv);
  } else {
    ESTIMACION_LUMEN_ADELANTADAS_SEL.delete(pv);
  }

  const contador =
    document.getElementById(
      'contadorAdelantadasLumen'
    );

  const boton =
    document.getElementById(
      'btnAgregarAdelantadasLumen'
    );

  if (contador) {
    contador.textContent =
      `${ESTIMACION_LUMEN_ADELANTADAS_SEL.size} seleccionadas`;
  }

  if (boton) {
    boton.disabled =
      ESTIMACION_LUMEN_ADELANTADAS_SEL.size === 0;
  }
}

function seleccionarPaginaAdelantadasLumen() {
  const candidatas =
    candidatasAdelantadasLumen();

  const inicio =
    (ESTIMACION_LUMEN_ADELANTADAS_PAGINA - 1) * 10;

  candidatas
    .slice(inicio, inicio + 10)
    .forEach(punto =>
      ESTIMACION_LUMEN_ADELANTADAS_SEL.add(
        String(punto.pv)
      )
    );

  pintarVistaEstimacionLumen();
}

async function guardarConfiguracionEstimacionLumen() {
  const estimacion =
    ESTIMACION_LUMEN?.estimacion;

  if (!estimacion) {
    return;
  }

  const fechaInicio =
    document.getElementById(
      'estimacionLumenFechaInicio'
    )?.value;

  const fechaFin =
    document.getElementById(
      'estimacionLumenFechaFin'
    )?.value;

  const meta =
    document.getElementById(
      'estimacionLumenMeta'
    )?.value ?? '';

  if (!fechaInicio || !fechaFin) {
    toast('Indica las dos fechas del periodo');
    return;
  }

  if (fechaInicio > fechaFin) {
    toast('La fecha inicial no puede ser posterior a la final');
    return;
  }

  if (
    meta !== '' &&
    Number(meta) <= 0
  ) {
    toast('La meta debe ser mayor que cero');
    return;
  }

  const confirmado = window.confirm(
    '¿Guardar el periodo y la meta?\n\nEl borrador se recalculará con las fechas indicadas.'
  );

  if (!confirmado) {
    return;
  }

  try {
    toast('Guardando configuración…');

    ESTIMACION_LUMEN =
      await actualizarConfiguracionEstimacionLumen(
        estimacion.id,
        fechaInicio,
        fechaFin,
        meta
      );

    ESTIMACION_LUMEN_ADELANTADAS_SEL.clear();
    pintarVistaEstimacionLumen();
    toast('Periodo y meta actualizados');
  } catch (error) {
    console.error(error);
    toast(
      error.message ||
      'No fue posible guardar la configuración'
    );
  }
}

async function agregarAdelantadasSeleccionadasLumen() {

  const pvs = [

}

async function quitarAdelantadaLumen(
  pvCodificada

  const estimacion =

    pintarVistaEstimacionLumen();

}

async function cargarListadoOficialEstimacionLumenDesdeArchivo(archivo) {
  const estimacion = ESTIMACION_LUMEN?.estimacion;

  if (!estimacion || estimacion.estado !== 'borrador') {
    toast('Sólo puedes cargar un listado oficial en una estimación en borrador');
    return;
  }

  if (!archivo) return;

  try {
    const buffer = await archivo.arrayBuffer();
    const libro = XLSX.read(buffer, { type: 'array' });
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const matriz = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '' });

    if (!matriz.length) throw new Error('El archivo no contiene datos');

    const numero = Number(estimacion.numero);
    const normalizarCabecera = valor => String(valor ?? '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();

    const cabeceras = (matriz[0] || []).map(normalizarCabecera);
    let indice = cabeceras.findIndex(h =>
      new RegExp(`(?:estimacion|est)\\s*${numero}(?:\\D|$)`, 'i').test(h)
    );

    if (indice < 0) {
      indice = cabeceras.findIndex(h =>
        h === String(numero) || h === `estimacion ${numero}` || h === `est ${numero}`
      );
    }

    if (indice < 0) {
      throw new Error(
        `No encontré una columna para la Estimación ${numero}. Encabezados detectados: ` +
        (matriz[0] || []).filter(Boolean).join(' | ')
      );
    }

    const catalogoSet = new Set(
      (window.LECH || []).map(x => String(x.pv || '').trim()).filter(Boolean)
    );
    const leidas = [];

    for (let i = 1; i < matriz.length; i++) {
      const pv = normalizarPVTemporal(matriz[i]?.[indice], catalogoSet);
      if (pv) leidas.push(pv);
    }

    if (!leidas.length) {
      throw new Error(`La columna de Estimación ${numero} no contiene P.V.`);
    }

    const conteo = new Map();
    leidas.forEach(pv => conteo.set(pv, (conteo.get(pv) || 0) + 1));
    const duplicadas = [...conteo.entries()]
      .filter(([, n]) => n > 1)
      .map(([pv]) => pv);
    const pvs = [...new Set(leidas)];

    const confirmar = window.confirm(
      `¿Cargar ${pvs.length} P.V. como listado oficial de la Estimación ${numero}?\n\n` +
      `Este archivo reemplazará cualquier listado oficial previamente cargado para esta estimación.\n` +
      `No modifica Vo.Bo., avances ni lecherías.`
    );

    if (!confirmar) return;

    toast('Cargando listado oficial…');

    const { data, error } = await sb.rpc(
      'cargar_listado_oficial_estimacion_lumen',
      {
        p_estimacion_id: Number(estimacion.id),
        p_pvs: pvs
      }
    );

    if (error) throw error;

    ESTIMACION_LUMEN_LISTADO_ARCHIVO_INFO = {
      nombre: archivo.name,
      totalFilas: leidas.length,
      unicas: pvs.length,
      duplicadas
    };

    ESTIMACION_LUMEN = data;
    ESTIMACION_LUMEN_ADELANTADAS_SEL.clear();
    pintarVistaEstimacionLumen();
    toast(`Listado oficial cargado: ${pvs.length} P.V.`);
  } catch (error) {
    console.error('No fue posible cargar el listado oficial:', error);
    toast(error.message || 'No fue posible cargar el listado oficial');
  } finally {
    const input = document.getElementById('estimacionLumenArchivoOficial');
    if (input) input.value = '';
  }
}

async function abrirPvPendienteVoboEstimacionLumen(pvCodificada) {
  const pv = decodeURIComponent(pvCodificada);
  const punto = (window.LECH || LECH || []).find(
    x => String(x.pv || '').trim() === String(pv || '').trim()
  );

  if (!punto) {
    toast(`No se encontró la P.V. ${pv} en el padrón cargado`);
    return;
  }

  await openSheet(punto.id);
}

function pintarVistaEstimacionLumen() {
  const sc =
    document.getElementById(
      'estimacionLumenEspecial'
    );

  if (!sc) {
    return;
  }

  const datos =
    ESTIMACION_LUMEN || {};

  const estimacion =
    datos.estimacion;

  if (!estimacion) {
    sc.innerHTML = `
      <div class="sect">
        <div class="note">
          No existe una estimación configurada.
          Ejecuta primero el script SQL entregado.
        </div>
      </div>
    `;

    return;
  }

  const resumen =
    datos.resumen || {};

  const historial =
    Array.isArray(datos.historial)
      ? datos.historial
      : [];

  const grupos =
    resumenEstadosEstimacion(datos)
      .filter(grupo =>
        grupo.actual > 0 ||
        grupo.acumuladas > 0
      );

  const cantidadPeriodo =
    Number(resumen.cantidad_periodo || 0);

  const cantidadAdelantadas =
    Number(resumen.cantidad_adelantadas || 0);

  const cantidad =
    Number(resumen.cantidad || 0);

  const pendientesVobo =
    Number(resumen.pendientes_vobo_total || 0);

  const meta =
    estimacion.meta_pv === null
      ? null
      : Number(estimacion.meta_pv || 0);

  const faltantesMeta =
    meta
      ? Math.max(meta - cantidad, 0)
      : 0;

  const porcentaje =
    meta
      ? Math.min(
          Math.round(
            cantidad / meta * 100
          ),
          100
        )
      : 100;

  const cerrado =
    estimacion.estado === 'cerrada';


  const listadoOficialActivo =
    resumen.listado_oficial_activo === true;

  const listadoOficialTotal = Number(resumen.listado_oficial_total || 0);
  const listadoEncontradas = Number(resumen.listado_encontradas || 0);
  const listadoConVobo = Number(resumen.listado_con_vobo || 0);
  const listadoSinVobo = Number(resumen.listado_sin_vobo || 0);
  const listadoNoAtendidas = Number(resumen.listado_no_atendidas || 0);
  const listadoNoEncontradas = Number(resumen.listado_no_encontradas || 0);
  const listadoBloqueadas = Number(resumen.listado_bloqueadas_historicas || 0);

  const listadoPendientesVobo = listaListadoOficialLumen(x =>
    x.existe && x.activo && x.status === 'at' && x.vobo !== 'ok'
  );
  const listadoPendientesAtencion = listaListadoOficialLumen(x =>
    x.existe && x.activo && x.status !== 'at'
  );
  const listadoInexistentes = listaListadoOficialLumen(x => !x.existe);
  const listadoBloqueadasDetalle = listaListadoOficialLumen(x => x.bloqueada_historica);

  const listadoConciliado = listadoOficialActivo &&
    listadoOficialTotal > 0 &&
    listadoConVobo === listadoOficialTotal &&

    listadoNoAtendidas === 0 &&
    listadoSinVobo === 0 &&
    listadoBloqueadas === 0 &&
    cantidad === listadoOficialTotal;

  const opciones =
    historial
      .map(item => `
        <option

            Number(item.numero) ===

async function confirmarCierreEstimacionLumen() {
  const datos =
    ESTIMACION_LUMEN || {};

  const estimacion =
    datos.estimacion || {};

  const cantidad =
    Number(
      datos.resumen?.cantidad || 0
    );

  const meta =
    Number(estimacion.meta_pv || 0);

  const advertencia =
    meta && cantidad < meta
      ? `\n\nADVERTENCIA: se cerrará con ${cantidad} de ${meta} P.V. Después del cierre no podrán añadirse más P.V. a esta estimación.`
      : '';

  const aceptado = window.confirm(
    `¿Cerrar definitivamente la estimación ${estimacion.numero}?\n\nLas ${cantidad} claves quedarán congeladas y no podrán incluirse en otra estimación.${advertencia}`
  );

  if (!aceptado) {
    return;
  }

  try {
    toast('Cerrando estimación…');

    ESTIMACION_LUMEN =
      await cerrarEstimacionLumen(
        estimacion.id
      );

    pintarVistaEstimacionLumen();

    toast('Estimación cerrada correctamente');

  } catch (error) {
    console.error(
      'No fue posible cerrar la estimación:',
      error
    );

    toast(
      error.message ||
      'No fue posible cerrar la estimación'
    );
  }
}

function cargarExcelJSLumen() {
  if (window.ExcelJS) {
    return Promise.resolve(window.ExcelJS);
  }

  if (EXCELJS_LUMEN_PROMESA) {
    return EXCELJS_LUMEN_PROMESA;
  }

  EXCELJS_LUMEN_PROMESA =
    new Promise((resolve, reject) => {
      const script =
        document.createElement('script');

      script.src =
        'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';

      script.onload = () =>
        resolve(window.ExcelJS);

      script.onerror = () =>
        reject(
          new Error(
            'No fue posible cargar el generador de Excel'
          )
        );

      document.head.appendChild(script);
    });

  return EXCELJS_LUMEN_PROMESA;
}

function aplicarBordesEstimacion(
  hoja,
  rango,
  color = '808080'
) {
  const [inicio, fin] =
    rango.split(':');

  const celdaInicio =
    hoja.getCell(inicio);

  const celdaFin =
    hoja.getCell(fin);

  for (
    let fila = celdaInicio.row;
    fila <= celdaFin.row;
    fila++
  ) {
    for (
      let columna = celdaInicio.col;
      columna <= celdaFin.col;
      columna++
    ) {
      hoja.getCell(fila, columna).border = {
        top: {
          style: 'thin',
          color: { argb: color }
        },
        left: {
          style: 'thin',
          color: { argb: color }
        },
        bottom: {
          style: 'thin',
          color: { argb: color }
        },
        right: {
          style: 'thin',
          color: { argb: color }
        }
      };
    }
  }
}

      estimacion.fecha_inicio
    );
  hoja.getCell('L3').value = 'AL';
  hoja.mergeCells('M3:O3');
  hoja.getCell('M3').value =
    fechaEstimadaMX(
      estimacion.fecha_fin
    );

  hoja.getCell('B4').value = 'SERVICIO';
  hoja.mergeCells('C4:G5');
  hoja.getCell('C4').value =
    SERVICIO_ESTIMACION;
  hoja.mergeCells('H4:I4');
  hoja.getCell('H4').value = 'PROVEEDOR';
  hoja.mergeCells('J4:O4');
  hoja.getCell('J4').value = EMPRESA;
  hoja.mergeCells('H5:J5');
  hoja.getCell('H5').value =
    'LOCALIZAC. DE LA OBRA:';
  hoja.mergeCells('K5:O5');
  hoja.getCell('K5').value =
    'DIFERENTES ESTADOS DE LA REPÚBLICA MEXICANA';

  hoja.mergeCells('B9:O10');
  hoja.getCell('B9').value = 'OBSERVACIONES';

  hoja.mergeCells('B12:B13');
  hoja.getCell('B12').value = 'CLAVE:';
  hoja.mergeCells('C12:C13');
  hoja.getCell('C12').value = 'Estado';
  hoja.mergeCells('D12:D13');
  hoja.getCell('D12').value = 'Municipio';
  hoja.mergeCells('E12:E13');
  hoja.getCell('E12').value = 'Localidad';
  hoja.mergeCells('F12:F13');
  hoja.getCell('F12').value = 'UNIDAD';
  hoja.mergeCells('G12:G13');
  hoja.getCell('G12').value =
    'Puntos de Venta';
  hoja.getCell('H12').value = 'PRECIO';
  hoja.getCell('H13').value = 'UNITARIO';
  hoja.mergeCells('I12:I13');
  hoja.getCell('I12').value = 'IMPORTE';
  hoja.mergeCells('J12:N12');
  hoja.getCell('J12').value =
    'V O L Ú M E N E S   D E   S E R V I C I O S';
  hoja.getCell('J13').value =
    'SEGÚN CATÁLOGO';
  hoja.getCell('K13').value =
    'SERVICIOS ANTERIORES';
  hoja.getCell('L13').value =
    'DE ESTE SERVICIO';
  hoja.getCell('M13').value =
    'TOTAL A LA FECHA';
  hoja.getCell('N13').value =
    'POR EJECUTAR';
  hoja.mergeCells('O12:O13');
  hoja.getCell('O12').value =
    'IMPORTE DE LOS SERVICIOS';

  ['B2:O5', 'B9:O10', 'B12:O13']
    .forEach(rango =>
      aplicarBordesEstimacion(
        hoja,
        rango
      )
    );

  for (let fila = 1; fila <= 13; fila++) {
    hoja.getRow(fila).eachCell(
      { includeEmpty: true },
      celda => {
        celda.font = {
          name: 'Arial',
          size: fila >= 12 ? 7 : 8,
          bold:
            fila === 2 ||
            fila === 3 ||
            fila === 12 ||
            fila === 13
        };

        celda.alignment = {
          horizontal: 'center',
          vertical: 'middle',
          wrapText: true
        };
      }
    );
  }

  hoja.getRow(4).height = 30;
  hoja.getRow(5).height = 22;
  hoja.getRow(9).height = 20;
  hoja.getRow(10).height = 20;
  hoja.getRow(12).height = 23;
  hoja.getRow(13).height = 32;

  ['B12:O13'].forEach(rango => {
    const [inicio, fin] = rango.split(':');
    const ci = hoja.getCell(inicio);
    const cf = hoja.getCell(fin);

    for (let r = ci.row; r <= cf.row; r++) {
      for (let c = ci.col; c <= cf.col; c++) {
        hoja.getCell(r, c).fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'D9EAF7' }
        };
      }
    }
  });

  const filasEstado = [];
  let filaActual = 14;
  let filasPagina = 0;

  function agregarFirmas(intermedia = true) {
    const inicio = filaActual + 1;

    hoja.mergeCells(`B${inicio}:D${inicio}`);
    hoja.getCell(`B${inicio}`).value =
      'ÁREA REQUIRENTE';
    hoja.mergeCells(`F${inicio}:J${inicio}`);
    hoja.getCell(`F${inicio}`).value =
      'ÁREA ADMINISTRATIVA';
    hoja.mergeCells(`L${inicio}:O${inicio}`);
    hoja.getCell(`L${inicio}`).value =
      'PROVEEDOR';

    hoja.mergeCells(`B${inicio + 1}:D${inicio + 1}`);
    hoja.getCell(`B${inicio + 1}`).value =
      FIRMANTES_ESTIMACION.requirente.area;
    hoja.mergeCells(`F${inicio + 1}:J${inicio + 1}`);
    hoja.getCell(`F${inicio + 1}`).value =
      FIRMANTES_ESTIMACION.administrativa.area;
    hoja.mergeCells(`L${inicio + 1}:O${inicio + 1}`);
    hoja.getCell(`L${inicio + 1}`).value =
      FIRMANTES_ESTIMACION.proveedor.area;

    hoja.mergeCells(`B${inicio + 5}:D${inicio + 5}`);
    hoja.getCell(`B${inicio + 5}`).value =
      FIRMANTES_ESTIMACION.requirente.nombre;
    hoja.mergeCells(`F${inicio + 5}:J${inicio + 5}`);
    hoja.getCell(`F${inicio + 5}`).value =
      FIRMANTES_ESTIMACION.administrativa.nombre;
    hoja.mergeCells(`L${inicio + 5}:O${inicio + 5}`);
    hoja.getCell(`L${inicio + 5}`).value =
      FIRMANTES_ESTIMACION.proveedor.nombre;

    hoja.mergeCells(`B${inicio + 6}:D${inicio + 6}`);
    hoja.getCell(`B${inicio + 6}`).value =
      FIRMANTES_ESTIMACION.requirente.cargo;
    hoja.mergeCells(`F${inicio + 6}:J${inicio + 6}`);
    hoja.getCell(`F${inicio + 6}`).value =
      FIRMANTES_ESTIMACION.administrativa.cargo;
    hoja.mergeCells(`L${inicio + 6}:O${inicio + 6}`);
    hoja.getCell(`L${inicio + 6}`).value =
      FIRMANTES_ESTIMACION.proveedor.cargo;

    hoja.addImage(
      firmaId,
      {
        tl: {
          col: 11.6,
          row: inicio + 0.6
        },
        ext: {
          width: 128,
          height: 58
        }
      }
    );

    for (
      let fila = inicio;
      fila <= inicio + 6;
      fila++
    ) {
      hoja.getRow(fila).eachCell(
        { includeEmpty: true },
        celda => {
          celda.font = {
            name: 'Arial',
            size: 7,
            bold:
              fila === inicio ||
              fila >= inicio + 5
          };
          celda.alignment = {
            horizontal: 'center',
            vertical: 'middle',
            wrapText: true
          };
        }
      );
    }

    hoja.getRow(inicio + 2).height = 15;
    hoja.getRow(inicio + 3).height = 15;
    hoja.getRow(inicio + 4).height = 15;

    filaActual = inicio + 8;

    if (intermedia) {
      hoja.getRow(filaActual - 1)
        .addPageBreak();
      filasPagina = 0;
    }
  }

  grupos.forEach((grupo, indiceGrupo) => {
    if (filasPagina >= 35) {
      agregarFirmas(true);
    }

    const filaEstado = filaActual++;
    filasEstado.push(filaEstado);
    filasPagina++;

    hoja.getCell(`B${filaEstado}`).value =
      String(grupo.estado).toUpperCase();
    hoja.getCell(`F${filaEstado}`).value =
      'SERVICIOS';
    hoja.getCell(`G${filaEstado}`).value =
      grupo.catalogo;
    hoja.getCell(`J${filaEstado}`).value = {
      formula: `G${filaEstado}`,
      result: grupo.catalogo
    };
    hoja.getCell(`K${filaEstado}`).value =
      grupo.anteriores;
    hoja.getCell(`L${filaEstado}`).value =
      grupo.actual;
    hoja.getCell(`M${filaEstado}`).value = {
      formula:
        `K${filaEstado}+L${filaEstado}`,
      result: grupo.acumuladas
    };
    hoja.getCell(`N${filaEstado}`).value = {
      formula:
        `MAX(J${filaEstado}-M${filaEstado},0)`,
      result: grupo.pendientes

    for (let c = 2; c <= 15; c++) {

        hoja.getCell(filaEstado, c);

      celda.font = {
        name: 'Arial',

      celda.alignment = {

      };

    aplicarBordesEstimacion(
      hoja,
      `B${filaEstado}:O${filaEstado}`,
      'A6A6A6'
    );

    grupo.puntosActuales.forEach(punto => {
      if (filasPagina >= 38) {
        agregarFirmas(true);

      const fila = filaActual++;
      filasPagina++;

      hoja.getCell(`B${fila}`).value =
        String(punto.pv || '');

        punto.estado || '';
      hoja.getCell(`D${fila}`).value =
        punto.municipio || '';
      hoja.getCell(`E${fila}`).value =
        punto.localidad || '';
      hoja.getCell(`F${fila}`).value =
        'Servicio';
      hoja.getCell(`G${fila}`).value = 1;
      hoja.getCell(`H${fila}`).value =
        Number(
          punto.precio_unitario ||
          estimacion.precio_unitario
        );
      hoja.getCell(`I${fila}`).value = {
        formula: `G${fila}*H${fila}`,
        result:
          Number(
            punto.precio_unitario ||
            estimacion.precio_unitario
          )
      };
      hoja.getCell(`J${fila}`).value = 1;
      hoja.getCell(`K${fila}`).value = 0;
      hoja.getCell(`L${fila}`).value = 1;
      hoja.getCell(`M${fila}`).value = {
        formula: `K${fila}+L${fila}`,
        result: 1
      };
      hoja.getCell(`N${fila}`).value = {
        formula: `MAX(J${fila}-M${fila},0)`,
        result: 0
      };
      hoja.getCell(`O${fila}`).value = {
        formula: `L${fila}*H${fila}`,
        result:
          Number(
            punto.precio_unitario ||
            estimacion.precio_unitario
          )
      };

      for (let c = 2; c <= 15; c++) {
        const celda =
          hoja.getCell(fila, c);

        celda.font = {
          name: 'Arial',
          size: 7
        };
        celda.alignment = {
          horizontal:
            c >= 7 ? 'center' : 'left',
          vertical: 'middle',
          wrapText: true
        };
      }

      hoja.getCell(`B${fila}`).numFmt = '@';
      hoja.getCell(`H${fila}`).numFmt =
        '$#,##0.00';
      hoja.getCell(`I${fila}`).numFmt =
        '$#,##0.00';
      hoja.getCell(`O${fila}`).numFmt =
        '$#,##0.00';

      aplicarBordesEstimacion(
        hoja,
        `B${fila}:O${fila}`,
        'BFBFBF'
      );
    });
  });

  if (filasPagina > 28) {
    agregarFirmas(true);
  }

  const filaTotales =
    filaActual + 1;

  hoja.getCell(`B${filaTotales}`).value =
    'TOTALES';
  hoja.getCell(`F${filaTotales}`).value =
    'SERVICIO';
  hoja.getCell(`G${filaTotales}`).value =
    Number(datos.resumen.catalogo_total || 0);
  hoja.getCell(`H${filaTotales}`).value =
    Number(estimacion.precio_unitario);
  hoja.getCell(`I${filaTotales}`).value = {
    formula:
      `G${filaTotales}*H${filaTotales}`,
    result:
      Number(datos.resumen.catalogo_total || 0) *
      Number(estimacion.precio_unitario)
  };
  hoja.getCell(`J${filaTotales}`).value = {
    formula: `G${filaTotales}`,
    result:
      Number(datos.resumen.catalogo_total || 0)
  };
  hoja.getCell(`K${filaTotales}`).value = {
    formula:
      todosGrupos.length
        ? String(
            todosGrupos.reduce(
              (suma, grupo) =>
                suma + grupo.anteriores,
              0
            )
          )
        : '0',
    result:
      todosGrupos.reduce(
        (suma, grupo) =>
          suma + grupo.anteriores,
        0
      )
  };
  hoja.getCell(`L${filaTotales}`).value =
    Number(datos.resumen.cantidad || 0);
  hoja.getCell(`M${filaTotales}`).value = {
    formula:
      `K${filaTotales}+L${filaTotales}`,
    result:
      todosGrupos.reduce(
        (suma, grupo) =>
          suma + grupo.acumuladas,
        0
      )
  };
  hoja.getCell(`N${filaTotales}`).value = {
    formula:
      `MAX(J${filaTotales}-M${filaTotales},0)`,
    result: Math.max(
      Number(datos.resumen.catalogo_total || 0) -
      todosGrupos.reduce(
        (suma, grupo) =>
          suma + grupo.acumuladas,
        0
      ),
      0
    )
  };
  hoja.getCell(`O${filaTotales}`).value = {
    formula:
      `L${filaTotales}*H${filaTotales}`,
    result:
      Number(datos.resumen.subtotal || 0)
  };

  for (let c = 2; c <= 15; c++) {
    const celda =
      hoja.getCell(filaTotales, c);

    celda.font = {
      name: 'Arial',
      size: 8,
      bold: true
    };
    celda.fill = {
      type: 'pattern',
      pattern: 'solid',
      fgColor: { argb: 'D9EAF7' }
    };
    celda.alignment = {
      horizontal: 'center',
      vertical: 'middle'
    };
  }

  aplicarBordesEstimacion(
    hoja,
    `B${filaTotales}:O${filaTotales}`
  );

  hoja.getCell(`H${filaTotales}`).numFmt =
    '$#,##0.00';
  hoja.getCell(`I${filaTotales}`).numFmt =
    '$#,##0.00';
  hoja.getCell(`O${filaTotales}`).numFmt =
    '$#,##0.00';

  const filaSubtotal =
    filaTotales + 3;

  hoja.getCell(`N${filaSubtotal}`).value =
    'SUBTOTAL';
  hoja.getCell(`O${filaSubtotal}`).value = {
    formula: `O${filaTotales}`,
    result:
      Number(datos.resumen.subtotal || 0)
  };
  hoja.getCell(`N${filaSubtotal + 1}`).value =
    'IVA';
  hoja.getCell(`O${filaSubtotal + 1}`).value = {
    formula: `O${filaSubtotal}*16%`,
    result:
      Number(datos.resumen.iva || 0)
  };
  hoja.getCell(`N${filaSubtotal + 2}`).value =
    'TOTAL';
  hoja.getCell(`O${filaSubtotal + 2}`).value = {
    formula:
      `O${filaSubtotal}+O${filaSubtotal + 1}`,
    result:
      Number(datos.resumen.total || 0)
  };

  for (
    let fila = filaSubtotal;
    fila <= filaSubtotal + 2;
    fila++
  ) {
    hoja.getCell(`N${fila}`).font = {
      name: 'Arial',
      size: 8,
      bold: true
    };
    hoja.getCell(`O${fila}`).font = {
      name: 'Arial',
      size: 8,
      bold: true
    };
    hoja.getCell(`O${fila}`).numFmt =
      '$#,##0.00';

    aplicarBordesEstimacion(
      hoja,
      `N${fila}:O${fila}`
    );
  }

  filaActual = filaSubtotal + 3;
  agregarFirmas(false);

  hoja.pageSetup.printTitlesRow = '1:13';
  hoja.pageSetup.printArea =
    `B1:O${filaActual}`;
  hoja.headerFooter.oddFooter =
    `&CEstimación ${estimacion.numero} · Página &P de &N`;

  return hoja;
}

function prepararHojaResumenEstimacion(
  libro,
  datos,
  logoId,
  firmaId
) {
  const estimacion =
    datos.estimacion;

  const grupos =
    resumenEstadosEstimacion(datos)
      .filter(grupo =>
        grupo.acumuladas > 0
      );

  const hoja =
    libro.addWorksheet(
      'RESUMEN',
      {
        pageSetup: {
          paperSize: 9,
          orientation: 'landscape',
          fitToPage: true,
          fitToWidth: 1,
          fitToHeight: 1,
          horizontalCentered: true,
          margins: {
            left: 0.2,
            right: 0.2,
            top: 0.3,
            bottom: 0.3,
            header: 0.1,
            footer: 0.1
          }
        }
      }
    );

  hoja.views = [
    {
      showGridLines: false
    }
  ];

  const anchos = [
    5, 22, 12, 10, 14,
    9, 15, 9, 15, 9,
    15, 9, 15, 9, 15,
    12, 12, 17, 17, 17
  ];

  anchos.forEach((ancho, indice) => {
    hoja.getColumn(indice + 1).width = ancho;
  });

  hoja.addImage(
    logoId,
    {
      tl: { col: 7.1, row: 0.1 },
      ext: { width: 82, height: 64 }
    }
  );

  hoja.mergeCells('A2:I2');
  hoja.getCell('A2').value = EMPRESA;
  hoja.mergeCells('L2:M2');
  hoja.getCell('L2').value = 'No. DE ENTREGA';
  hoja.mergeCells('N2:O2');
  hoja.getCell('N2').value =
    nombreEntregaEstimacion(
      estimacion.numero
    );

  hoja.mergeCells('A3:B3');
  hoja.getCell('A3').value = 'No. DE CONTRATO';
  hoja.mergeCells('C3:I3');
  hoja.getCell('C3').value = PROCEDIMIENTO;

  hoja.getCell('A5').value = 'SERVICIO';
  hoja.mergeCells('B5:I8');
  hoja.getCell('B5').value =
    SERVICIO_ESTIMACION;
  hoja.mergeCells('J5:L5');
  hoja.getCell('J5').value =
    `PERIODO DE ${estimacion.numero}A ENTREGA:`;
  hoja.mergeCells('M5:P5');
  hoja.getCell('M5').value =
    fechaEstimadaMX(
      estimacion.fecha_inicio
    );
  hoja.getCell('Q5').value = 'AL';
  hoja.mergeCells('R5:T5');
  hoja.getCell('R5').value =
    fechaEstimadaMX(
      estimacion.fecha_fin
    );
  hoja.mergeCells('J7:K7');
  hoja.getCell('J7').value = 'PROVEEDOR';
  hoja.mergeCells('L7:T7');
  hoja.getCell('L7').value = EMPRESA;
  hoja.mergeCells('L8:T8');
  hoja.getCell('L8').value =
    'DIFERENTES ESTADOS DE LA REPÚBLICA MEXICANA';
  hoja.mergeCells('J9:L9');
  hoja.getCell('J9').value =
    'LOCALIZAC. DE LA OBRA:';

  hoja.mergeCells('A12:T13');
  hoja.getCell('A12').value =
    'OBSERVACIONES:';

  hoja.mergeCells('A16:A18');
  hoja.getCell('A16').value = 'No.';
  hoja.mergeCells('B16:Q16');
  hoja.getCell('B16').value =
    'RESUMEN DE ENTREGAS';
  hoja.mergeCells('R16:R18');
  hoja.getCell('R16').value =
    'IMPORTE TOTAL P.V.';
  hoja.mergeCells('S16:S18');
  hoja.getCell('S16').value =
    'IMPORTE P.V. EJECUTADOS';
  hoja.mergeCells('T16:T18');
  hoja.getCell('T16').value =
    'IMPORTE P.V. POR EJECUTAR';

  hoja.mergeCells('B17:B18');
  hoja.getCell('B17').value = 'CONCEPTO';
  hoja.mergeCells('C17:C18');
  hoja.getCell('C17').value = 'UNIDAD';
  hoja.mergeCells('D17:D18');
  hoja.getCell('D17').value = 'PV';
  hoja.mergeCells('E17:E18');
  hoja.getCell('E17').value = 'P.U.';

  for (let numero = 1; numero <= 5; numero++) {
    const columnaCantidad =
      6 + (numero - 1) * 2;

    hoja.getCell(17, columnaCantidad).value =
      `CAN ${String(numero).padStart(2, '0')}`;
    hoja.getCell(17, columnaCantidad + 1).value =
      'IMPORTE';
    hoja.mergeCells(
      18,
      columnaCantidad,
      18,
      columnaCantidad + 1
    );
    hoja.getCell(18, columnaCantidad).value =
      `ENTREGA ${String(numero).padStart(2, '0')}`;
  }

  hoja.mergeCells('P17:P18');
  hoja.getCell('P17').value =
    'TOTAL EJECUTADOS';
  hoja.mergeCells('Q17:Q18');
  hoja.getCell('Q17').value =
    'POR EJECUTAR';

  ['A2:T9', 'A12:T13', 'A16:T18']
    .forEach(rango =>
      aplicarBordesEstimacion(
        hoja,
        rango
      )
    );

  for (let fila = 1; fila <= 18; fila++) {
    hoja.getRow(fila).eachCell(
      { includeEmpty: true },
      celda => {
        celda.font = {
          name: 'Arial',
          size: fila >= 16 ? 7 : 8,
          bold:
            fila === 2 ||
            fila === 3 ||
            fila >= 16
        };
        celda.alignment = {
          horizontal: 'center',
          vertical: 'middle',
          wrapText: true
        };
      }
    );
  }

  for (let fila = 16; fila <= 18; fila++) {
    for (let c = 1; c <= 20; c++) {
      hoja.getCell(fila, c).fill = {
        type: 'pattern',
        pattern: 'solid',
        fgColor: { argb: 'D9EAF7' }
      };
    }
  }

  hoja.getRow(5).height = 24;
  hoja.getRow(16).height = 20;
  hoja.getRow(17).height = 22;
  hoja.getRow(18).height = 24;

  let fila = 20;

  grupos.forEach((grupo, indice) => {
    hoja.getCell(`A${fila}`).value = indice + 1;
    hoja.getCell(`B${fila}`).value =
      String(grupo.estado).toUpperCase();
    hoja.getCell(`C${fila}`).value = 'SERVICIO';
    hoja.getCell(`D${fila}`).value =
      grupo.catalogo;
    hoja.getCell(`E${fila}`).value =
      Number(estimacion.precio_unitario);

    for (
      let numero = 1;
      numero <= 5;
      numero++
    ) {
      const columnaCantidad =
        6 + (numero - 1) * 2;

      const entrega =
        grupo.entregas.get(numero) || {
          cantidad: 0,
          importe: 0
        };

      hoja.getCell(
        fila,
        columnaCantidad
      ).value = entrega.cantidad || null;

      hoja.getCell(
        fila,
        columnaCantidad + 1
      ).value = entrega.importe || null;

      hoja.getCell(
        fila,
        columnaCantidad + 1
      ).numFmt = '$#,##0.00';
    }

    hoja.getCell(`P${fila}`).value = {
      formula:
        `SUM(F${fila},H${fila},J${fila},L${fila},N${fila})`,
      result: grupo.acumuladas
    };
    hoja.getCell(`Q${fila}`).value = {
      formula:
        `MAX(D${fila}-P${fila},0)`,
      result: grupo.pendientes
    };
    hoja.getCell(`R${fila}`).value = {
      formula: `D${fila}*E${fila}`,
      result:
        grupo.catalogo *
        Number(estimacion.precio_unitario)
    };
    hoja.getCell(`S${fila}`).value = {
      formula: `P${fila}*E${fila}`,
      result:
        grupo.acumuladas *
        Number(estimacion.precio_unitario)
    };
    hoja.getCell(`T${fila}`).value = {
      formula: `Q${fila}*E${fila}`,
      result:
        grupo.pendientes *
        Number(estimacion.precio_unitario)
    };

    for (let c = 1; c <= 20; c++) {
      const celda =
        hoja.getCell(fila, c);

      celda.font = {
        name: 'Arial',
        size: 7
      };
      celda.alignment = {
        horizontal:
          c === 2 ? 'left' : 'center',
        vertical: 'middle',
        wrapText: true
      };
    }

    ['E', 'G', 'I', 'K', 'M', 'O', 'R', 'S', 'T']
      .forEach(columna => {
        hoja.getCell(`${columna}${fila}`).numFmt =
          '$#,##0.00';
      });

    aplicarBordesEstimacion(
      hoja,
      `A${fila}:T${fila}`,
      'BFBFBF'
    );

    fila++;
  });

  const filaTotal = fila + 1;

  hoja.mergeCells(`A${filaTotal}:C${filaTotal}`);
  hoja.getCell(`A${filaTotal}`).value = 'TOTALES';

  const catalogoTotal =
    Number(datos.resumen.catalogo_total || 0);

  const ejecutadasTotal =
    grupos.reduce(
      (suma, grupo) =>
        suma + grupo.acumuladas,
      0
    );

  const pendientesTotal =
    Math.max(
      catalogoTotal - ejecutadasTotal,
      0
    );

  hoja.getCell(`D${filaTotal}`).value =
    catalogoTotal;

  for (
    let numero = 1;
    numero <= 5;
    numero++
  ) {
    const columnaCantidad =
      6 + (numero - 1) * 2;

    const letraCantidad =
      hoja.getColumn(columnaCantidad).letter;

    const letraImporte =
      hoja.getColumn(columnaCantidad + 1).letter;

    const cantidad =
      grupos.reduce(
        (suma, grupo) =>
          suma +
          Number(
            grupo.entregas.get(numero)?.cantidad ||
            0
          ),
        0
      );

    const importe =
      grupos.reduce(
        (suma, grupo) =>
          suma +
          Number(
            grupo.entregas.get(numero)?.importe ||
            0
          ),
        0
      );

    hoja.getCell(
      filaTotal,
      columnaCantidad
    ).value = {
      formula:
        grupos.length
          ? `SUM(${letraCantidad}20:${letraCantidad}${fila - 1})`
          : '0',
      result: cantidad
    };

    hoja.getCell(
      filaTotal,
      columnaCantidad + 1
    ).value = {
      formula:
        grupos.length
          ? `SUM(${letraImporte}20:${letraImporte}${fila - 1})`
          : '0',
      result: importe
    };
  }

  hoja.getCell(`P${filaTotal}`).value = {
    formula:
      `SUM(F${filaTotal},H${filaTotal},J${filaTotal},L${filaTotal},N${filaTotal})`,
    result: ejecutadasTotal
  };
  hoja.getCell(`Q${filaTotal}`).value = {
    formula:
      `MAX(D${filaTotal}-P${filaTotal},0)`,
    result: pendientesTotal
  };
  hoja.getCell(`R${filaTotal}`).value = {
    formula:
      `D${filaTotal}*$E$20`,
    result:
      catalogoTotal *
      Number(estimacion.precio_unitario)
  };
  hoja.getCell(`S${filaTotal}`).value = {
    formula:
      `P${filaTotal}*$E$20`,
    result:
      ejecutadasTotal *
      Number(estimacion.precio_unitario)
  };
  hoja.getCell(`T${filaTotal}`).value = {
    formula:
      `Q${filaTotal}*$E$20`,
    result:
      pendientesTotal *
      Number(estimacion.precio_unitario)
  };

  for (let c = 1; c <= 20; c++) {
    const celda =
      hoja.getCell(filaTotal, c);

    celda.font = {
      name: 'Arial',
      size: 8,
      bold: true
    };
    celda.fill = {
      type: 'pattern',
      pattern: 'solid',
      fgColor: { argb: 'D9EAF7' }
    };
    celda.alignment = {
      horizontal: 'center',
      vertical: 'middle'
    };
  }

  aplicarBordesEstimacion(
    hoja,
    `A${filaTotal}:T${filaTotal}`
  );

  ['E', 'G', 'I', 'K', 'M', 'O', 'R', 'S', 'T']
    .forEach(columna => {
      hoja.getCell(`${columna}${filaTotal}`).numFmt =
        '$#,##0.00';
    });

  const filaResumen = filaTotal + 3;

  hoja.mergeCells(`B${filaResumen}:F${filaResumen}`);
  hoja.getCell(`B${filaResumen}`).value =
    'RESUMEN SERVICIOS';

  const conceptos = [
    ['IMPORTE', Number(datos.resumen.subtotal || 0)],
    ['IVA', Number(datos.resumen.iva || 0)],
    ['TOTAL', Number(datos.resumen.total || 0)]
  ];

  conceptos.forEach((item, indice) => {
    const r = filaResumen + 1 + indice;

    hoja.mergeCells(`B${r}:F${r}`);
    hoja.getCell(`B${r}`).value = item[0];
    hoja.mergeCells(`G${r}:I${r}`);
    hoja.getCell(`G${r}`).value = item[1];
    hoja.getCell(`G${r}`).numFmt = '$#,##0.00';
    hoja.mergeCells(`Q${r}:R${r}`);
    hoja.getCell(`Q${r}`).value = item[0];
    hoja.mergeCells(`S${r}:T${r}`);
    hoja.getCell(`S${r}`).value = item[1];
    hoja.getCell(`S${r}`).numFmt = '$#,##0.00';

    aplicarBordesEstimacion(
      hoja,
      `B${r}:I${r}`
    );
    aplicarBordesEstimacion(
      hoja,
      `Q${r}:T${r}`
    );
  });

  const inicioFirmas = filaResumen + 6;

  hoja.mergeCells(`B${inicioFirmas}:D${inicioFirmas}`);
  hoja.getCell(`B${inicioFirmas}`).value =
    'ÁREA REQUIRENTE';
  hoja.mergeCells(`J${inicioFirmas}:N${inicioFirmas}`);
  hoja.getCell(`J${inicioFirmas}`).value =
    'ÁREA ADMINISTRATIVA';
  hoja.mergeCells(`Q${inicioFirmas}:T${inicioFirmas}`);
  hoja.getCell(`Q${inicioFirmas}`).value =
    'PROVEEDOR';

  hoja.mergeCells(`B${inicioFirmas + 1}:D${inicioFirmas + 1}`);
  hoja.getCell(`B${inicioFirmas + 1}`).value =
    FIRMANTES_ESTIMACION.requirente.area;
  hoja.mergeCells(`J${inicioFirmas + 1}:N${inicioFirmas + 1}`);
  hoja.getCell(`J${inicioFirmas + 1}`).value =
    FIRMANTES_ESTIMACION.administrativa.area;
  hoja.mergeCells(`Q${inicioFirmas + 1}:T${inicioFirmas + 1}`);
  hoja.getCell(`Q${inicioFirmas + 1}`).value =
    FIRMANTES_ESTIMACION.proveedor.area;

  hoja.mergeCells(`B${inicioFirmas + 5}:D${inicioFirmas + 5}`);
  hoja.getCell(`B${inicioFirmas + 5}`).value =
    FIRMANTES_ESTIMACION.requirente.nombre;
  hoja.mergeCells(`J${inicioFirmas + 5}:N${inicioFirmas + 5}`);
  hoja.getCell(`J${inicioFirmas + 5}`).value =
    FIRMANTES_ESTIMACION.administrativa.nombre;
  hoja.mergeCells(`Q${inicioFirmas + 5}:T${inicioFirmas + 5}`);
  hoja.getCell(`Q${inicioFirmas + 5}`).value =
    FIRMANTES_ESTIMACION.proveedor.nombre;

  hoja.mergeCells(`B${inicioFirmas + 6}:D${inicioFirmas + 6}`);
  hoja.getCell(`B${inicioFirmas + 6}`).value =
    FIRMANTES_ESTIMACION.requirente.cargo;
  hoja.mergeCells(`J${inicioFirmas + 6}:N${inicioFirmas + 6}`);
  hoja.getCell(`J${inicioFirmas + 6}`).value =
    FIRMANTES_ESTIMACION.administrativa.cargo;
  hoja.mergeCells(`Q${inicioFirmas + 6}:T${inicioFirmas + 6}`);
  hoja.getCell(`Q${inicioFirmas + 6}`).value =
    FIRMANTES_ESTIMACION.proveedor.cargo;

  hoja.addImage(
    firmaId,
    {
      tl: {
        col: 16.7,
        row: inicioFirmas + 0.5
      },
      ext: {
        width: 150,
        height: 68
      }
    }
  );

  for (
    let r = inicioFirmas;
    r <= inicioFirmas + 6;
    r++
  ) {
    hoja.getRow(r).eachCell(
      { includeEmpty: true },
      celda => {
        celda.font = {
          name: 'Arial',
          size: 7,
          bold:
            r === inicioFirmas ||
            r >= inicioFirmas + 5
        };
        celda.alignment = {
          horizontal: 'center',
          vertical: 'middle',
          wrapText: true
        };
      }
    );
  }

  hoja.pageSetup.printArea =
    `A1:T${inicioFirmas + 6}`;
  hoja.headerFooter.oddFooter =
    `&CResumen · Estimación ${estimacion.numero} · Página &P de &N`;

  return hoja;
}
